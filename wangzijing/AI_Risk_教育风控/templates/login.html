<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 教育风控系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --canvas: #dde1e3;
            --workspace: #eef2f0;
            --surface: #ffffff;
            --ink: #18201d;
            --muted: #707c76;
            --line: #dce4e0;
            --lime: #c7f45a;
            --lime-strong: #acd93d;
        }

        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        button, input { font: inherit; }
        body {
            margin: 0;
            padding: 0;
            color: var(--ink);
            background: var(--workspace);
            font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        }
        :focus-visible { outline: 3px solid rgba(172, 217, 61, .45); outline-offset: 2px; }

        .login-shell {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background:
                radial-gradient(circle at 15% 12%, rgba(199, 244, 90, .22), transparent 28%),
                var(--workspace);
            border: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .login-header,
        .login-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 24px 34px;
        }
        .login-brand {
            display: inline-flex;
            align-items: center;
            gap: 11px;
            color: var(--ink);
            font-size: 20px;
            font-weight: 800;
        }
        .brand-mark {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--lime);
            background: var(--ink);
            border-radius: 13px;
            transform: rotate(-5deg);
        }
        .system-name, .login-footer { color: var(--muted); font-size: 12px; }

        .login-main {
            min-height: 0;
            flex: 1 1 auto;
            display: grid;
            grid-template-columns: minmax(0, 1.08fr) minmax(340px, .78fr);
            align-items: center;
            gap: 64px;
            padding: 28px 64px 40px;
        }
        .login-copy { max-width: 570px; }
        .login-kicker {
            display: inline-block;
            margin-bottom: 18px;
            color: #577065;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .16em;
        }
        .login-copy h1 {
            margin: 0 0 20px;
            font-size: clamp(42px, 5.3vw, 70px);
            line-height: 1.06;
            letter-spacing: -.055em;
        }
        .login-copy > p {
            max-width: 480px;
            margin: 0;
            color: #66716c;
            font-size: 14px;
            line-height: 1.8;
        }

        .login-card {
            width: min(100%, 420px);
            justify-self: end;
            padding: 36px;
            background: var(--surface);
            border: 1px solid #e0e7e3;
            border-radius: 24px;
            box-shadow: 0 24px 70px rgba(32, 50, 42, .09);
        }
        .welcome-icon {
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            color: #536558;
            background: #eff5df;
            border-radius: 13px;
            font-size: 20px;
        }
        .login-card h2 { margin: 0 0 7px; font-size: 26px; letter-spacing: -.4px; }
        .login-subtitle { margin: 0 0 28px; color: var(--muted); font-size: 13px; }
        .form-label { display: block; margin: 0 0 7px; font-size: 13px; font-weight: 700; }
        .field { position: relative; margin-bottom: 17px; }
        .field > i:first-child {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #7b8581;
            pointer-events: none;
        }
        .field input {
            width: 100%;
            height: 50px;
            padding: 0 46px 0 44px;
            color: var(--ink);
            background: #f7f9f8;
            border: 1px solid #d9e1dd;
            border-radius: 13px;
            transition: border-color .18s, box-shadow .18s, background .18s;
        }
        .field input:focus {
            outline: 0;
            background: white;
            border-color: var(--lime-strong);
            box-shadow: 0 0 0 4px rgba(172, 217, 61, .14);
        }
        .password-toggle {
            position: absolute;
            top: 7px;
            right: 7px;
            width: 36px;
            height: 36px;
            padding: 0;
            color: #76817c;
            background: transparent;
            border: 0;
            border-radius: 9px;
            cursor: pointer;
        }
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin: -1px 0 18px;
            color: var(--muted);
            font-size: 11px;
        }
        .remember-label { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
        .login-error {
            display: none;
            margin: -4px 0 14px;
            padding: 10px 12px;
            color: #963535;
            background: #fff0f0;
            border-radius: 10px;
            font-size: 12px;
        }
        .login-error.show { display: block; }
        .login-submit {
            width: 100%;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #172018;
            background: var(--lime);
            border: 0;
            border-radius: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: transform .18s, background .18s;
        }
        .login-submit:hover { background: #bceb4d; transform: translateY(-1px); }
        .login-submit:disabled { cursor: wait; opacity: .72; transform: none; }
        .login-trust {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            margin-top: 19px;
            color: #7a8580;
            font-size: 10px;
        }

        @media (max-width: 850px) {
            body { padding: 0; display: block; }
            .login-shell { min-height: 100vh; border: 0; border-radius: 0; }
            .login-main { grid-template-columns: 1fr; gap: 28px; padding: 30px 24px 44px; }
            .login-copy { max-width: none; }
            .login-copy h1 { font-size: clamp(40px, 11vw, 64px); }
            .login-card { width: 100%; justify-self: stretch; }
        }
        @media (max-width: 520px) {
            .login-header, .login-footer { padding: 20px; }
            .system-name { display: none; }
            .login-card { padding: 28px 22px; }
            .form-options, .login-footer { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
<div class="login-shell">
    <header class="login-header">
        <div class="login-brand"><span class="brand-mark"><i class="bi bi-shield-check"></i></span><span>EduGuard</span></div>
        <span class="system-name">教育行业风控系统</span>
    </header>

    <main class="login-main">
        <section class="login-copy">
            <span class="login-kicker">EDUCATION RISK CONTROL</span>
            <h1>让教育业务<br>更安全、更清晰。</h1>
            <p>覆盖课程报名、退费申请、身份认证、账号与设备风险，帮助风控人员快速完成判断与处置。</p>

        </section>

        <section class="login-card" aria-labelledby="login-title">
            <span class="welcome-icon"><i class="bi bi-fingerprint"></i></span>
            <h2 id="login-title">欢迎登录</h2>
            <p class="login-subtitle">角色权限将在登录后自动匹配</p>

            <form id="loginForm" novalidate>
                <label class="form-label" for="username">账号</label>
                <div class="field">
                    <i class="bi bi-person"></i>
                    <input id="username" name="username" type="text" autocomplete="username" placeholder="请输入账号" required maxlength="50" autofocus>
                </div>

                <label class="form-label" for="password">密码</label>
                <div class="field">
                    <i class="bi bi-lock"></i>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required maxlength="128">
                    <button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码"><i class="bi bi-eye"></i></button>
                </div>

                <div class="form-options">
                    <label class="remember-label" for="remember"><input id="remember" type="checkbox"> 记住登录</label>
                    <span>忘记密码请联系管理员</span>
                </div>

                <div class="login-error" id="loginError" role="alert"></div>
                <button class="login-submit" id="loginSubmit" type="submit"><span>登录系统</span><i class="bi bi-arrow-right"></i></button>
            </form>

            <div class="login-trust"><i class="bi bi-shield-check"></i><span>账号角色由系统统一校验</span></div>
        </section>
    </main>

    <footer class="login-footer"><span>© 2026 EduGuard</span><span>安全 · 稳定 · 可追溯</span></footer>
</div>

<script>
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('passwordToggle');
    const submitButton = document.getElementById('loginSubmit');
    const errorBox = document.getElementById('loginError');

    passwordToggle.addEventListener('click', () => {
        const shouldShow = passwordInput.type === 'password';
        passwordInput.type = shouldShow ? 'text' : 'password';
        passwordToggle.innerHTML = `<i class="bi ${shouldShow ? 'bi-eye-slash' : 'bi-eye'}"></i>`;
        passwordToggle.setAttribute('aria-label', shouldShow ? '隐藏密码' : '显示密码');
    });

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const username = usernameInput.value.trim();
        const password = passwordInput.value;
        if (!username || !password) {
            errorBox.textContent = '请输入账号和密码';
            errorBox.classList.add('show');
            return;
        }

        errorBox.classList.remove('show');
        submitButton.disabled = true;
        submitButton.innerHTML = '<span>正在登录…</span>';
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username,
                    password,
                    remember: document.getElementById('remember').checked,
                }),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.detail || '登录失败，请稍后重试');

            const next = new URLSearchParams(window.location.search).get('next');
            const safeNext = next && next !== '/' && next.startsWith('/') && !next.startsWith('//');
            const roleHome = data.user?.role === 'REVIEWER' ? '/cases' : '/dashboard';
            window.location.href = safeNext ? next : roleHome;
        } catch (error) {
            errorBox.textContent = error.message || '登录失败，请稍后重试';
            errorBox.classList.add('show');
            submitButton.disabled = false;
            submitButton.innerHTML = '<span>登录系统</span><i class="bi bi-arrow-right"></i>';
        }
    });
</script>
</body>
</html>
