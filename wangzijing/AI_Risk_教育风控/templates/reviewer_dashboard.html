{% extends "base.html" %}
{% block title %}审核工作台 - 教育风控系统{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="page-heading-kicker"><i class="bi bi-person-workspace"></i> Reviewer Workspace</div><h4>审核工作台</h4><div class="page-heading-subtitle">只展示分配给你的案件，进入案件详情后即可完成审核。</div></div><div class="page-actions"><a class="btn btn-primary btn-sm" href="/cases"><i class="bi bi-folder-check me-1"></i>进入我的待审</a></div></div>
<div class="mini-stat-grid"><div class="mini-stat-card is-warning"><div class="mini-stat-top"><span class="mini-stat-label">我的待办</span><span class="mini-stat-icon"><i class="bi bi-hourglass-split"></i></span></div><div id="todoCount" class="mini-stat-value">-</div></div><div class="mini-stat-card is-info"><div class="mini-stat-top"><span class="mini-stat-label">审核中</span><span class="mini-stat-icon"><i class="bi bi-clipboard-check"></i></span></div><div id="reviewingCount" class="mini-stat-value">-</div></div><div class="mini-stat-card"><div class="mini-stat-top"><span class="mini-stat-label">我的案件总数</span><span class="mini-stat-icon"><i class="bi bi-folder2-open"></i></span></div><div id="totalCount" class="mini-stat-value">-</div></div></div>
<div class="surface-card p-0 overflow-hidden"><div class="px-4 py-3 border-bottom"><strong>最新待审案件</strong><span class="text-muted small ms-2">最多显示 5 条</span></div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>案件ID</th><th>用户ID</th><th>风险等级</th><th>评分</th><th>创建时间</th></tr></thead><tbody id="todoTable"><tr><td colspan="5" class="text-center py-4 text-muted">正在加载…</td></tr></tbody></table></div></div>
{% endblock %}
{% block extra_js %}<script>
async function loadWorkbench(){try{const [active,all]=await Promise.all([apiRequest('/api/cases?active_only=true&page=1&page_size=5'),apiRequest('/api/cases?page=1&page_size=1')]);document.getElementById('todoCount').textContent=active.total;document.getElementById('reviewingCount').textContent=active.items.filter(x=>x.case_status==='审核中').length;document.getElementById('totalCount').textContent=all.total;document.getElementById('todoTable').innerHTML=active.items.map(x=>`<tr onclick="location.href='/cases'" style="cursor:pointer"><td><code>${escapeHtml(x.case_id)}</code></td><td>${escapeHtml(x.user_id)}</td><td>${riskBadgeHtml(x.risk_level||'低')}</td><td>${x.final_score??'-'}</td><td>${formatDateTime(x.create_time)}</td></tr>`).join('')||'<tr><td colspan="5" class="text-center py-4 text-muted">暂无分配给你的待审案件</td></tr>';}catch(e){showToast(e.message||'工作台加载失败','danger');}}loadWorkbench();</script>{% endblock %}
