<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育知识库 - 内容导入</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f4f6fb;
            color: #1f2937;
        }
        .navbar {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .navbar h1 { font-size: 20px; font-weight: 600; }
        .navbar a { color: #fff; text-decoration: none; font-size: 14px; opacity: .9; }
        .container { max-width: 960px; margin: 32px auto; padding: 0 16px; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,.06);
            margin-bottom: 24px;
        }
        .card h2 { font-size: 16px; margin-bottom: 16px; color: #374151; }
        .upload-area {
            border: 2px dashed #c7d2fe;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            background: #f8faff;
            cursor: pointer;
            transition: border-color .2s;
        }
        .upload-area:hover { border-color: #6366f1; }
        .upload-area .hint { font-size: 14px; color: #6b7280; margin-top: 8px; }
        input[type="file"] { display: none; }
        .form-row {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            align-items: center;
            flex-wrap: wrap;
        }
        select, button {
            padding: 10px 16px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            background: #fff;
        }
        button.primary {
            background: #4f46e5;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button.primary:hover { background: #4338ca; }
        button.primary:disabled { background: #a5b4fc; cursor: not-allowed; }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
        }
        .status-processing { background: #fef3c7; color: #92400e; }
        .status-completed { background: #d1fae5; color: #065f46; }
        .status-failed { background: #fee2e2; color: #991b1b; }
        .node-list { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; }
        .node-tag {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            background: #f3f4f6;
            color: #4b5563;
        }
        .node-tag.running { background: #fef3c7; color: #92400e; }
        .node-tag.done { background: #d1fae5; color: #065f46; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
        th, td { padding: 8px 12px; border-bottom: 1px solid #e5e7eb; text-align: left; }
        th { color: #6b7280; font-weight: 600; background: #f9fafb; }
        .tip { font-size: 13px; color: #6b7280; margin-top: 12px; line-height: 1.7; }
        code { background: #f3f4f6; padding: 2px 6px; border-radius: 4px; }
        .file-name { font-weight: 600; color: #4f46e5; word-break: break-all; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>教育知识库 · 内容导入</h1>
        <a href="chat.html" target="_blank">打开智能问答 →</a>
    </div>

    <div class="container">
        <div class="card">
            <h2>上传教育资料</h2>
            <div class="upload-area" id="uploadArea">
                <div style="font-size: 15px;">点击选择文件，或拖拽文件到此处</div>
                <div class="hint">支持：课程介绍.md、题目资料.md、课程文档.docx、项目文档.docx、PDF</div>
                <input type="file" id="fileInput" accept=".md,.docx,.pdf">
            </div>
            <div class="form-row">
                <span style="font-size: 14px; color: #374151;">内容类型：</span>
                <select id="contentType">
                    <option value="">自动识别（推荐）</option>
                    <option value="course_intro">课程介绍</option>
                    <option value="course_doc">课程文档</option>
                    <option value="project_doc">项目文档</option>
                    <option value="question">题库题目</option>
                </select>
                <button class="primary" id="uploadBtn" disabled>开始导入</button>
                <span id="fileName" class="file-name"></span>
            </div>
            <div class="tip">
                提示：文件名包含“课程介绍”“题目资料”或位于“课程文档 / 项目文档”目录时会自动识别内容类型。
                导入任务会经过：文档转 Markdown → 图片处理 → 解析/切分 → 教育元数据识别 → 向量化 → Milvus 入库 → 知识实体索引。
            </div>
        </div>

        <div class="card" id="progressCard" style="display:none;">
            <h2>
                导入进度
                <span id="taskId" style="font-weight:normal; font-size:13px; color:#6b7280;"></span>
                <span class="status-badge status-processing" id="statusBadge">处理中</span>
            </h2>
            <div id="contentTypeInfo" style="font-size:14px; color:#374151; margin-top:8px;"></div>
            <div class="node-list" id="runningList"></div>
            <div class="node-list" id="doneList"></div>
            <h2 style="margin-top:20px;">节点耗时</h2>
            <table id="durationTable">
                <thead><tr><th>节点</th><th>耗时（秒）</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileName = document.getElementById('fileName');

        uploadArea.addEventListener('click', () => fileInput.click());
        uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.style.borderColor = '#6366f1'; });
        uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = '#c7d2fe'; });
        uploadArea.addEventListener('drop', e => {
            e.preventDefault();
            uploadArea.style.borderColor = '#c7d2fe';
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                onFileSelected();
            }
        });
        fileInput.addEventListener('change', onFileSelected);

        function onFileSelected() {
            const f = fileInput.files[0];
            if (f) {
                fileName.textContent = f.name + '（' + (f.size / 1024 / 1024).toFixed(2) + ' MB）';
                uploadBtn.disabled = false;
            }
        }

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return;
            uploadBtn.disabled = true;
            const form = new FormData();
            form.append('file', file);
            form.append('content_type', document.getElementById('contentType').value);
            try {
                const resp = await fetch('/upload', { method: 'POST', body: form });
                const data = await resp.json();
                if (data.task_id) {
                    document.getElementById('progressCard').style.display = 'block';
                    document.getElementById('taskId').textContent = '任务ID：' + data.task_id;
                    document.getElementById('contentTypeInfo').textContent =
                        '内容类型：' + (data.content_type_cn || data.content_type);
                    pollStatus(data.task_id);
                }
            } catch (e) {
                alert('上传失败：' + e.message);
                uploadBtn.disabled = false;
            }
        });

        async function pollStatus(taskId) {
            const timer = setInterval(async () => {
                try {
                    const resp = await fetch('/status/' + taskId);
                    const info = await resp.json();
                    renderProgress(info);
                    if (info.status === 'completed' || info.status === 'failed') {
                        clearInterval(timer);
                        const badge = document.getElementById('statusBadge');
                        badge.textContent = info.status === 'completed' ? '已完成' : '失败';
                        badge.className = 'status-badge status-' + info.status;
                        if (info.status === 'completed') {
                            uploadBtn.disabled = false;
                            fileInput.value = '';
                            fileName.textContent = '';
                        }
                    }
                } catch (e) { clearInterval(timer); }
            }, 1500);
        }

        function renderProgress(info) {
            const badge = document.getElementById('statusBadge');
            badge.textContent = info.status === 'completed' ? '已完成' : (info.status === 'failed' ? '失败' : '处理中');
            badge.className = 'status-badge status-' + info.status;

            const runningEl = document.getElementById('runningList');
            const doneEl = document.getElementById('doneList');
            runningEl.innerHTML = '';
            doneEl.innerHTML = '';
            (info.running_list || []).forEach(n => {
                const tag = document.createElement('span');
                tag.className = 'node-tag running';
                tag.textContent = '⏳ ' + n;
                runningEl.appendChild(tag);
            });
            (info.done_list || []).forEach(n => {
                const tag = document.createElement('span');
                tag.className = 'node-tag done';
                tag.textContent = '✅ ' + n;
                doneEl.appendChild(tag);
            });

            const tbody = document.querySelector('#durationTable tbody');
            tbody.innerHTML = '';
            Object.entries(info.durations || {}).forEach(([name, sec]) => {
                const tr = document.createElement('tr');
                tr.innerHTML = '<td>' + name + '</td><td>' + sec + '</td>';
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
