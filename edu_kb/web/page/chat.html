<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教育知识库 - 智能问答</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f4f6fb;
            color: #1f2937;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .navbar h1 { font-size: 18px; }
        .navbar .actions { display: flex; gap: 12px; align-items: center; }
        .navbar a, .navbar button {
            color: #fff; font-size: 13px; background: none;
            border: 1px solid rgba(255,255,255,.4);
            padding: 6px 12px; border-radius: 8px; cursor: pointer; text-decoration: none;
        }
        .navbar button:hover, .navbar a:hover { background: rgba(255,255,255,.15); }
        #chatBox {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }
        .msg { margin-bottom: 20px; display: flex; }
        .msg.user { justify-content: flex-end; }
        .msg .bubble {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.7;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .msg.user .bubble { background: #4f46e5; color: #fff; border-bottom-right-radius: 4px; }
        .msg.assistant .bubble { background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
        .msg .meta { font-size: 12px; color: #9ca3af; margin-bottom: 6px; padding: 0 4px; }
        .msg.user .meta { text-align: right; }
        .status-line { font-size: 13px; color: #6b7280; padding: 4px 8px; }
        .refs { margin-top: 10px; border-top: 1px dashed #e5e7eb; padding-top: 8px; }
        .refs .ref-title { font-size: 13px; font-weight: 600; color: #6b7280; margin-bottom: 6px; }
        .ref-item {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-size: 13px;
            color: #374151;
        }
        .ref-item .tag {
            display: inline-block; padding: 1px 8px; border-radius: 4px;
            background: #e0e7ff; color: #3730a3; font-size: 12px; margin-right: 6px;
        }
        .ref-item .kv { color: #6b7280; }
        .imgs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; }
        .imgs img { max-width: 200px; border-radius: 8px; border: 1px solid #e5e7eb; }
        #inputBar {
            flex-shrink: 0;
            border-top: 1px solid #e5e7eb;
            background: #fff;
            padding: 14px 24px;
        }
        .input-wrap {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        textarea {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            resize: none;
            outline: none;
            font-family: inherit;
        }
        textarea:focus { border-color: #6366f1; }
        .send-btn {
            background: #4f46e5; color: #fff; border: none;
            border-radius: 12px; padding: 12px 24px; font-size: 14px;
            cursor: pointer; font-weight: 600;
        }
        .send-btn:disabled { background: #a5b4fc; cursor: not-allowed; }
        .suggest {
            max-width: 900px; margin: 10px auto 0; display: flex; gap: 8px; flex-wrap: wrap;
        }
        .suggest button {
            border: 1px solid #c7d2fe; background: #eef2ff; color: #3730a3;
            border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer;
        }
        .suggest button:hover { background: #e0e7ff; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>教育知识库 · 智能问答</h1>
        <div class="actions">
            <span id="sessionLabel" style="font-size:13px; opacity:.85;"></span>
            <button onclick="clearHistory()">清空历史</button>
            <a href="import.html" target="_blank">内容导入 →</a>
        </div>
    </div>

    <div id="chatBox"></div>

    <div class="suggest">
        <button onclick="quickAsk(this)">有哪些 Python 相关的课程？</button>
        <button onclick="quickAsk(this)">推荐一个适合入门的 RAG 课程</button>
        <button onclick="quickAsk(this)">Python 有哪些练习题？</button>
        <button onclick="quickAsk(this)">查询函数相关的选择题</button>
        <button onclick="quickAsk(this)">什么是协程？FastAPI 里怎么用？</button>
    </div>

    <div id="inputBar">
        <div class="input-wrap">
            <textarea id="input" rows="1" placeholder="输入你的问题，例如：机器学习课程有哪些章节？"></textarea>
            <button class="send-btn" id="sendBtn" onclick="send()">发送</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        let sessionId = localStorage.getItem('edu_session_id') || 'session_' + Date.now();
        localStorage.setItem('edu_session_id', sessionId);
        document.getElementById('sessionLabel').textContent = '会话：' + sessionId;
        let busy = false;

        input.addEventListener('input', () => {
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 140) + 'px';
        });
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
        });

        function quickAsk(btn) {
            input.value = btn.textContent;
            send();
        }

        function appendMsg(role, text) {
            const div = document.createElement('div');
            div.className = 'msg ' + role;
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = role === 'user' ? '我' : '教育知识库助手';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = text;
            div.appendChild(meta);
            div.appendChild(bubble);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return bubble;
        }

        function appendStatus(text) {
            const div = document.createElement('div');
            div.className = 'status-line';
            div.id = 'statusLine';
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendReferences(bubble, refs) {
            if (!refs || !refs.length) return;
            const refsDiv = document.createElement('div');
            refsDiv.className = 'refs';
            refsDiv.innerHTML = '<div class="ref-title">📚 引用信息（' + refs.length + ' 条）</div>';
            refs.forEach((r, i) => {
                const item = document.createElement('div');
                item.className = 'ref-item';
                const typeMap = { course: '课程', question: '题目', doc: '文档' };
                let info = '';
                if (r.course_name) info += '课程：' + r.course_name + '　';
                if (r.project_name) info += '项目：' + r.project_name + '　';
                if (r.chapter_name) info += '章节：' + r.chapter_name + '　';
                if (r.file_title) info += '来源文件：' + r.file_title + '　';
                if (r.bank_name) info += '题库：' + r.bank_name + '　';
                if (r.question_code) info += '题目编码：' + r.question_code + '　';
                if (r.question_type) info += '题型：' + r.question_type + '　';
                if (r.series_name) info += '系列：' + r.series_name + '　';
                if (r.url) info += '链接：' + r.url + '　';
                item.innerHTML =
                    '<span class="tag">' + (typeMap[r.type] || r.type) + ' #' + (i + 1) + '</span>' +
                    '<span class="kv">' + (info || (r.content || '').slice(0, 80)) + '</span>';
                refsDiv.appendChild(item);
            });
            bubble.appendChild(refsDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendImages(bubble, urls) {
            if (!urls || !urls.length) return;
            const imgs = document.createElement('div');
            imgs.className = 'imgs';
            urls.forEach(url => {
                const img = document.createElement('img');
                img.src = url;
                imgs.appendChild(img);
            });
            bubble.appendChild(imgs);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function send() {
            const text = input.value.trim();
            if (!text || busy) return;
            input.value = '';
            input.style.height = 'auto';
            appendMsg('user', text);
            busy = true;
            sendBtn.disabled = true;

            const statusLine = appendStatus('⏳ 正在分析问题并检索知识库...');
            try {
                const resp = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: text, session_id: sessionId })
                });
                const data = await resp.json();
                sessionId = data.session_id;
                localStorage.setItem('edu_session_id', sessionId);
                document.getElementById('sessionLabel').textContent = '会话：' + sessionId;

                const bubble = appendMsg('assistant', '');
                let answer = '';
                let finalData = null;

                const es = new EventSource('/stream/' + data.task_id);
                es.addEventListener('progress', e => {
                    const d = JSON.parse(e.data);
                    const nodes = (d.running_list || []).concat(d.done_list || []);
                    statusLine.textContent = '⏳ 当前进度：' + (nodes.length ? nodes.join(' → ') : '处理中...');
                });
                es.addEventListener('delta', e => {
                    const d = JSON.parse(e.data);
                    answer += d.delta;
                    bubble.textContent = answer;
                    chatBox.scrollTop = chatBox.scrollHeight;
                });
                es.addEventListener('final', e => {
                    finalData = JSON.parse(e.data);
                    bubble.textContent = finalData.answer || answer || '(无回答)';
                    appendReferences(bubble, finalData.references);
                    appendImages(bubble, finalData.image_urls);
                    es.close();
                    busy = false;
                    sendBtn.disabled = false;
                    statusLine.remove();
                });
                es.addEventListener('error', e => {
                    if (finalData) return;
                    statusLine.textContent = '⚠️ 连接中断，请稍后重试';
                    es.close();
                    busy = false;
                    sendBtn.disabled = false;
                });
                es.onerror = () => {
                    if (!finalData) {
                        statusLine.textContent = '⚠️ 连接中断，请稍后重试';
                        busy = false;
                        sendBtn.disabled = false;
                        es.close();
                    }
                };
            } catch (e) {
                statusLine.textContent = '❌ 请求失败：' + e.message;
                busy = false;
                sendBtn.disabled = false;
            }
        }

        async function clearHistory() {
            if (!confirm('确定清空当前会话的历史记录吗？')) return;
            await fetch('/history/' + sessionId, { method: 'DELETE' });
            chatBox.innerHTML = '';
            appendMsg('assistant', '历史记录已清空。你可以开始新的提问。');
        }

        // 加载历史
        (async () => {
            try {
                const resp = await fetch('/history/' + sessionId + '?limit=50');
                const data = await resp.json();
                (data.items || []).forEach(item => {
                    const bubble = appendMsg(item.role === 'user' ? 'user' : 'assistant', item.text || '');
                    if (item.role !== 'user') {
                        appendReferences(bubble, item.references);
                        appendImages(bubble, item.image_urls);
                    }
                });
            } catch (e) { /* 无历史时忽略 */ }
        })();
    </script>
</body>
</html>
