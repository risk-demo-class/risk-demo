{% extends "base.html" %}
{% block title %}风险检查 - 桀哥风控 · 银行版{% endblock %}
{% block content %}
<h4 class="page-title">风险检查 <small>转账 / 登录 / 贷款申请 / 信用卡</small></h4>

<div class="row">
    <!-- 左侧: 检查表单 -->
    <div class="col-md-5">
        <div class="card">
            <div class="card-header"><i class="bi bi-search"></i>发起风控检查</div>
            <div class="card-body">
                <form id="checkForm">
                    <div class="mb-3">
                        <label class="form-label"><span class="text-danger">*</span> 事件类型</label>
                        <select class="form-select" id="ck_event_type" required onchange="onEventTypeChange()">
                            <option value="转账">转账</option>
                            <option value="登录">登录</option>
                            <option value="贷款申请">贷款申请</option>
                            <option value="信用卡">信用卡</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><span class="text-danger">*</span> 用户ID</label>
                        <input type="text" class="form-control" id="ck_user_id" placeholder="如: U1001 / RISK001" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><span class="text-danger">*</span> 业务ID <small class="text-muted" id="ck_source_label">(交易ID txn_id)</small></label>
                        <input type="text" class="form-control" id="ck_source_id" placeholder="如: TXN20260801100001" required>
                    </div>
                    <!-- 高级参数: 决策可用, 留空则由系统按业务ID自动补全 -->
                    <details class="mb-3">
                        <summary class="text-muted small">高级参数 (可选, 留空自动补全)</summary>
                        <div class="mt-2">
                            <div class="mb-2" id="fromCardWrap" style="display:none;">
                                <label class="form-label small">转出卡号</label>
                                <input type="text" class="form-control form-control-sm" id="ck_from_card" placeholder="card_xxx">
                            </div>
                            <div class="mb-2" id="toCardWrap" style="display:none;">
                                <label class="form-label small">转入卡号</label>
                                <input type="text" class="form-control form-control-sm" id="ck_to_card" placeholder="card_xxx">
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">设备ID</label>
                                <input type="text" class="form-control form-control-sm" id="ck_device_id" placeholder="dev_xxx">
                            </div>
                            <div class="mb-2">
                                <label class="form-label small">IP 地址</label>
                                <input type="text" class="form-control form-control-sm" id="ck_ip" placeholder="如: 45.155.204.10">
                            </div>
                        </div>
                    </details>
                    <button type="submit" class="btn btn-bank w-100" id="checkBtn">
                        <i class="bi bi-shield-check"></i> 执行检查
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 右侧: 检查结果 -->
    <div class="col-md-7">
        <div class="card" id="resultPanel" style="display:none;">
            <div class="card-header"><i class="bi bi-clipboard-check"></i>检查结果</div>
            <div class="card-body" id="resultContent"></div>
        </div>
        <div class="card" id="emptyPanel">
            <div class="card-body">
                <div class="text-center text-muted py-5">
                    <i class="bi bi-shield-check" style="font-size:48px; color:#b08d57;"></i>
                    <p class="mt-3">请在左侧填写信息并发起风控检查</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 事件类型 → 业务ID提示 / 高级参数显隐
const SOURCE_HINTS = {
    '转账':   ['(交易ID txn_id)', '如: TXN20260801100001'],
    '登录':   ['(登录ID login_id)', '如: LOGIN20260801100001'],
    '贷款申请': ['(贷款申请ID loan_id)', '如: LOAN20260801100001'],
    '信用卡': ['(卡ID card_id)', '如: CARD20260801100001'],
};
function onEventTypeChange() {
    const et = document.getElementById('ck_event_type').value;
    const hint = SOURCE_HINTS[et] || SOURCE_HINTS['转账'];
    document.getElementById('ck_source_label').textContent = '(' + hint[0] + ')';
    document.getElementById('ck_source_id').placeholder = hint[1];
    document.getElementById('fromCardWrap').style.display = et === '转账' ? '' : 'none';
    document.getElementById('toCardWrap').style.display = et === '转账' ? '' : 'none';
}

function riskBadge(level) {
    const cls = {'低':'badge-risk-low','中':'badge-risk-mid','高':'badge-risk-high','极高':'badge-risk-critical'}[level] || 'bg-secondary';
    return `<span class="badge ${cls}">${level}</span>`;
}

function decisionBadge(d) {
    const cls = {'通过':'badge-risk-low','标记':'badge-risk-mid','人工审核':'badge-risk-high','拒绝':'badge-risk-critical'}[d] || 'bg-secondary';
    return `<span class="badge ${cls}">${d}</span>`;
}

// 接收从案件列表跳过来的预填数据 (重做检查功能)
(function prefillFromCase() {
    const raw = sessionStorage.getItem('risk_check_prefill');
    if (!raw) return;
    try {
        const data = JSON.parse(raw);
        const setVal = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
        setVal('ck_event_type', data.event_type);
        setVal('ck_user_id', data.user_id);
        setVal('ck_source_id', data.source_id);
        onEventTypeChange();
        // 顶部加个提示横幅
        const form = document.getElementById('checkForm');
        if (form && data.case_id) {
            const banner = document.createElement('div');
            banner.className = 'alert alert-warning py-2 mb-3';
            banner.innerHTML = `<i class="bi bi-info-circle"></i> 来自案件 <code>${data.case_id}</code> 的重做检查, 已自动填充业务参数`;
            form.parentNode.insertBefore(banner, form);
        }
    } catch (e) {
        console.warn('预填数据解析失败:', e);
    } finally {
        sessionStorage.removeItem('risk_check_prefill');
    }
})();

document.getElementById('checkForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('checkBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 检查中...';

    const data = {
        event_type: document.getElementById('ck_event_type').value,
        user_id: document.getElementById('ck_user_id').value,
        source_id: document.getElementById('ck_source_id').value,
        from_card: document.getElementById('ck_from_card').value || null,
        to_card: document.getElementById('ck_to_card').value || null,
        device_id: document.getElementById('ck_device_id').value || null,
        ip: document.getElementById('ck_ip').value || null,
    };

    try {
        const res = await fetch('/api/risk/check', {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
        });
        const result = await res.json();

        if (!res.ok) {
            document.getElementById('resultContent').innerHTML = `<div class="alert alert-danger">${result.detail || '检查失败'}</div>`;
        } else {
            const blocked = result.blocked_by
                ? `<div class="alert alert-danger mb-3"><strong>黑名单命中</strong> · ${result.blocked_by} 黑名单</div>`
                : '';
            document.getElementById('resultContent').innerHTML = `
                ${blocked}
                <div class="mb-3">
                    <strong>决策: ${decisionBadge(result.decision)}</strong>
                    &nbsp;|&nbsp; 评分: <strong>${result.final_score}</strong>
                    &nbsp;|&nbsp; 等级: ${riskBadge(result.risk_level)}
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <small class="text-muted">评估ID</small><br><code>${result.assessment_id}</code>
                    </div>
                    <div class="col-md-6">
                        <small class="text-muted">命中规则数</small><br><strong>${result.rule_count}</strong>
                    </div>
                </div>
                ${result.triggered_rules.length > 0 ? `
                <h6 class="mt-3">命中规则</h6>
                <table class="table table-bank">
                    <thead><tr><th>规则</th><th>分类</th><th>等级</th><th>分值</th><th>动作</th></tr></thead>
                    <tbody>${result.triggered_rules.map(r => `
                        <tr>
                            <td>${r.rule_name}</td>
                            <td><span class="badge badge-risk-mid">${r.rule_category}</span></td>
                            <td>${riskBadge(r.risk_level)}</td>
                            <td>${r.risk_score}</td>
                            <td>${r.action}</td>
                        </tr>
                    `).join('')}</tbody>
                </table>` : '<p class="text-success mt-3">未命中任何规则</p>'}
                <!-- ML 评分 (XGBoost): P(拒绝) + 风险分(sigmoid 校准) + ML 决策 -->
                <h6 class="mt-3">ML 评分 <small class="text-muted">(XGBoost)</small></h6>
                <div class="ml-score-block p-2 bg-light rounded">
                    ${result.ml_score != null
                        ? renderMLScoreBlock(result.ml_score, result.ml_decision)
                        : '<span class="text-muted">未加载模型</span>'}
                </div>
                <details class="mt-3">
                    <summary class="text-muted">特征详情 (48 维)</summary>
                    <pre class="mt-2 bg-light p-2 rounded" style="max-height:300px;overflow:auto;">${JSON.stringify(result.features, null, 2)}</pre>
                </details>
            `;
        }
        document.getElementById('resultPanel').style.display = 'block';
        document.getElementById('emptyPanel').style.display = 'none';
    } catch(e) {
        document.getElementById('resultContent').innerHTML = `<div class="alert alert-danger">请求失败: ${e.message}</div>`;
        document.getElementById('resultPanel').style.display = 'block';
        document.getElementById('emptyPanel').style.display = 'none';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-shield-check"></i> 执行检查';
    }
});

// 初始化提示
onEventTypeChange();
</script>
{% endblock %}
