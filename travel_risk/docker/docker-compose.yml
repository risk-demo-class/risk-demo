services:
  mysql:
    image: mysql:8.0
    container_name: travel-risk-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123321
      MYSQL_DATABASE: travel_risk
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - travel_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123321"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: travel-risk-app
    container_name: travel-risk-app
    env_file:
      - ../.env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 123321
      DB_NAME: travel_risk
      XGB_ENABLED: "True"
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs

volumes:
  travel_mysql_data:
