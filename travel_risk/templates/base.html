<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}旅游风控系统{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    body { background: #f4f6f9; }
    .sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 220px;
      background: #1e2a3a; color: #fff; padding: 16px 0; overflow-y: auto;
    }
    .sidebar .brand { padding: 12px 20px; font-size: 16px; font-weight: 700; border-bottom: 1px solid #2e3d50; }
    .sidebar .brand small { display: block; font-size: 11px; color: #8ba3c0; font-weight: 400; }
    .sidebar a.nav-link { color: #b8c7d9; padding: 10px 20px; font-size: 14px; }
    .sidebar a.nav-link:hover, .sidebar a.nav-link.active { background: #2b3d52; color: #fff; }
    .main { margin-left: 220px; padding: 24px; }
    .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-radius: 10px; }
    .stat-card .num { font-size: 28px; font-weight: 700; color: #1e2a3a; }
    .stat-card .label { color: #6c757d; font-size: 13px; }
    .risk-high { color: #dc3545; font-weight: 600; }
    .risk-medium { color: #fd7e14; font-weight: 600; }
    .risk-low { color: #198754; font-weight: 600; }
    .pagination-footer { position: sticky; bottom: 0; background: #fff; padding: 12px 0; border-top: 1px solid #eee; }
    .badge-decision { font-size: 12px; }
    pre.features { max-height: 320px; overflow: auto; background: #f8f9fa; padding: 12px; border-radius: 8px; font-size: 12px; }
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="brand">旅游风控系统<small>Travel Risk Control</small></div>
  <a class="nav-link" href="/">数据总览</a>
  <a class="nav-link" href="/risk-check">风控检查</a>
  <a class="nav-link" href="/rules">规则管理</a>
  <a class="nav-link" href="/cases">案件管理</a>
  <a class="nav-link" href="/assessments">评估历史</a>
  <a class="nav-link" href="/blacklist">黑名单</a>
  <a class="nav-link" href="/chat">AI 助手</a>
  <a class="nav-link" href="/docs" target="_blank">API 文档</a>
</nav>
<main class="main">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
