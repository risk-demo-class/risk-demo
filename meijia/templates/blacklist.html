{% extends "base.html" %}{% block content %}<div class="grid blacklist-layout"><section class="panel"><div class="panel-head"><div><p class="eyebrow">BLOCK SIGNAL</p><h3>加入黑名单</h3></div></div><form id="blacklistForm" class="form-grid"><label>类型<select name="type"><option>学号</option><option>用户ID</option><option>身份证</option><option>设备指纹</option><option>直播账号</option></select></label><label>匹配值<input name="value" required></label><label class="wide">原因<textarea name="reason" required rows="3"></textarea></label><button class="btn danger wide">确认加入</button></form></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">ACTIVE BLOCKLIST</p><h3>有效黑名单</h3></div></div><div class="table-wrap"><table><thead><tr><th>类型</th><th>值</th><th>原因</th><th>状态</th><th>操作</th></tr></thead><tbody id="blacklistRows"></tbody></table></div></section></div>{% endblock %}
