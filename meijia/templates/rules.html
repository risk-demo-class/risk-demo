{% extends "base.html" %}{% block content %}<section class="panel"><div class="panel-head"><div><p class="eyebrow">RULE REGISTRY</p><h3>教育规则配置</h3></div><span class="muted">条件、分值和动作均以数据库配置为准</span></div><div class="table-wrap"><table><thead><tr><th>编号</th><th>规则</th><th>事件</th><th>条件</th><th>等级</th><th>分值</th><th>决策</th><th>版本</th><th>状态</th><th>操作</th></tr></thead><tbody id="ruleRows"></tbody></table></div></section><dialog id="ruleDialog"><button class="dialog-close" onclick="this.closest('dialog').close()">×</button><h3>编辑规则</h3><form id="ruleForm" class="form-grid"><input type="hidden" name="rule_id"><input type="hidden" name="version"><label>风险等级<select name="risk_level"><option>低</option><option>中</option><option>高</option><option>极高</option></select></label><label>风险分值<input name="risk_score" type="number" min="0" max="100" required></label><label>决策<select name="action"><option>通过</option><option>标记</option><option>人工审核</option><option>拒绝</option></select></label><label>优先级<input name="priority" type="number" required></label><label class="wide">JSON 条件<textarea name="rule_condition" rows="9" spellcheck="false" required></textarea></label><button class="btn primary wide">保存新版本</button></form></dialog>{% endblock %}
