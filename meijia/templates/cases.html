{% extends "base.html" %}{% block content %}<div class="metric-grid compact" id="caseMetrics"></div><section class="panel"><div class="panel-head"><div><p class="eyebrow">REVIEW QUEUE</p><h3>人工审核案件</h3></div><select id="caseStatus" onchange="loadCases()"><option value="">全部状态</option><option>待审核</option><option>审核中</option><option>已通过</option><option>已拒绝</option><option>已关闭</option></select></div><div class="table-wrap"><table><thead><tr><th>案件</th><th>用户</th><th>类别</th><th>风险</th><th>状态</th><th>创建时间</th><th>操作</th></tr></thead><tbody id="caseRows"></tbody></table></div></section><dialog id="reviewDialog"><button class="dialog-close" onclick="this.closest('dialog').close()">×</button><h3>审核案件</h3><form id="reviewForm" class="form-grid"><input type="hidden" name="case_id"><label>审核结论<select name="decision"><option>已通过</option><option>已拒绝</option><option>已关闭</option></select></label><label>审核人<input name="reviewer" value="admin" required></label><label class="wide">审核意见<textarea name="review_comment" rows="4"></textarea></label><button class="btn primary wide">提交审核</button></form></dialog>{% endblock %}
