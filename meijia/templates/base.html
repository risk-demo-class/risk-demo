<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · 教育风控</title><link rel="stylesheet" href="/static/app.css"></head>
<body data-page="{{ active }}"><aside class="sidebar"><a class="brand" href="/"><span class="brand-mark">EDU</span><span>教育风控台<small>Risk Operations</small></span></a><nav><a class="{{ 'active' if active == 'dashboard' }}" href="/"><i>⌁</i>风险态势</a><a class="{{ 'active' if active == 'risk-check' }}" href="/risk-check"><i>◎</i>风险检查</a><a class="{{ 'active' if active == 'rules' }}" href="/rules"><i>⌘</i>规则中心</a><a class="{{ 'active' if active == 'assessments' }}" href="/assessments"><i>▤</i>评估历史</a><a class="{{ 'active' if active == 'cases' }}" href="/cases"><i>◇</i>人工案件</a><a class="{{ 'active' if active == 'blacklist' }}" href="/blacklist"><i>⊘</i>黑名单</a><a class="{{ 'active' if active == 'users' }}" href="/users"><i>◉</i>学员画像</a><a class="{{ 'active' if active == 'chat' }}" href="/chat"><i>✦</i>AI 助手</a></nav><div class="side-note"><span class="live-dot"></span>规则引擎在线<small>8 条教育规则已加载</small></div></aside><main><header><div><p class="eyebrow">EDUCATION RISK CONTROL</p><h1>{{ title }}</h1></div><div class="header-actions"><span id="clock"></span><span class="health" id="health">连接中</span></div></header><section class="content">{% block content %}{% endblock %}</section></main><div id="toast" class="toast"></div><script src="/static/app.js"></script>{% block scripts %}{% endblock %}</body></html>
