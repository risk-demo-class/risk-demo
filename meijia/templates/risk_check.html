{% extends "base.html" %}{% block content %}<div class="grid check-layout"><section class="panel"><div class="panel-head"><div><p class="eyebrow">MANUAL CHECK</p><h3>创建检查事件</h3></div></div><form id="riskForm" class="form-grid"><label>事件类型<select name="event_type"><option>退费申请提交</option><option>报名支付成功</option><option>退款成功</option><option>设备关联更新</option><option>直播打赏变更</option><option>学历核验完成</option><option>通用</option></select></label><label>用户 ID<input name="user_id" value="RISK-STU-001" required></label><label>订单 ID<input name="order_id" value="RISK-ORD-001"></label><label>退费 ID<input name="refund_id" value="RISK-RF-001"></label><label>直播场次<input name="live_session_id" placeholder="LIVE-RISK-01"></label><label>来源 ID<input name="source_id" placeholder="可留空"></label><button class="btn primary wide" type="submit">运行 25 维特征与规则</button></form></section><section class="panel result-panel"><div class="panel-head"><div><p class="eyebrow">ASSESSMENT RESULT</p><h3>决策结果</h3></div></div><div id="checkResult" class="empty">填写左侧信息并发起检查</div></section></div>{% endblock %}
