{% extends "base.html" %}
{% block content %}
  <section class="hero-panel compact"><div><span class="section-tag">HUMAN REVIEW</span><h2>案件工作台</h2><p>融合决策为人工审核时自动建案；终态案件不可重复审核。</p></div></section>
  <section class="two-column align-start rule-table-panel">
    <article class="panel"><div class="table-scroll"><table class="data-table"><thead><tr><th>案件</th><th>用户</th><th>场景</th><th>状态</th><th>创建时间</th></tr></thead><tbody id="case-table-body"><tr><td colspan="5">加载中……</td></tr></tbody></table></div></article>
    <article class="panel"><div class="panel-heading"><div><span class="section-tag">REVIEW</span><h2>人工审核</h2></div></div><form id="case-review-form" class="form-grid"><label class="full-width">案件ID<input name="case_id" required></label><label>结论<select name="decision"><option value="APPROVED">通过</option><option value="REJECTED">拒绝</option><option value="CLOSED">关闭</option></select></label><label>审核人<input name="reviewer" value="analyst" required></label><label class="full-width">意见<textarea name="comment" rows="4"></textarea></label><button class="primary-button full-width">提交审核</button></form><pre id="case-review-result" class="small-result">等待操作</pre></article>
  </section>
{% endblock %}
