[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bankrisk-ai"
version = "1.0.0"
description = "Bank risk control platform skeleton for card, loan, transfer and login scenarios"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "aiomysql>=0.2,<1.0",
  "aiosqlite>=0.21,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "jinja2>=3.1,<4.0",
  "python-multipart>=0.0.20,<1.0",
  "neo4j>=5.27,<7.0",
  "numpy>=2.1,<3.0",
  "scikit-learn>=1.6,<2.0",
  "xgboost>=3.0,<4.0",
  "networkx>=3.4,<4.0",
]

[project.optional-dependencies]
ml = []
agent = ["langchain>=1.0,<2.0", "langchain-openai>=1.0,<2.0", "deepagents>=0.3,<1.0"]
dev = ["httpx>=0.28,<1.0", "pytest>=8.3,<10.0", "pytest-asyncio>=0.25,<2.0", "ruff>=0.9,<1.0"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
