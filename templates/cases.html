{% extends "base.html" %}
{% block title %}案件管理 - 华信银行信贷风控平台{% endblock %}
{% block content %}
<h4 class="mb-4">案件管理</h4>

<!-- 统计卡片 -->
<div class="row mb-4" id="case-stats">
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">总计</div><div class="fw-bold" id="cs-total">-</div></div></div>
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">待审核</div><div class="fw-bold text-warning" id="cs-pending">-</div></div></div>
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">审核中</div><div class="fw-bold text-info" id="cs-reviewing">-</div></div></div>
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">已通过</div><div class="fw-bold text-success" id="cs-approved">-</div></div></div>
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">已拒绝</div><div class="fw-bold text-danger" id="cs-rejected">-</div></div></div>
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">已关闭</div><div class="fw-bold text-secondary" id="cs-closed">-</div></div></div>
</div>

<!-- 筛选 -->
<div class="mb-3 d-flex gap-2 align-items-center flex-wrap">
    <select class="form-select form-select-sm w-auto" id="filterStatus" onchange="loadCases()">
        <option value="__active__" selected>仅待办 (待审核 + 审核中)</option>
        <option value="">全部状态</option>
        <option value="待审核">待审核</option>
        <option value="审核中">审核中</option>
        <option value="已通过">已通过</option>
        <option value="已拒绝">已拒绝</option>
        <option value="已关闭">已关闭</option>
    </select>
    <span class="text-muted small">每页</span>
    <select class="form-select form-select-sm w-auto" id="pageSize" onchange="onPageSizeChange()">
        <option value="20">20 条</option>
        <option value="50">50 条</option>
        <option value="100">100 条</option>
    </select>
    <input type="text" class="form-control form-control-sm w-auto" id="filterUserId" placeholder="客户ID (回车过滤)" title="按客户ID过滤当前页; 完整 user_id 查询参数列为后续项" onkeydown="if(event.key==='Enter'){applyUserIdFilter(true);}">
    <span class="text-muted small ms-2" id="filterHint"></span>
    <span class="text-muted small ms-2" id="casesCount"></span>
</div>

<!-- 案件列表 -->
<div class="card stat-card">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr><th>案件ID</th><th>客户ID</th><th>分类</th><th>评分</th><th>等级</th><th id="thStatus" style="cursor:pointer;user-select:none" onclick="toggleStatusSort()" title="点击排序">状态 ⇅</th><th>创建时间</th><th>操作</th></tr>
            </thead>
            <tbody id="cases-table"></tbody>
        </table>
    </div>
</div>

<!-- 案件操作说明 -->
<style>
/* 案件列表操作列: 详情 + 重做检查 */
.col-actions .btn { margin-right: 4px; }
</style>

<nav class="pagination-bottom"><ul class="pagination justify-content-center mb-0" id="pagination"></ul></nav>

<!-- 案件详情模态框 -->
<div class="modal fade" id="caseModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">案件详情</h5><button type="button" class="btn-close-risk" data-bs-dismiss="modal" title="关闭" aria-label="Close"><i class="bi bi-x-lg"></i></button></div>
            <div class="alert alert-danger mx-3 mt-3 mb-0 py-2 d-none" id="caseError" role="alert"></div>
            <div class="modal-body" id="caseDetailBody">加载中...</div>
            <div class="modal-footer" id="caseActions"></div>
        </div>
    </div>
</div>

<!-- 审核操作确认模态框 -->
<div class="modal fade" id="reviewConfirmModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">确认审核操作</h5><button type="button" class="btn-close-risk" data-bs-dismiss="modal" title="关闭" aria-label="Close"><i class="bi bi-x-lg"></i></button></div>
            <div class="modal-body" id="reviewConfirmBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" id="reviewConfirmOk"><i class="bi bi-check-lg me-1"></i>确认</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
let currentItems = [];
const PAGE_SIZE_KEY = 'cases_pageSize';
const REVIEWER_KEY = 'cases_reviewer';

// 从 localStorage 恢复 pageSize, 默认 20
(function initPageSize() {
    const saved = localStorage.getItem(PAGE_SIZE_KEY) || '20';
    document.getElementById('pageSize').value = saved;
})();

// 用户切换 pageSize 时保存到 localStorage
function onPageSizeChange() {
    localStorage.setItem(PAGE_SIZE_KEY, document.getElementById('pageSize').value);
    loadCases(1);
}

function riskBadge(level) {
    const cls = {'低':'badge-risk-low','中':'badge-risk-mid','高':'badge-risk-high','极高':'badge-risk-critical'}[level] || 'bg-secondary';
    return `<span class="badge ${cls}">${level}</span>`;
}

function statusBadge(status) {
    const cls = {'待审核':'bg-warning','审核中':'bg-info','已通过':'bg-success','已拒绝':'bg-danger','已关闭':'bg-secondary'}[status] || 'bg-secondary';
    return `<span class="badge ${cls}">${status}</span>`;
}

// SLA 标识: 按创建时间计算等待时长 (前端计算, 不改 API)
const SLA_STATUSES = {'待审核': 1, '审核中': 1};
function slaBadge(c) {
    if (!SLA_STATUSES[c.case_status] || !c.create_time) return '';
    const hours = (Date.now() - new Date(c.create_time).getTime()) / 3600000;
    if (hours > 72) return '<span class="badge bg-danger ms-1">严重超时</span>';
    if (hours > 24) return '<span class="badge bg-warning text-dark ms-1">超24h</span>';
    return '';
}

// 案件ID 复制 (navigator.clipboard, 失败降级 execCommand)
function copyCaseId(id, el) {
    const ok = () => {
        const ico = el.querySelector('.copy-ico');
        if (ico) { ico.className = 'bi bi-check-lg text-success'; }
        setTimeout(() => { if (ico) ico.className = 'bi bi-clipboard text-muted'; }, 1500);
    };
    const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = id;
        ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); ok(); }
        catch (e) { alert('复制失败, 请手动选择复制'); }
        document.body.removeChild(ta);
    };
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(id).then(ok).catch(fallback);
    } else {
        fallback();
    }
}

// 状态列排序 (前端对当前页排序)
const STATUS_ORDER = {'待审核': 0, '审核中': 1, '已通过': 2, '已拒绝': 3, '已关闭': 4};
let statusSortDir = null; // 'asc' | 'desc' | null (再次点击取消排序)
function toggleStatusSort() {
    statusSortDir = statusSortDir === 'asc' ? 'desc' : (statusSortDir === 'desc' ? null : 'asc');
    document.getElementById('thStatus').innerHTML =
        `状态 ${statusSortDir === 'asc' ? '▲' : statusSortDir === 'desc' ? '▼' : '⇅'}`;
    loadCases(currentPage);
}

async function loadStats() {
    const res = await fetch('/api/cases/statistics');
    const s = await res.json();
    document.getElementById('cs-total').textContent = s.total;
    document.getElementById('cs-pending').textContent = s.pending;
    document.getElementById('cs-reviewing').textContent = s.reviewing;
    document.getElementById('cs-approved').textContent = s.approved;
    document.getElementById('cs-rejected').textContent = s.rejected;
    document.getElementById('cs-closed').textContent = s.closed;
}

async function loadCases(page) {
    currentPage = page || 1;
    const status = document.getElementById('filterStatus').value;
    const pageSize = document.getElementById('pageSize').value;
    let url = `/api/cases?page=${currentPage}&page_size=${pageSize}`;
    if (status === '__active__') {
        url += '&active_only=true';
    } else if (status) {
        url += `&status=${encodeURIComponent(status)}`;
    }
    const res = await fetch(url);
    const data = await res.json();
    document.getElementById('casesCount').textContent =
        `共 ${data.total} 条, 当前 ${data.items.length} 条/页`;
    currentItems = data.items;
    // 状态列排序 (前端排序当前页)
    if (statusSortDir) {
        currentItems = [...currentItems].sort((a, b) => {
            const va = STATUS_ORDER[a.case_status] ?? 99;
            const vb = STATUS_ORDER[b.case_status] ?? 99;
            return statusSortDir === 'asc' ? va - vb : vb - va;
        });
    }
    renderCases(currentItems);
    // 客户ID过滤 (前端过滤当前页, 后端 user_id 参数列为后续项)
    applyUserIdFilter(true);
    // 分页 (P4-L4 2026-08-08 通用分页组件)
    const totalPages = Math.ceil(data.total / pageSize);
    document.getElementById('pagination').innerHTML =
        buildPaginationHtml(currentPage, totalPages, pageSize, 'loadCases');
}

function renderCases(items) {
    const tbody = document.getElementById('cases-table');
    if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">暂无案件</td></tr>';
    } else {
        tbody.innerHTML = items.map(c => `
            <tr>
                <td title="点击复制案件ID: ${c.case_id}" style="cursor:pointer" onclick="copyCaseId('${c.case_id}', this)"><code>${c.case_id}</code> <i class="copy-ico bi bi-clipboard text-muted"></i></td>
                <td>${c.user_id}</td>
                <td>${c.case_category || '-'}</td>
                <td><strong>${c.final_score ?? '-'}</strong></td>
                <td>${riskBadge(c.risk_level || '低')}</td>
                <td>${statusBadge(c.case_status)}${slaBadge(c)}</td>
                <td>${c.create_time ? new Date(c.create_time).toLocaleString('zh-CN') : '-'}</td>
                <td class="col-actions">
                    <button class="btn btn-outline-primary btn-sm" onclick="viewCase('${c.case_id}')">详情</button>
                    ${c.source_id ? `<button class="btn btn-outline-warning btn-sm"
                        title="用 ${c.source_id} 重新执行风控检查"
                        onclick="recheckCase('${c.case_id}','${c.source_id}','${c.user_id}','${c.event_type || '贷款申请'}')">
                        <i class="bi bi-arrow-repeat"></i> 重做检查
                    </button>` : '<span class="text-muted small" title="老案件未记录业务ID, 需手动填写">无 source_id</span>'}
                </td>
            </tr>
        `).join('');
    }
}

// 客户ID 过滤当前页
function applyUserIdFilter(showHint) {
    const q = document.getElementById('filterUserId').value.trim();
    const hint = document.getElementById('filterHint');
    let items = currentItems;
    if (q) items = currentItems.filter(c => String(c.user_id).includes(q));
    renderCases(items);
    if (showHint && q) {
        hint.textContent = `已按客户ID「${q}」过滤当前页, 命中 ${items.length} 条 (后端 user_id 参数为后续项)`;
    } else if (!q) {
        hint.textContent = '';
    }
}

async function viewCase(caseId) {
    const eb = document.getElementById('caseError');
    if (eb) { eb.textContent = ''; eb.classList.add('d-none'); }
    const res = await fetch(`/api/cases/${caseId}`);
    const c = await res.json();
    const body = document.getElementById('caseDetailBody');
    body.innerHTML = `
        <div class="row">
            <div class="col-md-6">
                <h6>基本信息</h6>
                <table class="table table-sm">
                    <tr><td class="text-muted">案件ID</td><td>${c.case_id}</td></tr>
                    <tr><td class="text-muted">客户ID</td><td>${c.user_id}</td></tr>
                    <tr><td class="text-muted">评分</td><td><strong>${c.final_score ?? '-'}</strong></td></tr>
                    <tr><td class="text-muted">等级</td><td>${riskBadge(c.risk_level || '低')}</td></tr>
                    <tr><td class="text-muted">决策</td><td>${c.decision || '-'}</td></tr>
                    <tr><td class="text-muted">状态</td><td>${statusBadge(c.case_status)}</td></tr>
                    <tr><td class="text-muted">分类</td><td>${c.case_category || '-'}</td></tr>
                    <tr><td class="text-muted">创建时间</td><td>${c.create_time ? new Date(c.create_time).toLocaleString('zh-CN') : '-'}</td></tr>
                    ${c.reviewer ? `<tr class="table-light"><td class="text-muted">审核人</td><td><strong>${c.reviewer}</strong></td></tr>` : ''}
                    ${c.review_comment ? `<tr class="table-light"><td class="text-muted">审核意见</td><td>${c.review_comment}</td></tr>` : ''}
                </table>
                <!-- 【P4-L4 2026-08-08】ML 评分 (XGBoost, sigmoid 校准) -->
                <h6 class="mt-3">ML 评分 <small class="text-muted">(XGBoost)</small></h6>
                <div class="ml-score-block p-2 bg-light rounded">
                    ${c.ml_score != null
                        ? renderMLScoreBlock(c.ml_score, c.ml_decision)
                        : '<span class="text-muted">未加载模型</span>'}
                </div>
            </div>
            <div class="col-md-6">
                <h6>命中规则</h6>
                ${c.triggered_rules.length > 0 ? `<table class="table table-sm">
                    <thead><tr><th>规则</th><th>等级</th><th>分值</th></tr></thead>
                    <tbody>${c.triggered_rules.map(r => `<tr><td>${r.rule_name}</td><td>${riskBadge(r.risk_level)}</td><td>${r.risk_score}</td></tr>`).join('')}</tbody>
                </table>` : '<p class="text-muted">无命中规则</p>'}
                ${c.user_profile ? `<h6 class="mt-3">客户画像</h6>
                <table class="table table-sm">
                    <tr><td class="text-muted">风险评分</td><td>${c.user_profile.risk_score}</td></tr>
                    <tr><td class="text-muted">总申请数</td><td>${c.user_profile.total_loans ?? '-'}</td></tr>
                    <tr><td class="text-muted">逾期次数</td><td>${c.user_profile.overdue_count ?? '-'}</td></tr>
                    <tr><td class="text-muted">逾期率</td><td>${c.user_profile.overdue_rate != null ? (c.user_profile.overdue_rate * 100).toFixed(1) + '%' : '-'}</td></tr>
                    <tr><td class="text-muted">投诉次数</td><td>${c.user_profile.complaint_count}</td></tr>
                </table>` : ''}
            </div>
        </div>
        ${c.case_status === '待审核' ? `
        <hr>
        <h6>审核操作</h6>
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">审核人</label>
                <input type="text" class="form-control" id="reviewer" value="" placeholder="请输入审核人">
            </div>
            <div class="col-md-8">
                <label class="form-label">审核意见</label>
                <input type="text" class="form-control" id="reviewComment">
            </div>
        </div>
        <div class="mt-2">
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="checkbox" id="addBlacklist">
                <label class="form-check-label" for="addBlacklist">拒绝时加入黑名单</label>
            </div>
        </div>` : ''}
    `;

    const reviewerEl = document.getElementById('reviewer');
    if (reviewerEl) reviewerEl.value = localStorage.getItem(REVIEWER_KEY) || 'admin';

    const actions = document.getElementById('caseActions');
    if (c.case_status === '待审核') {
        actions.innerHTML = `
            <button class="btn btn-success" onclick="reviewCase('${c.case_id}','已通过')">通过</button>
            <button class="btn btn-danger" onclick="reviewCase('${c.case_id}','已拒绝')">拒绝</button>
            <button class="btn btn-secondary" onclick="reviewCase('${c.case_id}','已关闭')">关闭</button>
        `;
    } else {
        actions.innerHTML = '<button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>';
    }
    new bootstrap.Modal(document.getElementById('caseModal')).show();
}

async function reviewCase(caseId, decision) {
    const reviewer = document.getElementById('reviewer')?.value.trim() || localStorage.getItem(REVIEWER_KEY) || 'admin';
    const reviewComment = document.getElementById('reviewComment')?.value || '';
    const addBl = document.getElementById('addBlacklist')?.checked || false;
    // 二次确认: 展示案件ID、目标状态、是否加黑名单
    document.getElementById('reviewConfirmBody').innerHTML = `
        <p class="mb-2">即将对案件执行审核操作, 请确认:</p>
        <ul class="mb-0">
            <li>案件ID: <code>${caseId}</code></li>
            <li>目标状态: <strong>${decision}</strong></li>
            <li>加入黑名单: ${addBl ? '<strong class="text-danger">是</strong>' : '否'}</li>
            <li>审核人: <strong>${reviewer}</strong></li>
        </ul>`;
    const confirmModal = new bootstrap.Modal(document.getElementById('reviewConfirmModal'));
    const okBtn = document.getElementById('reviewConfirmOk');
    okBtn.disabled = false;
    okBtn.innerHTML = '<i class="bi bi-check-lg me-1"></i>确认';
    okBtn.onclick = async () => {
        // 按钮 loading + disabled, 防重复提交
        okBtn.disabled = true;
        okBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>提交中...';
        await doReview(caseId, decision, {
            reviewer, review_comment: reviewComment, add_to_blacklist: addBl,
        });
    };
    confirmModal.show();
}

async function doReview(caseId, decision, data) {
    const res = await fetch(`/api/cases/${caseId}/review`, {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
    });
    if (res.ok) {
        // 提交成功, 记忆审核人
        if (data.reviewer) localStorage.setItem(REVIEWER_KEY, data.reviewer);
        bootstrap.Modal.getInstance(document.getElementById('caseModal'))?.hide();
        bootstrap.Modal.getInstance(document.getElementById('reviewConfirmModal'))?.hide();
        loadCases(currentPage);
        loadStats();
    } else {
        // 失败: 关闭确认框, 在详情模态框顶部展示错误提示条
        bootstrap.Modal.getInstance(document.getElementById('reviewConfirmModal'))?.hide();
        let msg = '审核失败';
        try {
            const err = await res.json();
            if (err.detail) msg = err.detail;
            if (err.status !== undefined) msg += ` (status: ${err.status})`;
        } catch (e) { msg += ` (HTTP ${res.status})`; }
        const eb = document.getElementById('caseError');
        eb.textContent = msg;
        eb.classList.remove('d-none');
    }
}

// 重做检查: 把案件的 source_id / user_id / event_type 带到风控检查页
function recheckCase(caseId, sourceId, userId, eventType) {
    if (!sourceId) {
        alert('该案件没有记录业务ID, 无法重做检查');
        return;
    }
    // 同时写入 sessionStorage 与 localStorage, 供 risk_check 读取 (sessionStorage 优先, localStorage 兜底)
    const prefill = JSON.stringify({
        case_id: caseId,
        event_type: eventType || '贷款申请',
        user_id: userId,
        source_id: sourceId,
    });
    sessionStorage.setItem('risk_check_prefill', prefill);
    localStorage.setItem('risk_check_prefill', prefill);
    window.location.href = '/risk-check';
}

loadStats();
loadCases();
</script>
{% endblock %}
