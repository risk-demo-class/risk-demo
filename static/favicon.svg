<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角方形外框 + 发光 -->
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="url(#bg)" filter="url(#glow)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" ry="14" fill="none" stroke="#38bdf8" stroke-width="1.2" opacity="0.7"/>

  <!-- 盾牌 (风控核心) -->
  <path d="M32 8 L52 14 V30 C52 43 42 52 32 56 C22 52 12 43 12 30 V14 Z"
        fill="url(#shield)" stroke="#0f172a" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- AI 芯片方块 (大脑/智能) 叠加在盾牌中央 -->
  <g transform="translate(20 22)">
    <rect x="0" y="0" width="24" height="20" rx="3" ry="3" fill="url(#chip)" stroke="#0c4a6e" stroke-width="1"/>
    <rect x="4" y="4" width="16" height="12" rx="1.5" fill="#0ea5e9" opacity="0.35"/>
    <!-- 芯片引脚 -->
    <line x1="-3" y1="5"  x2="0" y2="5"  stroke="#0c4a6e" stroke-width="1.6"/>
    <line x1="-3" y1="10" x2="0" y2="10" stroke="#0c4a6e" stroke-width="1.6"/>
    <line x1="-3" y1="15" x2="0" y2="15" stroke="#0c4a6e" stroke-width="1.6"/>
    <line x1="24" y1="5"  x2="27" y2="5"  stroke="#0c4a6e" stroke-width="1.6"/>
    <line x1="24" y1="10" x2="27" y2="10" stroke="#0c4a6e" stroke-width="1.6"/>
    <line x1="24" y1="15" x2="27" y2="15" stroke="#0c4a6e" stroke-width="1.6"/>
    <!-- AI 字母 (AI_Risk 缩写) -->
    <text x="12" y="15" text-anchor="middle" font-family="Arial Black, sans-serif"
          font-size="10" font-weight="900" fill="#ffffff" letter-spacing="0.5">AI</text>
  </g>

  <!-- 盾牌上三颗装饰星 (等级感) -->
  <g fill="#fbbf24" stroke="#b45309" stroke-width="0.3">
    <circle cx="19" cy="20" r="1.4"/>
    <circle cx="32" cy="17" r="1.6"/>
    <circle cx="45" cy="20" r="1.4"/>
  </g>

  <!-- 盾牌底部小对勾 (风控通过 / 安全感) -->
  <path d="M27 48 L31 52 L39 44" fill="none" stroke="#16a34a" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
