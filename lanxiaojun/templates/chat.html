{% extends "base.html" %}
{% block title %}AI 助手 - 教育风控系统{% endblock %}
{% block content %}
<div class="page-title">
    <i class="bi bi-robot"></i> AI 风控助手
</div>

<div class="card stat-card border-0">
    <div class="card-body p-0">
        <!-- 消息区域 -->
        <div class="chat-messages p-4" id="chatMessages">
            <div class="d-flex">
                <div class="chat-bubble ai">
                    <div class="fw-bold mb-2"><i class="bi bi-robot me-1"></i>风控AI 助手</div>
                    你好！我可以帮你完成以下任务：<br><br>
                    <span class="d-inline-flex align-items-center me-3"><i class="bi bi-shield-check text-primary me-1"></i> 风险检查</span>
                    <span class="d-inline-flex align-items-center me-3"><i class="bi bi-folder2-open text-warning me-1"></i> 案件查询</span>
                    <span class="d-inline-flex align-items-center me-3"><i class="bi bi-person-badge text-info me-1"></i> 用户画像</span>
                    <span class="d-inline-flex align-items-center me-3"><i class="bi bi-graph-up text-success me-1"></i> 统计趋势</span>
                    <span class="d-inline-flex align-items-center"><i class="bi bi-shield-x text-danger me-1"></i> 黑名单管理</span>
                    <br><br>请问有什么需要帮助的？
                </div>
            </div>
        </div>
        <!-- 输入区域 -->
        <div class="border-top p-3" style="background:#f8fafc;border-radius:0 0 14px 14px;">
            <form id="chatForm" class="d-flex gap-2">
                <input type="text" class="form-control" id="chatInput" placeholder="输入你的问题..." autocomplete="off">
                <button type="submit" class="btn btn-primary" id="sendBtn">
                    <i class="bi bi-send-fill"></i>
                </button>
                <button type="button" class="btn btn-outline-danger" onclick="clearChat()" title="清空对话">
                    <i class="bi bi-trash3"></i>
                </button>
            </form>
        </div>
    </div>
</div>

<!-- 快捷指令 -->
<div class="mt-3 d-flex align-items-center gap-2 flex-wrap">
    <small class="text-muted fw-medium me-1"><i class="bi bi-lightning-charge me-1"></i>快捷指令:</small>
    <button class="btn btn-outline-primary btn-sm rounded-pill px-3" onclick="sendQuick('查看今天的风控统计数据')">
        <i class="bi bi-speedometer2 me-1"></i>今日统计
    </button>
    <button class="btn btn-outline-warning btn-sm rounded-pill px-3" onclick="sendQuick('查看所有待审核的案件')">
        <i class="bi bi-folder2-open me-1"></i>待审案件
    </button>
    <button class="btn btn-outline-info btn-sm rounded-pill px-3" onclick="sendQuick('分析用户1003的风险画像')">
        <i class="bi bi-person-badge me-1"></i>用户画像
    </button>
    <button class="btn btn-outline-success btn-sm rounded-pill px-3" onclick="sendQuick('分析规则命中效果')">
        <i class="bi bi-list-check me-1"></i>规则分析
    </button>
    <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" onclick="sendQuick('查看近30天的风控趋势')">
        <i class="bi bi-graph-up me-1"></i>趋势分析
    </button>
</div>

{% endblock %}

{% block extra_js %}
<script>
let sessionId = null;

function addMessage(content, role) {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'd-flex' + (role === 'user' ? ' justify-content-end' : '');
    // 处理markdown格式（简单替换）
    let html = content
        .replace(/\n/g, '<br>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`(.*?)`/g, '<code>$1</code>');
    div.innerHTML = `<div class="chat-bubble ${role}">${html}</div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

async function sendMessage(message) {
    if (!message.trim()) return;
    addMessage(message, 'user');
    document.getElementById('chatInput').value = '';
    const btn = document.getElementById('sendBtn');
    btn.disabled = true;

    // 显示加载指示器
    const loadingDiv = document.createElement('div');
    loadingDiv.className = 'd-flex';
    loadingDiv.id = 'loading';
    loadingDiv.innerHTML = '<div class="chat-bubble ai"><span class="spinner-border spinner-border-sm"></span> 思考中...</div>';
    document.getElementById('chatMessages').appendChild(loadingDiv);

    try {
        const res = await fetch('/api/agent/chat', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ message, session_id: sessionId }),
        });
        const data = await res.json();
        sessionId = data.session_id;
        document.getElementById('loading')?.remove();
        addMessage(data.reply, 'ai');
    } catch(e) {
        document.getElementById('loading')?.remove();
        addMessage('请求失败: ' + e.message, 'ai');
    } finally {
        btn.disabled = false;
        document.getElementById('chatInput').focus();
    }
}

function sendQuick(msg) {
    document.getElementById('chatInput').value = msg;
    sendMessage(msg);
}

async function clearChat() {
    if (sessionId) {
        await fetch(`/api/agent/clear?session_id=${sessionId}`, { method: 'POST' });
    }
    sessionId = null;
    const container = document.getElementById('chatMessages');
    container.innerHTML = `<div class="d-flex"><div class="chat-bubble ai">对话已清空，请重新开始提问。</div></div>`;
}

document.getElementById('chatForm').addEventListener('submit', function(e) {
    e.preventDefault();
    sendMessage(document.getElementById('chatInput').value);
});
</script>
{% endblock %}
