name: ai-risk

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123321}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecs}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # MySQL runs these files in lexical order only when the volume is new.
      - ../sql/init_business_tables.sql:/docker-entrypoint-initdb.d/01_business_tables.sql:ro
      - ../sql/init_business_data.sql:/docker-entrypoint-initdb.d/02_business_data.sql:ro
      - ../sql/init_risk_tables.sql:/docker-entrypoint-initdb.d/03_risk_tables.sql:ro
      - ../sql/init_risk_data.sql:/docker-entrypoint-initdb.d/04_risk_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - backend

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123321}
      DB_NAME: ${MYSQL_DATABASE:-ecs}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen-plus}
      CASE_TIMEOUT_HOURS: ${CASE_TIMEOUT_HOURS:-24}
      ALERT_SCHEDULER_INTERVAL_MIN: ${ALERT_SCHEDULER_INTERVAL_MIN:-15}
      ALERT_PENDING_CASE_THRESHOLD: ${ALERT_PENDING_CASE_THRESHOLD:-50}
      ALERT_CHECK_WINDOW_HOURS: ${ALERT_CHECK_WINDOW_HOURS:-1}
    volumes:
      - app_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - backend

networks:
  backend:

volumes:
  mysql_data:
  app_logs:
