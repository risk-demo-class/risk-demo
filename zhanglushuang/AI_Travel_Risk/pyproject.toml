[project]
name = "travel-risk-control"
version = "0.1.0"
description = "旅游出行风控系统 - 规则引擎 + XGBoost 双轨融合 + DeepSeek 本地 LLM 辅助"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    # Web 框架
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "gunicorn>=23.0.0,<24.0.0",
    "pydantic>=2.10.0,<2.11.0",
    "pydantic-settings>=2.7.0,<2.8.0",
    "python-multipart>=0.0.18",
    "jinja2>=3.1.0,<4.0.0",

    # 数据库
    "sqlalchemy>=2.0.0,<2.1.0",
    "pymysql>=1.1.0,<1.2.0",
    "aiomysql>=0.2.0,<0.3.0",
    "cryptography>=44.0.0",

    # 数据处理 / 特征配置 / XGBoost
    "pandas>=2.2.0,<2.3.0",
    "numpy>=1.26.0,<3.0.0",
    "scikit-learn>=1.5.0,<1.6.0",
    "xgboost>=2.0.0,<3.0.0",
    "PyYAML>=6.0.0,<7.0.0",

    # DeepSeek 本地 OpenAI 兼容接口使用 httpx 直连, 不依赖 langchain

    # 工具
    "python-dotenv>=1.0.0,<2.0.0",
    "ulid-py>=1.1.0,<1.2.0",
    "faker>=33.0.0,<34.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0,<8.4.0",
    "pytest-asyncio>=0.25.0,<0.26.0",
    "httpx>=0.28.0,<0.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "scripts"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
