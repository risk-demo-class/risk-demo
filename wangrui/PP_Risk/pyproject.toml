[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pp-risk"
version = "0.2.1"
description = "Global cross-border payments AML and fraud risk platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "aiomysql>=0.2,<1",
  "cryptography>=42,<47",
  "pydantic-settings>=2.7,<3",
  "jinja2>=3.1,<4",
  "langchain>=1.2,<2",
  "langchain-openai>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
exclude = ["generated*", "static*", "templates*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
cache_dir = ".test-artifacts/pytest-cache"
addopts = "--basetemp=.test-artifacts/pytest-tmp"

[tool.ruff]
line-length = 120
