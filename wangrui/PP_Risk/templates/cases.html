{% extends "base.html" %}{% block content %}<section class="card card-pad"><div class="section-head"><div><h2>人工审核队列</h2><p>查看详情并执行通过、拒绝或拒绝加黑</p></div><span class="badge amber" id="total">—</span></div><form class="filter-panel" id="filters"><select name="status"><option value="">全部状态</option><option selected>待审核</option><option>审核中</option><option>已通过</option><option>已拒绝</option></select><input name="user_id" placeholder="用户ID"><input name="category" placeholder="案件分类"><input name="event_type" placeholder="事件类型"><div class="toolbar full"><button class="btn primary">筛选</button><button type="button" class="btn" id="reset">重置</button></div></form><div class="table-wrap" id="cases"><div class="loading">正在加载…</div></div><div class="pager" id="pager"></div></section><dialog class="detail-dialog" id="caseDialog"><div class="dialog-head"><h2>案件审核</h2><button class="icon-btn" onclick="caseDialog.close()">×</button></div><div id="caseBody"></div></dialog>{% endblock %}
{% block scripts %}<script>let page=1,current=null;const form=document.querySelector('#filters'),box=document.querySelector('#cases');function qs(){const p=new URLSearchParams(new FormData(form));[...p].forEach(([k,v])=>!v&&p.delete(k));p.set('page',page);p.set('page_size',25);return p}function kv(o){return `<div class="kv">${Object.entries(o||{}).map(([k,v])=>`<div><b>${PP.escape(k)}</b><span>${PP.escape(v??'-')}</span></div>`).join('')}</div>`}async function load(){try{const d=await PP.get(`/api/cases?${qs()}`);document.querySelector('#total').textContent=`${d.total} 个案件`;box.innerHTML=d.items.length?`<table><thead><tr><th>案件ID</th><th>用户</th><th>分类</th><th>状态</th><th>事件</th><th>时间</th><th>操作</th></tr></thead><tbody>${d.items.map(x=>`<tr><td><code>${PP.escape(x.case_id)}</code></td><td>${PP.escape(x.user_id)}</td><td>${PP.escape(x.case_category||'-')}</td><td><span class="badge amber">${PP.escape(x.case_status)}</span></td><td>${PP.escape(x.event_type||'-')}</td><td>${PP.time(x.create_time)}</td><td><button class="btn" onclick="openCase('${PP.escape(x.case_id)}')">详情/审核</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无案件</div>';const pages=Math.max(1,Math.ceil(d.total/d.page_size));document.querySelector('#pager').innerHTML=`<button class="btn" ${page<=1?'disabled':''} onclick="go(${page-1})">上一页</button><span>${page}/${pages}</span><button class="btn" ${page>=pages?'disabled':''} onclick="go(${page+1})">下一页</button>`}catch(e){PP.state(box,'error',e.message)}}function go(p){page=p;load()}async function openCase(id){current=id;caseDialog.showModal();const d=await PP.get(`/api/cases/${id}`);const editable=['待审核','审核中'].includes(d.case.case_status);document.querySelector('#caseBody').innerHTML=`<h3>案件</h3>${kv(d.case)}<h3>评估</h3>${kv(d.assessment)}<h3>事件</h3>${kv(d.event)}${editable?`<div class="form-grid"><div class="field"><label>审核人</label><input id="reviewer" value="admin"></div><div class="field full"><label>审核意见</label><textarea id="comment" rows="3"></textarea></div><label class="full"><input id="addBl" type="checkbox"> 拒绝时加入用户黑名单</label></div><div class="toolbar"><button class="btn primary" onclick="review('已通过')">通过</button><button class="btn danger" onclick="review('已拒绝')">拒绝</button></div>`:''}`}async function review(decision){const comment=document.querySelector('#comment').value.trim();if(!comment)return alert('请填写审核意见');const add=document.querySelector('#addBl').checked;if(add&&decision!=='已拒绝')return alert('加入黑名单必须选择拒绝');try{const r=await PP.post(`/api/cases/${current}/review`,{decision,reviewer:document.querySelector('#reviewer').value,review_comment:comment,add_to_blacklist:add,blacklist_reason:comment});alert(`案件已${r.status}`);caseDialog.close();load()}catch(e){alert(e.message)}}form.onsubmit=e=>{e.preventDefault();page=1;load()};document.querySelector('#reset').onclick=()=>{form.reset();page=1;load()};load();</script>{% endblock %}
