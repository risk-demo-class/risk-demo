{% extends "base.html" %}{% block content %}<section class="card card-pad"><div class="section-head"><div><h2>PP智能客服</h2><p id="agentStatus">正在检查模型配置…</p></div><div class="field"><label>当前客户</label><input id="userId" value="USR000000000001"></div></div><div class="messages agent-chat" id="chat"><article class="chat-bubble agent">你好，我可以查询你的交易、案件和客服历史，也可以在二次确认后帮你提交人工审核。</article></div><form class="toolbar" id="chatForm"><input id="message" placeholder="例如：查看我最近的交易" autocomplete="off"><button class="btn primary" id="send">发送</button><button class="btn" type="button" id="clear">清空</button></form><div class="toolbar"><button class="btn quick" data-text="查看我的账户和风险状态">账户状态</button><button class="btn quick" data-text="查看我最近的交易">最近交易</button><button class="btn quick" data-text="查看我的人工审核案件">审核进度</button><button class="btn quick" data-text="查看我的客服历史">客服历史</button></div></section>{% endblock %}{% block scripts %}<script>let sessionId=null;const chat=document.querySelector('#chat'),input=document.querySelector('#message');function bubble(text,role){const el=document.createElement('article');el.className=`chat-bubble ${role}`;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight}async function status(){const s=await PP.get('/api/agent/status');document.querySelector('#agentStatus').textContent=s.enabled?`${s.provider} / ${s.model} 已启用`:`${s.model} 未配置，请在.env设置LLM_API_KEY`;document.querySelector('#send').disabled=!s.enabled}async function send(text){if(!text.trim())return;bubble(text,'user');input.value='';document.querySelector('#send').disabled=true;try{const d=await PP.post('/api/agent/chat',{message:text,user_id:document.querySelector('#userId').value,session_id:sessionId});sessionId=d.session_id;bubble(d.reply,'agent');if(d.confirmation_token){const b=document.createElement('button');b.className='btn primary';b.textContent='确认执行';b.onclick=()=>confirmAction(d.confirmation_token);chat.appendChild(b)}}catch(e){bubble(e.message,'agent')}finally{document.querySelector('#send').disabled=false}}async function confirmAction(token){try{const r=await PP.post('/api/agent/confirm',{token,user_id:document.querySelector('#userId').value,session_id:sessionId});bubble(`已提交人工审核，案件 ${r.case_id}`,'agent')}catch(e){bubble(e.message,'agent')}}document.querySelector('#chatForm').onsubmit=e=>{e.preventDefault();send(input.value)};document.querySelectorAll('.quick').forEach(b=>b.onclick=()=>send(b.dataset.text));document.querySelector('#clear').onclick=async()=>{if(sessionId)await PP.post('/api/agent/clear',{session_id:sessionId,user_id:document.querySelector('#userId').value});sessionId=null;chat.innerHTML='<article class="chat-bubble agent">会话已清空。</article>'};status();</script>{% endblock %}
