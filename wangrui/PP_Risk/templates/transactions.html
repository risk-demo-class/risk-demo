{% extends "base.html" %}
{% block content %}
<section class="card card-pad">
  <div class="section-head"><div><h2>交易流水</h2><p>全字段服务端筛选，点击ID或时间查看聚合详情</p></div><span class="badge blue" id="total">—</span></div>
  <form class="filter-panel" id="filters">
    <input name="transaction_id" placeholder="交易ID包含">
    <select name="transaction_type"><option value="">全部类型</option><option>USER_TRANSFER</option><option>MERCHANT_PAYMENT</option><option>CROSS_BORDER</option><option>TOP_UP</option><option>WITHDRAWAL</option></select>
    <input name="payer_account_id" placeholder="付款账户">
    <input name="payee_account_id" placeholder="收款账户">
    <input name="amount_min" type="number" step="0.01" placeholder="最小金额">
    <input name="amount_max" type="number" step="0.01" placeholder="最大金额">
    <input name="asset_code" placeholder="币种">
    <input name="transaction_status" placeholder="状态">
    <input name="channel" placeholder="渠道">
    <details class="advanced full"><summary>全部时间与排序字段</summary><div class="filter-panel inner">
      <input name="create_time_from" type="datetime-local" aria-label="创建开始"><input name="create_time_to" type="datetime-local" aria-label="创建结束">
      <input name="complete_time_from" type="datetime-local" aria-label="完成开始"><input name="complete_time_to" type="datetime-local" aria-label="完成结束">
      <select name="sort_by"><option value="create_time">按创建时间</option><option value="complete_time">按完成时间</option><option value="amount">按金额</option><option value="transaction_id">按交易ID</option></select>
      <select name="sort_order"><option value="desc">降序</option><option value="asc">升序</option></select>
    </div></details>
    <div class="toolbar full"><button class="btn primary">应用筛选</button><button class="btn" type="button" id="reset">重置</button></div>
  </form>
  <div class="table-wrap" id="table"><div class="loading">正在加载…</div></div><div class="pager" id="pager"></div>
</section>
<dialog class="detail-dialog" id="detail"><div class="dialog-head"><h2>交易详情</h2><button class="icon-btn" onclick="detail.close()">×</button></div><div id="detailBody"></div></dialog>
{% endblock %}
{% block scripts %}<script>
let page=1, lastDetail=null; const form=document.querySelector('#filters'), box=document.querySelector('#table'), detail=document.querySelector('#detail');
function params(){const p=new URLSearchParams(new FormData(form));[...p].forEach(([k,v])=>!v&&p.delete(k));p.set('page',page);p.set('page_size','25');return p}
function kv(obj){return `<div class="kv">${Object.entries(obj||{}).map(([k,v])=>`<div><b>${PP.escape(k)}</b><span>${PP.escape(v??'-')}</span></div>`).join('')}</div>`}
async function load(){PP.state(box,'loading','正在加载…');try{const p=params();history.replaceState(null,'',`?${p}`);const d=await PP.get(`/api/transactions?${p}`);document.querySelector('#total').textContent=`${d.total.toLocaleString()} 笔`;box.innerHTML=`<table><thead><tr><th>交易ID</th><th>类型</th><th>付款/收款</th><th>金额</th><th>渠道</th><th>状态</th><th>创建/完成</th></tr></thead><tbody>${d.items.map(x=>`<tr><td><button class="link-btn" onclick="openDetail('${PP.escape(x.transaction_id)}')">${PP.escape(x.transaction_id)}</button></td><td><span class="badge blue">${PP.escape(x.transaction_type)}</span></td><td><code>${PP.escape(x.payer_account_id)}</code><br><code>${PP.escape(x.payee_account_id)}</code></td><td>${PP.money(x.amount,x.asset_code)}</td><td>${PP.escape(x.channel)}</td><td><span class="badge green">${PP.escape(x.transaction_status)}</span></td><td><button class="time-link" onclick="openDetail('${PP.escape(x.transaction_id)}')">${PP.time(x.create_time)}</button><br><button class="time-link" onclick="openDetail('${PP.escape(x.transaction_id)}')">${PP.time(x.complete_time)}</button></td></tr>`).join('')}</tbody></table>`;const pages=Math.max(1,Math.ceil(d.total/d.page_size));document.querySelector('#pager').innerHTML=`<button class="btn" ${page<=1?'disabled':''} onclick="go(${page-1})">上一页</button><span>${page} / ${pages}</span><button class="btn" ${page>=pages?'disabled':''} onclick="go(${page+1})">下一页</button>`}catch(e){PP.state(box,'error',e.message)}}
function go(p){page=p;load()} async function openDetail(id){lastDetail=id;detail.showModal();PP.state(document.querySelector('#detailBody'),'loading','加载详情…');try{const d=await PP.get(`/api/transactions/${id}`);document.querySelector('#detailBody').innerHTML=`<h3>基础信息</h3>${kv(d.transaction)}<h3>交易参与方</h3>${d.parties.map(kv).join('')||'<p>无</p>'}<h3>子类型</h3>${d.subtype.map(kv).join('')||'<p>无</p>'}<h3>状态时间线</h3>${d.status_history.map(kv).join('')||'<p>无</p>'}<h3>账务记录</h3>${d.ledger_entries.map(kv).join('')||'<p>无</p>'}<h3>风险信息</h3>${kv(d.risk.case||d.risk.assessment||{})}<button class="btn primary" onclick="reviewTransaction()">提交人工审核</button>`}catch(e){PP.state(document.querySelector('#detailBody'),'error',e.message)}}
async function reviewTransaction(){const reason=prompt('请输入提交人工审核原因');if(!reason)return;try{const r=await PP.post(`/api/transactions/${lastDetail}/submit-review`,{reason,note:'由交易监控提交',category:'PAYMENT_RISK',priority:'HIGH',operator:'web-operator'});alert(r.created?`已创建案件 ${r.case_id}`:`已有待审案件 ${r.case_id}`)}catch(e){alert(e.message)}}
form.addEventListener('submit',e=>{e.preventDefault();page=1;load()});document.querySelector('#reset').onclick=()=>{form.reset();page=1;load()};load();
</script>{% endblock %}
