{% extends "base.html" %}
{% block content %}<section class="grid two-col"><article class="card card-pad"><div class="section-head"><div><h2>提交风险事件</h2><p>业务事件通过四步入口进入七步决策流水线</p></div></div><form id="risk-form" class="form-grid"><div class="field"><label for="event">技术事件槽位</label><select id="event"><option value="支付">支付 · 资金交易</option><option value="下单">下单 · 准入登录</option><option value="售后申请">售后申请 · 退款拒付</option><option value="物流投诉">物流投诉 · AML客服</option></select></div><div class="field"><label for="business">金融业务事件</label><select id="business"><option>USER_TRANSFER</option><option>MERCHANT_PAYMENT</option><option>CROSS_BORDER_TRANSFER</option><option>WITHDRAWAL</option><option>SANCTIONS_SCREENING</option></select></div><div class="field"><label for="user">用户ID</label><input id="user" required placeholder="USR000000000001"></div><div class="field"><label for="source">业务来源ID</label><input id="source" required placeholder="TXN000000000001"></div><div class="field full"><label for="device">设备ID（可选）</label><input id="device" placeholder="DEV000000000001"></div><button class="btn primary full" type="submit">执行实时检查</button></form></article><article class="card card-pad"><div class="section-head"><div><h2>决策结果</h2><p>评分、等级、动作与命中规则</p></div></div><div id="result" class="empty">填写左侧业务参数后执行检查</div></article></section>{% endblock %}
{% block scripts %}<script>document.querySelector('#risk-form').addEventListener('submit',async e=>{e.preventDefault();const box=document.querySelector('#result');const button=e.submitter;button.disabled=true;PP.state(box,'loading','正在计算特征并执行规则…');try{const source=document.querySelector('#source').value.trim();const result=await PP.post('/api/risk/check',{event_type:document.querySelector('#event').value,user_id:document.querySelector('#user').value.trim(),source_id:source,order_id:document.querySelector('#event').value==='支付'?source:null,receive_id:document.querySelector('#device').value.trim()||null,event_data:{business_event_type:document.querySelector('#business').value}});box.className='result';box.innerHTML=`<div class="section-head"><div><h2>${PP.escape(result.decision)}</h2><p>风险等级 ${PP.escape(result.risk_level)}</p></div><span class="badge ${result.final_score>=90?'red':result.final_score>=70?'amber':'green'}">${result.final_score} / 100</span></div><p><strong>评估ID：</strong><code>${PP.escape(result.assessment_id)}</code></p><p><strong>命中规则：</strong>${result.rule_count}</p>${result.triggered_rules.length?`<ul>${result.triggered_rules.map(x=>`<li>${PP.escape(x.rule_name)} · ${x.risk_score}分 · ${PP.escape(x.action)}</li>`).join('')}</ul>`:'<p class="stat-note">未命中已启用规则，最终分可能来自基线模型。</p>'}`;}catch(error){PP.state(box,'error',error.message)}finally{button.disabled=false}});</script>{% endblock %}
