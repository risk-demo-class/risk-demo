{% extends "base.html" %}
{% block content %}
<section class="grid stats" aria-label="核心指标">
  <article class="card stat"><div class="stat-label">交易总量</div><div class="stat-value" id="tx-count">—</div><div class="stat-note">全渠道支付事件</div></article>
  <article class="card stat"><div class="stat-label">累计交易额</div><div class="stat-value" id="tx-volume">—</div><div class="stat-note">模拟基准币种</div></article>
  <article class="card stat"><div class="stat-label">客户 / 商户</div><div class="stat-value" id="subjects">—</div><div class="stat-note">业务关系主体</div></article>
  <article class="card stat"><div class="stat-label">待审案件</div><div class="stat-value" id="pending-cases">—</div><div class="stat-note">需要人工处置</div></article>
</section>
<section class="grid two-col"><article class="card card-pad"><div class="section-head"><div><h2>实时风控状态</h2><p>交易量、高风险评估与新增案件</p></div><div class="toolbar"><select id="trendWindow"><option value="1h">1小时</option><option value="6h">6小时</option><option value="24h" selected>24小时</option><option value="7d">7天</option></select><button class="btn" id="refreshTrend">刷新</button></div></div><canvas id="riskTrend" height="280" aria-label="实时风控趋势折线图"></canvas><div class="chart-legend"><span class="tx">交易</span><span class="risk">高风险</span><span class="cases">新增案件</span><small id="trendUpdated">—</small></div></article><article class="card card-pad"><div class="section-head"><div><h2>交易结构</h2><p>按业务事件类型聚合</p></div></div><div class="type-bars" id="types"><div class="loading">正在聚合…</div></div></article></section>
{% endblock %}
{% block scripts %}<script>
const canvas=document.querySelector('#riskTrend'),ctx=canvas.getContext('2d');
function draw(points){const ratio=devicePixelRatio||1,w=canvas.clientWidth,h=280;canvas.width=w*ratio;canvas.height=h*ratio;ctx.scale(ratio,ratio);ctx.clearRect(0,0,w,h);const pad=34,max=Math.max(1,...points.flatMap(p=>[p.transactions,p.high_risk,p.new_cases]));ctx.strokeStyle='#dbe5ec';ctx.fillStyle='#64788a';ctx.font='11px Segoe UI';for(let i=0;i<=4;i++){const y=pad+(h-pad*2)*i/4;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();ctx.fillText(Math.round(max*(4-i)/4),3,y+4)}const lines=[['transactions','#1f9cd7'],['high_risk','#d94b5b'],['new_cases','#d99016']];for(const [key,color] of lines){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2.5;points.forEach((p,i)=>{const x=pad+(w-pad*2)*(i/Math.max(1,points.length-1)),y=h-pad-(h-pad*2)*(p[key]/max);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}}
async function loadTrend(){const d=await PP.get(`/api/dashboard/risk-trend?window=${document.querySelector('#trendWindow').value}`);draw(d.points);document.querySelector('#trendUpdated').textContent=`更新 ${PP.time(d.updated_at)}`}
async function loadOverview(){const d=await PP.get('/api/dashboard/overview');document.querySelector('#tx-count').textContent=d.transaction_count.toLocaleString();document.querySelector('#tx-volume').textContent=PP.money(d.transaction_volume);document.querySelector('#subjects').textContent=`${d.user_count.toLocaleString()} / ${d.merchant_count.toLocaleString()}`;document.querySelector('#pending-cases').textContent=d.pending_cases.toLocaleString();const max=Math.max(...d.transaction_types.map(x=>x.count),1);document.querySelector('#types').innerHTML=d.transaction_types.map(x=>`<div class="type-row"><span>${PP.escape(x.name)}</span><div class="bar"><span style="width:${x.count/max*100}%"></span></div><strong>${x.count}</strong></div>`).join('')}
document.querySelector('#trendWindow').onchange=loadTrend;document.querySelector('#refreshTrend').onclick=loadTrend;loadOverview();loadTrend();setInterval(loadTrend,15000);addEventListener('resize',()=>loadTrend());
</script>{% endblock %}
