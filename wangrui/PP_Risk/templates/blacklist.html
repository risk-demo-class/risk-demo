{% extends "base.html" %}{% block content %}<section class="grid stats"><article class="card stat"><div class="stat-label">有效黑名单</div><div class="stat-value" id="active">—</div></article><article class="card stat"><div class="stat-label">失效/移除</div><div class="stat-value" id="inactive">—</div></article></section><section class="card card-pad"><div class="section-head"><div><h2>用户黑名单</h2><p>统一格式 USER:user_id，与风控入口联动</p></div><button class="btn primary" onclick="addUser()">添加用户</button></div><form class="filter-panel" id="filters"><input name="value" placeholder="用户ID或黑名单值"><input name="reason" placeholder="原因包含"><select name="active"><option value="true">仅有效</option><option value="">全部</option><option value="false">仅失效</option></select><button class="btn">筛选</button></form><div class="table-wrap" id="list"></div></section>{% endblock %}{% block scripts %}<script>const f=document.querySelector('#filters'),box=document.querySelector('#list');async function load(){const p=new URLSearchParams(new FormData(f));[...p].forEach(([k,v])=>!v&&p.delete(k));const d=await PP.get(`/api/blacklist?${p}`);document.querySelector('#active').textContent=d.active_count;document.querySelector('#inactive').textContent=d.inactive_count;box.innerHTML=d.items.length?`<table><thead><tr><th>ID</th><th>用户</th><th>原因</th><th>过期</th><th>状态</th><th>操作</th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${x.blacklist_id}</td><td><code>${PP.escape(x.blacklist_value)}</code></td><td>${PP.escape(x.reason||'-')}</td><td>${PP.time(x.expire_time)}</td><td><span class="badge ${x.active?'red':''}">${x.active?'有效':'失效'}</span></td><td>${x.active?`<button class="btn danger" onclick="removeEntry(${x.blacklist_id})">移除</button>`:'-'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">暂无黑名单</div>'}async function addUser(){const user_id=prompt('输入用户ID');if(!user_id)return;const reason=prompt('输入加入原因');if(!reason)return;try{await PP.post('/api/blacklist',{user_id,reason,operator:'admin'});load()}catch(e){alert(e.message)}}async function removeEntry(id){if(!confirm('确认移除此黑名单？'))return;const r=await fetch(`/api/blacklist/${id}?operator=admin`,{method:'DELETE'});if(!r.ok)return alert('移除失败');load()}f.onsubmit=e=>{e.preventDefault();load()};load();</script>{% endblock %}
