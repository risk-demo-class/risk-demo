{% extends "base.html" %}
{% block content %}
<section class="card card-pad"><div class="section-head"><div><h2>客服交互工作台</h2><p>Interaction历史关系 → Segment完整会话 → Message单次发言</p></div><span class="badge blue" id="total">—</span></div>
<form class="filter-panel" id="filters"><input name="interaction_id" placeholder="Interaction ID"><input name="customer_id" placeholder="客户ID"><input name="agent_id" placeholder="客服ID"><select name="channel_family"><option value="">全部渠道族</option><option>OMNICHANNEL</option><option>CHAT</option><option>EMAIL</option></select><input name="interaction_status" placeholder="状态"><input name="segment_count_min" type="number" min="0" placeholder="最少会话数"><input name="message_count_min" type="number" min="0" placeholder="最少发言数"><details class="advanced full"><summary>全部时间和统计字段</summary><div class="filter-panel inner"><input name="customer_type" placeholder="客户类型"><input name="relationship_start_from" type="datetime-local"><input name="relationship_start_to" type="datetime-local"><input name="last_contact_from" type="datetime-local"><input name="last_contact_to" type="datetime-local"><input name="segment_count_max" type="number" min="0" placeholder="最多会话"><input name="message_count_max" type="number" min="0" placeholder="最多发言"></div></details><div class="toolbar full"><button class="btn primary">应用筛选</button><button class="btn" type="button" id="reset">重置</button></div></form>
<div class="workbench"><div class="table-wrap" id="list"><div class="loading">加载中…</div></div><div id="conversation" class="conversation empty">选择一个Interaction查看历史会话</div></div><div class="pager" id="pager"></div></section>
<dialog class="detail-dialog" id="messageDialog"><div class="dialog-head"><h2>消息详情</h2><button class="icon-btn" onclick="messageDialog.close()">×</button></div><div id="messageDetail"></div></dialog>
{% endblock %}
{% block scripts %}<script>
let page=1,currentInteraction=null,currentSegment=null;const form=document.querySelector('#filters'),list=document.querySelector('#list'),conversation=document.querySelector('#conversation');
function params(){const p=new URLSearchParams(new FormData(form));[...p].forEach(([k,v])=>!v&&p.delete(k));p.set('page',page);p.set('page_size','25');return p} function kv(o){return `<div class="kv">${Object.entries(o||{}).map(([k,v])=>`<div><b>${PP.escape(k)}</b><span>${PP.escape(v??'-')}</span></div>`).join('')}</div>`}
async function load(){try{const p=params(),d=await PP.get(`/api/interactions?${p}`);document.querySelector('#total').textContent=`${d.total} 条`;list.innerHTML=`<table><thead><tr><th>Interaction</th><th>客户/客服</th><th>会话/发言</th><th>时间</th></tr></thead><tbody>${d.items.map(x=>`<tr onclick="openInteraction('${PP.escape(x.interaction_id)}')"><td><button class="link-btn">${PP.escape(x.interaction_id)}</button><br><span class="badge green">${PP.escape(x.interaction_status)}</span></td><td><code>${PP.escape(x.customer_id)}</code><br>${PP.escape(x.agent_id)}</td><td>${x.segment_count} / ${x.message_count}</td><td><button class="time-link">${PP.time(x.relationship_start_time)}</button><br><button class="time-link">${PP.time(x.last_contact_time)}</button></td></tr>`).join('')}</tbody></table>`;const pages=Math.max(1,Math.ceil(d.total/d.page_size));document.querySelector('#pager').innerHTML=`<button class="btn" ${page<=1?'disabled':''} onclick="go(${page-1})">上一页</button><span>${page}/${pages}</span><button class="btn" ${page>=pages?'disabled':''} onclick="go(${page+1})">下一页</button>`}catch(e){PP.state(list,'error',e.message)}} function go(p){page=p;load()}
async function openInteraction(id){currentInteraction=id;PP.state(conversation,'loading','加载会话…');try{const d=await PP.get(`/api/interactions/${id}`);conversation.innerHTML=`<div class="conversation-head"><div><h3>${PP.escape(id)}</h3><small>${PP.escape(d.interaction.customer_id)} · ${PP.escape(d.interaction.agent_id)}</small></div><button class="btn" onclick="review('interactions','${PP.escape(id)}')">提交审核</button></div><div class="segment-tabs">${d.segments.map(s=>`<button onclick="openSegment('${PP.escape(s.segment_id)}')"><b>${PP.escape(s.channel)}</b><span>${PP.time(s.start_time)}</span><small>${PP.escape(s.subject)}</small></button>`).join('')}</div><div id="messages" class="messages empty">选择一次完整会话</div>`}catch(e){PP.state(conversation,'error',e.message)}}
async function openSegment(id){currentSegment=id;const box=document.querySelector('#messages');PP.state(box,'loading','加载发言…');try{const d=await PP.get(`/api/segments/${id}`);box.innerHTML=`<div class="conversation-head"><h3>${PP.escape(d.segment.subject)}</h3><button class="btn" onclick="review('segments','${PP.escape(id)}')">提交会话审核</button></div>${d.messages.map(m=>`<article class="chat-bubble ${m.sender_type==='USER'?'user':'agent'}"><button class="message-meta" onclick="openMessage('${PP.escape(m.message_id)}')">${PP.escape(m.sender_type)} · ${PP.time(m.sent_time)}</button><div>${PP.escape(m.message_text)}</div>${m.email?`<small>EMAIL · ${PP.escape(m.email.subject)}</small>`:''}</article>`).join('')}`;box.scrollTop=box.scrollHeight}catch(e){PP.state(box,'error',e.message)}}
async function openMessage(id){messageDialog.showModal();try{const d=await PP.get(`/api/messages/${id}`);document.querySelector('#messageDetail').innerHTML=`${kv(d.message)}<h3>Email</h3>${kv(d.email||{})}<h3>附件</h3>${d.attachments.map(kv).join('')||'<p>无附件</p>'}<button class="btn primary" onclick="review('messages','${PP.escape(id)}')">提交消息审核</button>`}catch(e){PP.state(document.querySelector('#messageDetail'),'error',e.message)}}
async function review(kind,id){const reason=prompt('请输入提交人工审核原因');if(!reason)return;try{const r=await PP.post(`/api/${kind}/${id}/submit-review`,{reason,note:'由客服交互监控提交',category:'COMMUNICATION',priority:'HIGH',operator:'web-operator'});alert(r.created?`已创建案件 ${r.case_id}`:`已有待审案件 ${r.case_id}`)}catch(e){alert(e.message)}}
form.onsubmit=e=>{e.preventDefault();page=1;load()};document.querySelector('#reset').onclick=()=>{form.reset();page=1;load()};load();
</script>{% endblock %}
