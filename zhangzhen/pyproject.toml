[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bank-risk"
version = "0.1.0"
description = "教学用银行业智能风控系统"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiomysql==0.2.0",
    "cryptography==44.0.0",
    "fastapi==0.115.6",
    "gunicorn==23.0.0",
    "jinja2==3.1.4",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "pymysql==1.1.1",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.18",
    "sqlalchemy==2.0.36",
    "ulid-py==1.1.0",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
ml = [
    "numpy==2.2.0",
    "pandas==2.2.3",
    "scikit-learn==1.5.1",
    "xgboost==2.0.3",
]
agent = [
    "deepagents==0.5.2",
    "langchain==1.2.15",
    "langchain-openai==1.1.12",
    "langgraph==1.1.6",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20,<1",
    "httpx==0.28.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

