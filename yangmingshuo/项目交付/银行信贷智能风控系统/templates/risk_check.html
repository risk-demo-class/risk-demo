{% extends 'base.html' %}{% block title %}实时风险检查{% endblock %}{% block content %}<div class="panel" style="max-width:720px"><form id="f"><label>业务事件</label><select name="event_type"><option>贷款申请</option><option>转账</option><option>登录</option><option>信用卡申请</option></select><label>业务流水号</label><input name="source_id" placeholder="例如 L0001"><label>客户号（信用卡申请必填）</label><input name="user_id" placeholder="例如 U0001"><button class="btn">运行风险检查</button></form><pre id="out" style="white-space:pre-wrap;background:#071c33;color:#d8ecff;padding:18px;border-radius:8px;min-height:100px">等待提交...</pre></div><script>f.onsubmit=async(e)=>{e.preventDefault();out.textContent='计算特征并执行规则...';let r=await fetch('/api/risk-check',{method:'POST',body:new FormData(f)});out.textContent=JSON.stringify(await r.json(),null,2)}</script>{% endblock %}
