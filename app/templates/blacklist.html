{% extends "base.html" %}
{% block title %}黑名单管理 - 教育风控中心{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4"><div><h4 class="mb-1">教育风控黑名单管理</h4><p class="text-muted small mb-0">仅维护学员账号、学号或证件哈希、设备指纹等脱敏风险标识。</p></div><button id="showCreateForm" class="btn btn-primary btn-sm"><i class="bi bi-plus-circle"></i> 新增黑名单</button></div>
<div id="createPanel" class="card stat-card p-3 mb-4" hidden><form id="createBlacklistForm" class="row g-3"><div class="col-md-3"><label class="form-label" for="blacklistType">类型</label><select id="blacklistType" class="form-select"><option value="用户">学员账号</option><option value="证件哈希">学号或证件哈希</option><option value="设备哈希">设备指纹</option></select></div><div class="col-md-4"><label class="form-label" for="blacklistValue">脱敏值或哈希</label><input id="blacklistValue" class="form-control" maxlength="128" required></div><div class="col-md-4"><label class="form-label" for="blacklistReason">风险原因</label><input id="blacklistReason" class="form-control" maxlength="500"></div><div class="col-md-1 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">保存</button></div></form><p id="createError" class="text-danger small mt-2 mb-0" hidden></p></div>
<div class="d-flex gap-2 align-items-center mb-3"><label class="small text-muted" for="filterType">类型</label><select id="filterType" class="form-select form-select-sm w-auto"><option value="">全部</option><option value="用户">学员账号</option><option value="证件哈希">学号或证件哈希</option><option value="设备哈希">设备指纹</option></select><span id="listCount" class="text-muted small"></span></div>
<div class="card stat-card p-3"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>ID</th><th>类型</th><th>脱敏值或哈希</th><th>风险原因</th><th>操作</th></tr></thead><tbody id="blacklistTableBody"><tr><td colspan="5" class="text-center text-muted py-4">加载中...</td></tr></tbody></table></div></div>
{% endblock %}
{% block extra_js %}
<script>
const blacklistTableBody = document.getElementById('blacklistTableBody');
const createPanel = document.getElementById('createPanel');
const createError = document.getElementById('createError');
function cell(value) { const node = document.createElement('td'); node.textContent = value || '-'; return node; }
function typeLabel(value) { return {'用户': '学员账号', '证件哈希': '学号或证件哈希', '设备哈希': '设备指纹'}[value] || value; }
async function loadBlacklist() { const params = new URLSearchParams({page: '1', page_size: '20'}); const selected = document.getElementById('filterType').value; if (selected) params.set('blacklist_type', selected); try { const response = await fetch('/api/blacklist?' + params); const data = await response.json(); if (!response.ok) throw new Error(data.detail || '黑名单加载失败'); document.getElementById('listCount').textContent = `共 ${data.total} 条`; blacklistTableBody.replaceChildren(); if (!data.items.length) { const row = document.createElement('tr'); const empty = cell('暂无黑名单记录'); empty.colSpan = 5; empty.className = 'text-center text-muted py-4'; row.append(empty); blacklistTableBody.append(row); return; } data.items.forEach(item => { const row = document.createElement('tr'); const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'btn btn-outline-danger btn-sm'; remove.textContent = '移除'; remove.addEventListener('click', () => removeBlacklist(item.blacklist_id)); const action = document.createElement('td'); action.append(remove); row.append(cell(item.blacklist_id), cell(typeLabel(item.blacklist_type)), cell(item.blacklist_value), cell(item.reason), action); blacklistTableBody.append(row); }); } catch (error) { blacklistTableBody.replaceChildren(); const row = document.createElement('tr'); const message = cell(error.message || '黑名单加载失败'); message.colSpan = 5; message.className = 'text-center text-danger py-4'; row.append(message); blacklistTableBody.append(row); } }
async function removeBlacklist(id) { if (!window.confirm('确定移除此黑名单记录吗？')) return; const response = await fetch('/api/blacklist/' + id, {method: 'DELETE'}); if (!response.ok) { const data = await response.json(); window.alert(data.detail || '移除失败'); return; } loadBlacklist(); }
document.getElementById('showCreateForm').addEventListener('click', () => { createPanel.hidden = !createPanel.hidden; });
document.getElementById('filterType').addEventListener('change', loadBlacklist);
document.getElementById('createBlacklistForm').addEventListener('submit', async (event) => { event.preventDefault(); createError.hidden = true; const response = await fetch('/api/blacklist', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({blacklist_type: document.getElementById('blacklistType').value, blacklist_value: document.getElementById('blacklistValue').value.trim(), reason: document.getElementById('blacklistReason').value.trim() || null})}); if (!response.ok) { const data = await response.json(); createError.textContent = data.detail || '新增失败'; createError.hidden = false; return; } event.target.reset(); createPanel.hidden = true; loadBlacklist(); });
loadBlacklist();
</script>
{% endblock %}
