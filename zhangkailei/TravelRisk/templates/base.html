<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}旅游风控中心{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --travel-blue-950: #073763;
            --travel-blue-900: #074f9d;
            --travel-blue-800: #0868c9;
            --travel-blue-700: #0b7de3;
            --travel-blue-600: #168ff0;
            --travel-blue-100: #dbeeff;
            --travel-blue-50: #f0f8ff;
            --travel-ink: #15324b;
        }
        /* 左侧固定、右侧独立滚动的旅游蓝工作台 */
        html, body { height: 100%; margin: 0; }
        body {
            color: var(--travel-ink);
            background: linear-gradient(145deg, #edf7ff 0%, #f8fbff 56%, #e8f3ff 100%);
            overflow: hidden;
        }
        /* 去掉 Bootstrap 默认 gutter, 让 main-content 精确占右侧 */
        .container-fluid, .row { padding: 0 !important; margin: 0 !important; }
        /* 左侧 sidebar 绝对定位, 不参与文档流 */
        .sidebar {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 16.66667%;   /* 等同 col-md-2 = 2/12 */
            background: linear-gradient(180deg, var(--travel-blue-950) 0%, var(--travel-blue-900) 48%, var(--travel-blue-800) 100%);
            overflow-y: auto;   /* 侧边栏内容多时自己滚 */
            z-index: 1000;
            box-shadow: 8px 0 28px rgba(7, 79, 157, 0.18);
        }
        .sidebar::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: -90px;
            bottom: -60px;
            border-radius: 50%;
            background: rgba(74, 180, 255, 0.16);
            pointer-events: none;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.76);
            padding: 12px 18px;
            border-radius: 10px;
            margin: 4px 12px;
            transition: transform .18s ease, background .18s ease, color .18s ease;
        }
        .sidebar .nav-link:hover {
            color: #fff;
            background: rgba(255,255,255,.12);
            transform: translateX(3px);
        }
        .sidebar .nav-link.active {
            color: var(--travel-blue-950);
            background: #fff;
            box-shadow: 0 8px 20px rgba(3, 39, 79, .22);
            font-weight: 600;
        }
        .sidebar .nav-link i { margin-right: 10px; width: 20px; text-align: center; }
        .sidebar-brand {
            color: #fff;
            padding: 22px 18px;
            border-bottom: 1px solid rgba(255,255,255,.16);
            display: flex;
            align-items: center;
            gap: 11px;
        }
        .sidebar-brand .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,.16);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.2);
            font-size: 20px;
            flex: 0 0 auto;
        }
        .sidebar-brand .brand-title { font-size: 17px; font-weight: 700; white-space: nowrap; }
        .sidebar-brand .brand-subtitle { font-size: 9px; opacity: .66; letter-spacing: 1.3px; white-space: nowrap; }
        /* 主内容区: 显式 margin-left 16.66667% 避开 fixed sidebar (否则被盖住) */
        .main-content {
            margin-left: 16.66667%;   /* 等同 col-md-2 = 2/12, 跟 sidebar 宽度对齐 */
            height: 100vh;
            overflow-y: auto;  /* ← 关键: 只有这里上下滚 */
            padding: 26px;
        }
        .main-content h4 { color: var(--travel-blue-950); font-weight: 700; }
        .main-content h4::after {
            content: "";
            display: block;
            width: 42px;
            height: 3px;
            margin-top: 9px;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--travel-blue-700), #65c7ff);
        }
        /* 【P4-L4 2026-08-08 修复】分页栏粘在 main-content 底部, 滚动时一直可见.
         * 之前问题: .main-content { height: 100vh; overflow-y: auto } 把分页栏推到
         * 滚动到底才看得到, 用户没滚到底就以为没分页. 现在 sticky 固定在底部. */
        /* 【P4-L4 第二轮 2026-08-08】紧凑版: min-height 60→38, padding 减半, 单字符按钮 */
        .pagination-bottom {
            position: sticky;
            bottom: 0;
            background: #ffffff;
            padding: 6px 12px;
            margin: 12px 0 0 0;
            border-top: 1px solid var(--travel-blue-100);
            box-shadow: 0 -5px 18px rgba(8, 104, 201, 0.08);
            z-index: 100;
            min-height: 38px;
        }
        /* 显式分页按钮样式, 防 Bootstrap reset 覆盖导致文字看不见 */
        .pagination-bottom .pagination {
            margin: 0;
            display: flex;
            list-style: none;
            gap: 3px;
            justify-content: center;
            align-items: center;
        }
        .pagination-bottom .page-item .page-link {
            color: var(--travel-blue-800);
            background: #ffffff;
            border: 1px solid #dee2e6;
            padding: 4px 10px;
            font-size: 13px;
            line-height: 1.4;
            min-width: 32px;
            height: 28px;
            text-align: center;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .pagination-bottom .page-item.active .page-link {
            color: #ffffff;
            background: var(--travel-blue-700);
            border-color: var(--travel-blue-700);
            font-weight: 600;
        }
        .pagination-bottom .page-item.disabled .page-link {
            color: #adb5bd;
            background: #f8f9fa;
            cursor: not-allowed;
        }
        .pagination-bottom .page-item .page-link:hover:not(.disabled) {
            background: #e7f1ff;
            border-color: var(--travel-blue-700);
        }
        .stat-card {
            border: 1px solid rgba(22, 143, 240, .10);
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(7, 79, 157, .08);
        }
        .card { border-color: rgba(22, 143, 240, .12); box-shadow: 0 6px 20px rgba(7, 79, 157, .06); }
        .table thead th { background: var(--travel-blue-50); color: var(--travel-blue-950); border-bottom-color: var(--travel-blue-100); }
        .btn-primary, .bg-primary {
            background-color: var(--travel-blue-700) !important;
            border-color: var(--travel-blue-700) !important;
        }
        .btn-primary:hover { background-color: var(--travel-blue-900) !important; border-color: var(--travel-blue-900) !important; }
        .form-control:focus, .form-select:focus {
            border-color: #59b7f5;
            box-shadow: 0 0 0 .2rem rgba(22, 143, 240, .16);
        }
        .stat-card .stat-value { font-size: 28px; font-weight: 700; }
        .badge-risk-low { background: #dcfce7; color: #166534; }
        .badge-risk-mid { background: #fef9c3; color: #854d0e; }
        .badge-risk-high { background: #fed7aa; color: #9a3412; }
        .badge-risk-critical { background: #fecaca; color: #991b1b; }
        .chat-messages { height: calc(100vh - 320px); min-height: 300px; max-height: calc(100vh - 160px); overflow-y: auto; }
        .chat-bubble { max-width: 80%; padding: 10px 14px; border-radius: 12px; margin-bottom: 8px; }
        .chat-bubble.user { background: #3b82f6; color: #fff; margin-left: auto; }
        .chat-bubble.ai { background: #f1f5f9; color: #1e293b; }
        /* 红色粗线条关闭按钮 */
        .btn-close-risk {
            background: transparent;
            border: 2px solid #dc2626;
            border-radius: 6px;
            color: #dc2626;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 900;
            line-height: 1;
            padding: 0;
            transition: all 0.15s ease;
        }
        .btn-close-risk:hover {
            background: #dc2626;
            color: #fff;
        }
        .btn-close-risk:focus {
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.25);
            outline: none;
        }
        /* 响应式: 窄屏 (md 以下) 恢复 Bootstrap 默认流式布局 (横排) */
        @media (max-width: 767.98px) {
            body { overflow: auto; }
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                overflow-y: visible;
            }
            .main-content {
                margin-left: 0;
                height: auto;
                overflow-y: visible;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- 侧边栏 -->
        <div class="col-md-2 sidebar px-0">
            <div class="sidebar-brand">
                <span class="brand-icon"><i class="bi bi-airplane-engines"></i></span>
                <span>
                    <span class="brand-title d-block">旅游风控中心</span>
                    <span class="brand-subtitle d-block">TRAVEL RISK CENTER</span>
                </span>
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                    <i class="bi bi-speedometer2"></i> 仪表盘
                </a>
                <a class="nav-link {% if request.url.path == '/rules' %}active{% endif %}" href="/rules">
                    <i class="bi bi-list-check"></i> 规则管理
                </a>
                <a class="nav-link {% if request.url.path == '/cases' %}active{% endif %}" href="/cases">
                    <i class="bi bi-folder2-open"></i> 案件管理
                </a>
                <a class="nav-link {% if request.url.path == '/assessments' %}active{% endif %}" href="/assessments">
                    <i class="bi bi-clipboard-data"></i> 评估历史
                </a>
                <a class="nav-link {% if request.url.path == '/risk-check' %}active{% endif %}" href="/risk-check">
                    <i class="bi bi-search"></i> 风险检查
                </a>
                <a class="nav-link {% if request.url.path == '/chat' %}active{% endif %}" href="/chat">
                    <i class="bi bi-robot"></i> AI 助手
                </a>
                <a class="nav-link {% if request.url.path == '/blacklist' %}active{% endif %}" href="/blacklist">
                    <i class="bi bi-shield-x"></i> 黑名单
                </a>
            </nav>
        </div>
        <!-- 主内容区 -->
        <div class="col-md-10 main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<!-- 改版加 ?v=YYYYMMDD[vN] 破 FastAPI StaticFiles 强缓存 (max-age=1y), 否则浏览器永远用旧版 -->

<script src="/static/app.js?v=20260811-blue"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
