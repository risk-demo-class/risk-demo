{% extends "base.html" %}
{% block content %}<section class="panel"><div class="panel-head"><div><p class="eyebrow">AUDIT TRAIL</p><h3>风险评估历史</h3></div><div class="inline-search"><input id="patient-filter" placeholder="患者ID，如 PAT000001"><button class="button ghost" id="search">查询</button></div></div><div class="table-wrap"><table><thead><tr><th>评估与患者</th><th>事件</th><th>最终评分</th><th>风险等级</th><th>决策</th><th>模型概率</th><th>时间</th></tr></thead><tbody id="assessment-rows"><tr><td colspan="7" class="loading">加载中…</td></tr></tbody></table></div></section><dialog id="assessment-dialog" class="assessment-dialog"><div class="panel-head"><div><p class="eyebrow">ASSESSMENT EVIDENCE</p><h3>评估详情</h3></div><button class="icon-button" onclick="q('#assessment-dialog').close()">×</button></div><div id="assessment-detail" class="loading">加载中…</div></dialog>{% endblock %}
{% block scripts %}<script>
const queryParams=new URLSearchParams(location.search);if(queryParams.get('patient_id'))q('#patient-filter').value=queryParams.get('patient_id');async function loadAssessments(){const p=q('#patient-filter').value.trim(),high=queryParams.get('high_risk')==='1';const rows=await api(`/api/assessments?page_size=100${p?'&patient_id='+encodeURIComponent(p):''}${high?'&high_risk=true':''}`);q('#assessment-rows').innerHTML=rows.length?rows.map(x=>`<tr class="clickable-row" onclick="showAssessment('${x.assessment_id}')"><td><b>${x.assessment_id}</b><small>${x.patient_id}</small></td><td>${x.event_type}</td><td><strong>${x.final_score}</strong><small>${x.rule_count} 条规则</small></td><td><span class="badge ${levelClass(x.risk_level)}">${x.risk_level}</span></td><td>${x.decision}</td><td>${x.ml_score===null?'纯规则':(x.ml_score*100).toFixed(1)+'%'}</td><td>${dateTime(x.create_time)}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">没有符合条件的评估</td></tr>';}async function showAssessment(id){q('#assessment-dialog').showModal();const box=q('#assessment-detail');box.innerHTML='<div class="loading">正在读取完整证据链…</div>';try{const x=await api(`/api/assessments/${id}`);const rules=x.triggered_rules.length?x.triggered_rules.map(r=>`<div><b>${r.rule_id} · ${r.rule_name}</b><span class="badge ${levelClass(r.risk_level)}">${r.risk_level}</span><p>${r.description||r.rule_category}</p></div>`).join(''):'<p class="muted">未命中规则</p>';box.innerHTML=`<div class="decision ${decisionClass(x.decision)}"><div><p>${x.event.event_type} · ${x.event.source_id}</p><h2>${x.decision}</h2></div><strong>${x.final_score}<small>/100</small></strong></div><div class="detail-meta"><div><span>患者</span><b>${x.patient_id}</b></div><div><span>模型概率</span><b>${x.ml_score===null?'纯规则':(x.ml_score*100).toFixed(1)+'%'}</b></div><div><span>案件状态</span><b>${x.case?.case_status||'未建案'}</b></div></div><h4>命中规则</h4><div class="rule-hits">${rules}</div><details><summary>查看 25 维特征证据</summary><pre>${JSON.stringify(x.features,null,2)}</pre></details>`;}catch(e){box.innerHTML=`<div class="error-box">${escapeHtml(e.message)}</div>`;}}q('#search').addEventListener('click',()=>loadAssessments().catch(showError));loadAssessments().catch(showError);
</script>{% endblock %}
