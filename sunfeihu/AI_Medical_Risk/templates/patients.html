{% extends "base.html" %}
{% block content %}<section class="panel"><div class="panel-head"><div><p class="eyebrow">PATIENT DIRECTORY</p><h3>患者列表</h3></div><div class="inline-search"><input id="patient-keyword" placeholder="患者ID或脱敏姓名"><button class="button ghost" id="patient-search">查询</button></div></div><div class="table-wrap"><table><thead><tr><th>患者</th><th>基础信息</th><th>参保省份</th><th>风险等级</th><th>风险评分</th><th>评估次数</th><th></th></tr></thead><tbody id="patient-rows"><tr><td colspan="7" class="loading">加载中…</td></tr></tbody></table></div></section>{% endblock %}
{% block scripts %}<script>
async function loadPatients(){const key=q('#patient-keyword').value.trim();const rows=await api(`/api/medical/patients?page_size=100${key?'&keyword='+encodeURIComponent(key):''}`);q('#patient-rows').innerHTML=rows.length?rows.map(x=>`<tr><td><b>${x.patient_id}</b><small>${x.name_masked}</small></td><td>${x.gender} · ${x.birth_year}年<small>${x.real_name_status}</small></td><td>${x.insured_province}</td><td><span class="badge ${levelClass(x.risk_level)}">${x.risk_level}</span></td><td><strong>${x.risk_score}</strong></td><td>${x.assessment_count}</td><td><a class="table-link" href="/assessments?patient_id=${x.patient_id}">查看评估</a></td></tr>`).join(''):'<tr><td colspan="7" class="empty">没有符合条件的患者</td></tr>';}q('#patient-search').addEventListener('click',()=>loadPatients().catch(showError));loadPatients().catch(showError);
</script>{% endblock %}
