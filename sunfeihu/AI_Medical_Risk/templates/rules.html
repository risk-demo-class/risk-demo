{% extends "base.html" %}
{% block content %}<section class="panel"><div class="panel-head"><div><p class="eyebrow">RULE ENGINE</p><h3>医疗规则库</h3></div><div class="panel-actions"><span class="tag">MR001–MR016</span>{% if session_user.role == 'admin' %}<button class="button primary" onclick="q('#rule-dialog').showModal()">新增规则</button>{% endif %}</div></div><div class="table-wrap"><table><thead><tr><th>规则</th><th>场景</th><th>等级</th><th>分值</th><th>动作</th><th>状态</th><th></th></tr></thead><tbody id="rule-rows"><tr><td colspan="7" class="loading">加载中…</td></tr></tbody></table></div></section>
{% if session_user.role == 'admin' %}<dialog id="rule-dialog" class="wide-dialog"><form id="rule-form" class="form-stack"><div class="panel-head"><div><p class="eyebrow">NEW RULE</p><h3>新增医疗规则</h3></div><button type="button" class="icon-button" onclick="q('#rule-dialog').close()">×</button></div><div class="form-grid"><label>规则 ID<input id="rule-id" required pattern="[A-Z][A-Z0-9_-]+" placeholder="例如 MR101"></label><label>规则名称<input id="rule-name" required></label><label>事件类型<select id="rule-event"><option>医保结算</option><option>处方开立</option><option>挂号申请</option><option>挂号退号</option><option>通用</option></select></label><label>规则分类<select id="rule-category"><option>医保结算异常</option><option>处方合规</option><option>挂号行为</option><option>通用</option></select></label><label>特征<input id="rule-feature" list="feature-list" required placeholder="选择 25 维特征"></label><label>运算符<select id="rule-op"><option>&gt;=</option><option>&gt;</option><option>&lt;=</option><option>&lt;</option><option>==</option><option>!=</option></select></label><label>阈值<input id="rule-value" type="number" step="any" required></label><label>风险等级<select id="rule-level"><option>中</option><option>高</option><option>极高</option><option>低</option></select></label><label>风险分<input id="rule-score" type="number" min="0" max="100" value="60" required></label><label>触发动作<select id="rule-action"><option>标记</option><option>人工审核</option><option>拒绝</option><option>通过</option></select></label></div><label>规则说明<textarea id="rule-description" rows="3"></textarea></label><button class="button primary">保存规则</button></form></dialog><datalist id="feature-list"><option value="patient_registration_count_7d"><option value="patient_cancel_count_30d"><option value="patient_cancel_rate_30d"><option value="patient_hospital_count_7d"><option value="patient_claim_count_24h"><option value="patient_claim_amount_30d"><option value="patient_cross_province_count_30d"><option value="patient_same_drug_count_30d"><option value="patient_device_count_30d"><option value="patient_account_age_days"><option value="event_total_amount"><option value="prescription_drug_count"><option value="prescription_total_quantity"><option value="prescription_max_days_supply"><option value="prescription_controlled_drug_count"><option value="prescription_high_value_ratio"><option value="claim_insurance_ratio"><option value="event_is_night"><option value="event_is_cross_province"><option value="doctor_prescription_count_1d"><option value="doctor_prescription_amount_1d"><option value="doctor_avg_prescription_amount_30d"><option value="hospital_claim_amount_1d"><option value="device_patient_count_7d"><option value="doctor_license_abnormal"></datalist>{% endif %}{% endblock %}
{% block scripts %}<script>
const canManage={{ (session_user.role == 'admin')|tojson }};async function loadRules(){const rows=await api('/api/rules');q('#rule-rows').innerHTML=rows.map(x=>`<tr><td><b>${x.rule_id}</b><small>${x.rule_name}</small></td><td>${x.event_type}<small>${x.rule_category}</small></td><td><span class="badge ${levelClass(x.risk_level)}">${x.risk_level}</span></td><td>${x.risk_score}</td><td>${x.action}</td><td>${x.runtime?'<span class="tag">运行时</span>':canManage?`<button class="switch ${x.is_enabled?'on':''}" onclick="toggleRule('${x.rule_id}')"><i></i>${x.is_enabled?'启用':'停用'}</button>`:(x.is_enabled?'启用':'停用')}</td><td>${canManage&&!x.runtime?`<button class="icon-button danger-icon" title="删除" onclick="deleteRule('${x.rule_id}')">×</button>`:''}</td></tr>`).join('');}async function toggleRule(id){try{await api(`/api/rules/${id}/toggle`,{method:'POST'});toast('规则状态已更新');loadRules();}catch(e){showError(e)}}async function deleteRule(id){if(!confirm(`确认删除规则 ${id}？该操作采用软删除并写入审计日志。`))return;try{await api(`/api/rules/${id}`,{method:'DELETE'});toast('规则已删除');loadRules();}catch(e){showError(e)}}if(canManage)q('#rule-form').addEventListener('submit',async e=>{e.preventDefault();const payload={rule_id:q('#rule-id').value.trim().toUpperCase(),rule_name:q('#rule-name').value.trim(),event_type:q('#rule-event').value,rule_category:q('#rule-category').value,condition:{feature:q('#rule-feature').value,op:q('#rule-op').value,value:Number(q('#rule-value').value)},risk_level:q('#rule-level').value,risk_score:Number(q('#rule-score').value),action:q('#rule-action').value,description:q('#rule-description').value.trim(),priority:0};try{await api('/api/rules',{method:'POST',body:JSON.stringify(payload)});q('#rule-dialog').close();e.target.reset();toast('规则已创建');loadRules();}catch(err){showError(err)}});loadRules().catch(showError);
if(canManage){
  const editDialog=document.createElement('dialog');editDialog.id='rule-edit-dialog';editDialog.className='wide-dialog';
  editDialog.innerHTML=`<form id="rule-edit-form" class="form-stack"><div class="panel-head"><div><p class="eyebrow">EDIT RULE</p><h3>修改医疗规则</h3></div><button type="button" class="icon-button" onclick="q('#rule-edit-dialog').close()">×</button></div><input id="edit-rule-id" type="hidden"><div class="form-grid"><label>规则名称<input id="edit-rule-name" required></label><label>事件类型<select id="edit-rule-event"><option>医保结算</option><option>处方开立</option><option>挂号申请</option><option>挂号退号</option><option>通用</option></select></label><label>规则分类<select id="edit-rule-category"><option>医保结算异常</option><option>处方合规</option><option>挂号行为</option><option>通用</option></select></label><label>特征<input id="edit-rule-feature" list="feature-list" required></label><label>运算符<select id="edit-rule-op"><option>&gt;=</option><option>&gt;</option><option>&lt;=</option><option>&lt;</option><option>==</option><option>!=</option></select></label><label>阈值<input id="edit-rule-value" type="number" step="any" required></label><label>风险等级<select id="edit-rule-level"><option>低</option><option>中</option><option>高</option><option>极高</option></select></label><label>风险分<input id="edit-rule-score" type="number" min="0" max="100" required></label><label>触发动作<select id="edit-rule-action"><option>通过</option><option>标记</option><option>人工审核</option><option>拒绝</option></select></label></div><label>规则说明<textarea id="edit-rule-description" rows="3"></textarea></label><button class="button primary">保存修改</button></form>`;document.body.appendChild(editDialog);
  const originalLoadRules=loadRules;loadRules=async function(){await originalLoadRules();document.querySelectorAll('#rule-rows tr').forEach((tr,index)=>{const row=tr.querySelector('td:last-child');const ruleId=tr.querySelector('td b')?.textContent;if(row&&ruleId&&ruleId!=='MR016'){const button=document.createElement('button');button.className='icon-button';button.title='修改';button.textContent='✎';button.onclick=()=>editRule(ruleId);row.prepend(button)}})};
  window.editRule=async function(id){const rows=await api('/api/rules'),x=rows.find(item=>item.rule_id===id);if(!x||x.runtime)return;q('#edit-rule-id').value=id;q('#edit-rule-name').value=x.rule_name;q('#edit-rule-event').value=x.event_type;q('#edit-rule-category').value=x.rule_category;q('#edit-rule-feature').value=x.condition.feature||'';q('#edit-rule-op').value=x.condition.op||'>=';q('#edit-rule-value').value=x.condition.value??'';q('#edit-rule-level').value=x.risk_level;q('#edit-rule-score').value=x.risk_score;q('#edit-rule-action').value=x.action;q('#edit-rule-description').value=x.description||'';editDialog.showModal()};
  q('#rule-edit-form').addEventListener('submit',async e=>{e.preventDefault();const id=q('#edit-rule-id').value,payload={rule_name:q('#edit-rule-name').value.trim(),event_type:q('#edit-rule-event').value,rule_category:q('#edit-rule-category').value,condition:{feature:q('#edit-rule-feature').value,op:q('#edit-rule-op').value,value:Number(q('#edit-rule-value').value)},risk_level:q('#edit-rule-level').value,risk_score:Number(q('#edit-rule-score').value),action:q('#edit-rule-action').value,description:q('#edit-rule-description').value.trim(),priority:0};try{await api(`/api/rules/${id}`,{method:'PUT',body:JSON.stringify(payload)});editDialog.close();toast('规则已修改');loadRules()}catch(err){showError(err)}});loadRules().catch(showError);
}
</script>{% endblock %}
