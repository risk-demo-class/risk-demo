{% extends "base.html" %}
{% block content %}<section class="grid two blacklist-grid"><article class="panel"><div class="panel-head"><div><p class="eyebrow">BLOCKED ENTITIES</p><h3>有效黑名单</h3></div></div><div id="blacklist-rows" class="blacklist-list loading">加载中…</div></article><article class="panel"><div class="panel-head"><div><p class="eyebrow">ADD ENTITY</p><h3>加入医疗黑名单</h3></div></div><form id="blacklist-form" class="form-stack"><label>主体类型<select id="blacklist-type"><option>PATIENT_ID</option><option>ID_CARD_HASH</option><option>INSURANCE_CARD_HASH</option><option>PHONE_HASH</option><option>DOCTOR_ID</option><option>DEVICE_ID_HASH</option><option>HOSPITAL_ID</option></select></label><label>主体标识<input id="blacklist-value" required placeholder="仅使用合成ID或不可逆摘要"></label><label>加入原因<textarea id="blacklist-reason" rows="4" placeholder="填写风险依据"></textarea></label><button class="button danger">加入黑名单</button><p class="help">命中后以 MR016 进入正常事件、特征、评估和案件审计链路。</p></form></article></section>{% endblock %}
{% block scripts %}<script>
async function loadBlacklist(){const rows=await api('/api/blacklist');q('#blacklist-rows').classList.remove('loading');q('#blacklist-rows').innerHTML=rows.length?rows.map(x=>`<div><span class="badge high">${x.blacklist_type}</span><b>${x.blacklist_value_masked}</b><p>${x.reason||'未填写原因'}</p><button class="icon-button" onclick="removeBlacklist(${x.blacklist_id})">×</button></div>`).join(''):'<div class="empty"><h3>当前无有效黑名单</h3></div>';} async function removeBlacklist(id){try{await api(`/api/blacklist/${id}`,{method:'DELETE'});toast('已从有效黑名单移除');loadBlacklist();}catch(e){showError(e)}} q('#blacklist-form').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/blacklist',{method:'POST',body:JSON.stringify({blacklist_type:q('#blacklist-type').value,blacklist_value:q('#blacklist-value').value.trim(),reason:q('#blacklist-reason').value.trim(),expire_time:null})});e.target.reset();toast('黑名单已保存');loadBlacklist();}catch(err){showError(err)}});loadBlacklist().catch(showError);
</script>{% endblock %}
