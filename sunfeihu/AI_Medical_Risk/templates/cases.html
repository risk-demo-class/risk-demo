{% extends "base.html" %}
{% block content %}<section class="panel"><div class="panel-head"><div><p class="eyebrow">CASE REVIEW</p><h3>风险案件队列</h3></div><select id="case-filter"><option value="">全部状态</option><option value="pending">待处理（待审核/审核中）</option><option>待审核</option><option>审核中</option><option>已通过</option><option>已拒绝</option><option>已关闭</option></select></div><div id="case-list" class="case-list loading">加载中…</div></section><dialog id="case-dialog"><form id="case-form" class="form-stack"><div class="panel-head"><h3 id="case-dialog-title">案件操作</h3><button type="button" class="icon-button" onclick="q('#case-dialog').close()">×</button></div><input id="case-id" type="hidden"><input id="case-mode" type="hidden"><label id="status-field">审核结论<select id="case-status"><option>已通过</option><option>已拒绝</option><option>已关闭</option></select></label><label>审核人<input id="reviewer" value="{{ session_user.username }}" required></label><label>意见或原因<textarea id="case-comment" rows="4" required placeholder="填写可审计的处理依据"></textarea></label><button class="button primary">提交</button></form></dialog>{% endblock %}
{% block scripts %}<script>
const canReview={{ (session_user.role in ['admin','reviewer'])|tojson }};const params=new URLSearchParams(location.search);if(params.get('status'))q('#case-filter').value=params.get('status');async function loadCases(){const status=q('#case-filter').value;const rows=await api(`/api/cases?page_size=100${status?'&status='+encodeURIComponent(status):''}`);q('#case-list').classList.remove('loading');q('#case-list').innerHTML=rows.length?rows.map(x=>`<article><div><span class="badge ${decisionClass(x.case_status)}">${x.case_status}</span><h3>${x.case_id}</h3><p>${x.event_type||'医疗事件'} · ${x.source_id||'—'} · ${x.user_id}${x.reviewer?' · 审核人 '+x.reviewer:''}</p></div><div class="row-actions">${canReview&&['待审核','审核中'].includes(x.case_status)?`<button class="button ghost" onclick="openCase('${x.case_id}','assign')">指定审核</button><button class="button primary" onclick="openCase('${x.case_id}','review')">提交结论</button>`:''}${canReview&&['已通过','已拒绝','已关闭'].includes(x.case_status)?`<button class="button ghost" onclick="openCase('${x.case_id}','reopen')">重新审核</button>`:''}</div></article>`).join(''):'<div class="empty"><h3>暂无案件</h3></div>';}function openCase(id,mode){q('#case-id').value=id;q('#case-mode').value=mode;q('#status-field').style.display=mode==='review'?'grid':'none';q('#case-dialog-title').textContent=({assign:'指定人工审核',review:'提交审核结论',reopen:'重新发起审核'})[mode];q('#case-comment').placeholder=mode==='reopen'?'填写重新审核原因':'填写处理意见';q('#case-dialog').showModal();}q('#case-filter').addEventListener('change',()=>loadCases().catch(showError));q('#case-form').addEventListener('submit',async e=>{e.preventDefault();const id=q('#case-id').value,mode=q('#case-mode').value,reviewer=q('#reviewer').value,comment=q('#case-comment').value;let path,body;if(mode==='review'){path=`/api/cases/${id}/review`;body={case_status:q('#case-status').value,reviewer,review_comment:comment};}else if(mode==='assign'){path=`/api/cases/${id}/assign`;body={reviewer,comment};}else{path=`/api/cases/${id}/reopen`;body={reviewer,reason:comment};}try{await api(path,{method:'POST',body:JSON.stringify(body)});q('#case-dialog').close();toast('案件状态已更新');loadCases();}catch(err){showError(err)}});loadCases().catch(showError);
</script>{% endblock %}
