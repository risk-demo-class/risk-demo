{% extends "base.html" %}
{% block content %}
<section class="grid two system-grid"><article class="panel"><div class="panel-head"><div><p class="eyebrow">ACTIVE ALERTS</p><h3>聚合风险告警</h3></div><span class="tag">定时检查</span></div><div id="alert-list" class="alert-list loading">加载中…</div></article><article class="panel"><div class="panel-head"><div><p class="eyebrow">AUDIT LOG</p><h3>操作审计日志</h3></div></div><div id="log-list" class="log-list loading">加载中…</div></article></section>
{% endblock %}
{% block scripts %}<script>
async function loadSystem(){const [alerts,logs]=await Promise.all([api('/api/alerts?page_size=50'),api('/api/action-logs?page_size=50')]);q('#alert-list').classList.remove('loading');q('#alert-list').innerHTML=alerts.length?alerts.map(x=>`<article><div><span class="badge ${x.alert_level==='P0'||x.alert_level==='P1'?'critical':'high'}">${x.alert_level}</span><b>${x.alert_title}</b><p>${x.alert_content||''}</p><small>${x.status} · ${dateTime(x.create_time)}</small></div>${['PENDING','HANDLING'].includes(x.status)?`<button class="button ghost" onclick="resolveAlert(${x.alert_id})">处理</button>`:''}</article>`).join(''):'<div class="empty"><h3>暂无告警</h3><p>可运行告警检查脚本生成聚合告警。</p></div>';q('#log-list').classList.remove('loading');q('#log-list').innerHTML=logs.length?logs.map(x=>`<div><i></i><b>${x.action_type}</b><span>${x.operator} · ${x.target_type}/${x.target_id}</span><p>${x.remark||''} · ${dateTime(x.create_time)}</p></div>`).join(''):'<div class="empty"><h3>暂无变更日志</h3></div>';}
async function resolveAlert(id){try{await api(`/api/alerts/${id}/resolve`,{method:'POST',body:JSON.stringify({status:'RESOLVED',handler:'local-reviewer'})});toast('告警已处理');loadSystem();}catch(e){showError(e)}}loadSystem().catch(showError);
</script>{% endblock %}
