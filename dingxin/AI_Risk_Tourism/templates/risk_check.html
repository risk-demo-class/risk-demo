{% extends "base.html" %}
{% block title %}风险检查 - 旅游风控系统{% endblock %}
{% block content %}
<h4 class="mb-4">风险检查</h4>

<style>
.autocomplete-dropdown {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 1050;
    background: #fff; border: 1px solid #ddd; border-radius: 6px;
    max-height: 240px; overflow-y: auto; display: none;
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
}
.autocomplete-dropdown .ac-item {
    padding: 8px 12px; cursor: pointer; font-size: 14px;
    border-bottom: 1px solid #f1f1f1;
}
.autocomplete-dropdown .ac-item.ac-active { background: #e7f1ff; }
.autocomplete-dropdown .ac-item small { color: #888; }
.autocomplete-dropdown .ac-empty { padding: 8px 12px; color: #999; font-size: 13px; }
</style>

<div class="row">
    <!-- 左侧: 检查表单 -->
    <div class="col-md-5">
        <div class="card stat-card p-4">
            <h6>发起风控检查</h6>
            <form id="checkForm">
                <div class="mb-3">
                    <label class="form-label"><span class="text-danger">*</span> 事件类型</label>
                    <select class="form-select" id="ck_event_type" required onchange="onEventTypeChange()">
                        <option value="预订下单">预订下单</option>
                        <option value="支付">支付</option>
                        <option value="退改申请">退改申请</option>
                        <option value="签证申请">签证申请</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label"><span class="text-danger">*</span> 用户ID / 姓名</label>
                    <div class="autocomplete-wrap position-relative">
                        <input type="text" class="form-control" id="ck_user_id"
                               placeholder="如: U1001 / 张三" autocomplete="off" required>
                        <div class="autocomplete-dropdown" id="ck_user_id_dd"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label"><span class="text-danger">*</span> 业务ID (订单号/退改单ID/签证ID)</label>
                    <div class="autocomplete-wrap position-relative">
                        <input type="text" class="form-control" id="ck_source_id"
                               placeholder="如: ORD_T001 / RFD_001 / VISA_001" autocomplete="off" required>
                        <div class="autocomplete-dropdown" id="ck_source_id_dd"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">订单ID (可选, 预订下单/支付时自动填充)</label>
                    <input type="text" class="form-control" id="ck_order_id">
                </div>
                <button type="submit" class="btn btn-primary w-100" id="checkBtn">
                    <i class="bi bi-search"></i> 执行检查
                </button>
            </form>
        </div>
    </div>

    <!-- 右侧: 检查结果 -->
    <div class="col-md-7">
        <div class="card stat-card p-4" id="resultPanel" style="display:none;">
            <h6>检查结果</h6>
            <div id="resultContent"></div>
        </div>
        <div class="card stat-card p-4" id="emptyPanel">
            <div class="text-center text-muted py-5">
                <i class="bi bi-shield-check" style="font-size:48px;"></i>
                <p class="mt-3">请在左侧填写信息并发起风控检查</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function riskBadge(level) {
    const cls = {'低':'badge-risk-low','中':'badge-risk-mid','高':'badge-risk-high','极高':'badge-risk-critical'}[level] || 'bg-secondary';
    return `<span class="badge ${cls}">${level}</span>`;
}

function decisionBadge(d) {
    const cls = {'通过':'bg-success','标记':'bg-info','人工审核':'bg-warning','拒绝':'bg-danger'}[d] || 'bg-secondary';
    return `<span class="badge ${cls}">${d}</span>`;
}

// 接收从案件列表跳过来的预填数据 (重做检查功能)
(function prefillFromCase() {
    const raw = sessionStorage.getItem('risk_check_prefill');
    if (!raw) return;
    try {
        const data = JSON.parse(raw);
        const setVal = (id, v) => { const el = document.getElementById(id); if (el && v) el.value = v; };
        setVal('ck_event_type', data.event_type);
        setVal('ck_user_id', data.user_id);
        setVal('ck_source_id', data.source_id);
        // 顶部加个提示横幅
        const form = document.getElementById('checkForm');
        if (form && data.case_id) {
            const banner = document.createElement('div');
            banner.className = 'alert alert-info py-2 mb-3';
            banner.innerHTML = `<i class="bi bi-info-circle"></i> 来自案件 <code>${data.case_id}</code> 的重做检查, 已自动填充业务参数`;
            form.parentNode.insertBefore(banner, form);
        }
    } catch (e) {
        console.warn('预填数据解析失败:', e);
    } finally {
        sessionStorage.removeItem('risk_check_prefill');
    }
})();

// ============================================================
// 联想搜索: 用户ID + 业务ID (防抖 / 键盘 / 点击外部关闭 / 中文输入法)
// ============================================================
function initAutocomplete(inputId, ddId, fetcher, onSelect) {
    const input = document.getElementById(inputId);
    const dd = document.getElementById(ddId);
    let timer = null;
    let items = [];
    let active = -1;
    let composing = false;

    function hide() {
        dd.style.display = 'none';
        items = [];
        active = -1;
    }

    function render(list) {
        dd.innerHTML = '';
        if (!list || list.length === 0) {
            dd.innerHTML = '<div class="ac-empty">未找到匹配项</div>';
            items = [];
            active = -1;
        } else {
            items = list;
            active = 0;  // 默认高亮第一项: 视觉高亮与键盘状态保持一致, 回车直接选中
            list.forEach((it, i) => {
                const div = document.createElement('div');
                div.className = 'ac-item' + (i === 0 ? ' ac-active' : '');
                div.innerHTML = it.html || it.label;
                div.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    onSelect(it);
                    hide();
                });
                div.addEventListener('mouseenter', () => {
                    dd.querySelectorAll('.ac-item').forEach((el, j) => el.classList.toggle('ac-active', j === i));
                    active = i;
                });
                dd.appendChild(div);
            });
        }
        dd.style.display = 'block';
    }

    async function search(v) {
        try {
            const list = await fetcher(v);
            render(list);
            return list;
        } catch (e) {
            hide();  // 请求失败静默降级为普通输入
            return null;
        }
    }

    input.addEventListener('compositionstart', () => { composing = true; });
    input.addEventListener('compositionend', () => { composing = false; });

    input.addEventListener('input', () => {
        const v = input.value.trim();
        clearTimeout(timer);
        if (!v || composing) {
            hide();
            return;
        }
        timer = setTimeout(() => { timer = null; search(v); }, 300);
    });

    input.addEventListener('keydown', (e) => {
        if (composing) return;  // 中文输入法组合期间, 回车由输入法接管
        // 防抖等待期按回车: 下拉还没出现, 立即搜索并自动选中第一条, 防止误提交
        if (e.key === 'Enter' && dd.style.display === 'none' && timer !== null) {
            e.preventDefault();
            const v = input.value.trim();
            clearTimeout(timer);
            timer = null;
            if (!v) return;
            search(v).then((list) => {
                if (list && list.length > 0) onSelect(list[0]);
                hide();
            });
            return;
        }
        if (dd.style.display === 'none') return;
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            active = Math.min(active + 1, items.length - 1);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            active = Math.max(active - 1, 0);
        } else if (e.key === 'Enter') {
            // 下拉打开时回车一律拦截, 防止误触发表单提交
            e.preventDefault();
            if (items.length > 0) {
                const idx = (active >= 0 && active < items.length) ? active : 0;
                onSelect(items[idx]);
                hide();
            } else {
                // 无匹配项: 收起下拉, 再按一次回车才提交
                hide();
            }
        } else if (e.key === 'Escape') {
            e.preventDefault();
            hide();
        } else {
            return;
        }
        dd.querySelectorAll('.ac-item').forEach((el, i) => el.classList.toggle('ac-active', i === active));
    });

    document.addEventListener('mousedown', (e) => {
        if (!input.contains(e.target) && !dd.contains(e.target)) hide();
    });

    return {hide};
}

// 用户ID联想: user_id 前缀 / 姓名包含, 展示 姓名+实名+VIP 标签
initAutocomplete('ck_user_id', 'ck_user_id_dd', async (q) => {
    const res = await fetch('/api/suggest/users?q=' + encodeURIComponent(q) + '&limit=10');
    const data = await res.json();
    return (data.items || []).map(it => ({
        label: it.user_id,
        html: `<strong>${it.user_id}</strong> ${it.name || ''} ` +
              `<small>${it.real_name_status ? '已实名' : '未实名'} · VIP${it.vip_level}</small>`,
        user_id: it.user_id,
    }));
}, (item) => {
    document.getElementById('ck_user_id').value = item.user_id;
});

// 业务ID联想: 数据源随事件类型切换, 有用户ID时只联想该用户的
function bizType() {
    const et = document.getElementById('ck_event_type').value;
    return {'预订下单': 'order', '支付': 'order', '退改申请': 'refund', '签证申请': 'visa'}[et] || 'order';
}

function bizPlaceholder() {
    const et = document.getElementById('ck_event_type').value;
    return {'预订下单': '如: ORD_T001', '支付': '如: ORD_T001', '退改申请': '如: RFD_001', '签证申请': '如: VISA_001'}[et] || '输入业务ID';
}

function onEventTypeChange() {
    // 事件类型变了, 旧业务ID/订单ID语义失效 → 清空并切换联想源与占位文案
    document.getElementById('ck_source_id').value = '';
    document.getElementById('ck_order_id').value = '';
    document.getElementById('ck_source_id').placeholder = bizPlaceholder();
    document.getElementById('ck_source_id_dd').style.display = 'none';
}

initAutocomplete('ck_source_id', 'ck_source_id_dd', async (q) => {
    const uid = document.getElementById('ck_user_id').value.trim();
    const params = new URLSearchParams({type: bizType(), q, limit: 10});
    if (uid) params.set('user_id', uid);
    const res = await fetch('/api/suggest/biz?' + params.toString());
    const data = await res.json();
    return (data.items || []).map(it => ({
        label: it.source_id,
        html: it.label,
        source_id: it.source_id,
        user_id: it.user_id,
    }));
}, (item) => {
    // 选中业务ID → 填 source_id; 用户为空时带出该记录的用户; 预订/支付自动填 order_id
    document.getElementById('ck_source_id').value = item.source_id;
    if (!document.getElementById('ck_user_id').value.trim()) {
        document.getElementById('ck_user_id').value = item.user_id;
    }
    const et = document.getElementById('ck_event_type').value;
    if (et === '预订下单' || et === '支付') {
        document.getElementById('ck_order_id').value = item.source_id;
    }
});

document.getElementById('checkForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('checkBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 检查中...';

    const data = {
        event_type: document.getElementById('ck_event_type').value,
        user_id: document.getElementById('ck_user_id').value,
        source_id: document.getElementById('ck_source_id').value,
        order_id: document.getElementById('ck_order_id').value || null,
    };

    try {
        const res = await fetch('/api/risk/check', {
            method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
        });
        const result = await res.json();

        if (!res.ok) {
            document.getElementById('resultContent').innerHTML = `<div class="alert alert-danger">${result.detail || '检查失败'}</div>`;
        } else {
            const decisionColor = {'通过':'success','标记':'warning','人工审核':'info','拒绝':'danger'}[result.decision] || 'secondary';
            document.getElementById('resultContent').innerHTML = `
                <div class="alert alert-${decisionColor} mb-3">
                    <strong>决策: ${result.decision}</strong> | 评分: <strong>${result.final_score}</strong> | 等级: ${riskBadge(result.risk_level)}
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <small class="text-muted">评估ID</small><br><code>${result.assessment_id}</code>
                    </div>
                    <div class="col-md-6">
                        <small class="text-muted">命中规则数</small><br><strong>${result.rule_count}</strong>
                    </div>
                </div>
                ${result.triggered_rules.length > 0 ? `
                <h6 class="mt-3">命中规则</h6>
                <table class="table table-sm">
                    <thead><tr><th>规则</th><th>分类</th><th>等级</th><th>分值</th><th>动作</th></tr></thead>
                    <tbody>${result.triggered_rules.map(r => `
                        <tr>
                            <td>${r.rule_name}</td>
                            <td><span class="badge bg-info">${r.rule_category}</span></td>
                            <td>${riskBadge(r.risk_level)}</td>
                            <td>${r.risk_score}</td>
                            <td>${r.action}</td>
                        </tr>
                    `).join('')}</tbody>
                </table>` : '<p class="text-success mt-3">未命中任何规则</p>'}
                <!-- 【P4-L4 2026-08-08】ML 评分 (XGBoost): P(拒绝) + 风险分(sigmoid 校准) + ML 决策, 模型未加载时显示提示 -->
                <h6 class="mt-3">ML 评分 <small class="text-muted">(XGBoost)</small></h6>
                <div class="ml-score-block p-2 bg-light rounded">
                    ${result.ml_score != null
                        ? renderMLScoreBlock(result.ml_score, result.ml_decision)
                        : '<span class="text-muted">未加载模型</span>'}
                </div>
                <details class="mt-3">
                    <summary class="text-muted">特征详情</summary>
                    <pre class="mt-2 bg-light p-2 rounded" style="max-height:300px;overflow:auto;">${JSON.stringify(result.features, null, 2)}</pre>
                </details>
            `;
        }
        document.getElementById('resultPanel').style.display = 'block';
        document.getElementById('emptyPanel').style.display = 'none';
    } catch(e) {
        document.getElementById('resultContent').innerHTML = `<div class="alert alert-danger">请求失败: ${e.message}</div>`;
        document.getElementById('resultPanel').style.display = 'block';
        document.getElementById('emptyPanel').style.display = 'none';
    } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-search"></i> 执行检查';
    }
});
</script>
{% endblock %}
