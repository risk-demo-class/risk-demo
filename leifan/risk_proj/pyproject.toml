[project]
name = "risk-proj"
version = "0.1.0"
description = "OTA travel risk-control system"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents>=0.7.5",
    "fastapi==0.141.1",
    "langchain-openai>=1.4.3",
    "numpy>=2,<3",
    "openai>=2.54.0",
    "pymysql==1.2.0",
    "python-dotenv==1.2.2",
    "sqlalchemy==2.0.51",
    "uvicorn==0.52.1",
    "xgboost>=3.3,<4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

