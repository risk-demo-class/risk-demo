{% extends "base.html" %}
{% block title %}AI Agent - 电信风控系统{% endblock %}
{% block content %}
<h4 class="mb-4">AI Agent 对话 <small class="text-muted fs-6">(复用 ai_risk API)</small></h4>

<div class="card stat-card p-3">
    <div id="chat-log" class="mb-3"></div>
    <div class="d-flex gap-2">
        <input id="msg" class="form-control" placeholder="输入问题 (如: 13800000001 这张卡有什么风险?)" onkeydown="if(event.key==='Enter')sendMsg()">
        <button onclick="sendMsg()" class="btn btn-primary">
            <i class="bi bi-send"></i> 发送
        </button>
    </div>
    <p class="text-muted small mt-2 mb-0">💡 需要先启动 ai_risk 服务 (端口 8000) 才能使用 Agent。支持上下文多轮对话。</p>
</div>
{% endblock %}
{% block script %}
<script>
let sessionId = null;
async function sendMsg() {
    const input = document.getElementById('msg');
    const text = input.value.trim();
    if (!text) return;
    addMsg('user', text);
    input.value = '';
    try {
        const res = await fetch('/api/agent/chat', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text, session_id: sessionId}),
        });
        const data = await res.json();
        sessionId = data.session_id;
        addMsg('bot', data.reply);
    } catch (e) {
        addMsg('bot', '请求失败: ' + e.message);
    }
}
function addMsg(role, text) {
    const log = document.getElementById('chat-log');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = '<span>' + text.replace(/</g,'&lt;').replace(/\n/g,'<br>') + '</span>';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
}
</script>
{% endblock %}
