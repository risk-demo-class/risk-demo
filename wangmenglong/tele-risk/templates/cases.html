{% extends "base.html" %}
{% block title %}案件管理 - 电信风控系统{% endblock %}
{% block content %}
<h4 class="mb-4">案件管理</h4>

<!-- 统计卡片 -->
<div class="row mb-4" id="stat-cards"></div>

<!-- 案件列表 -->
<div class="card stat-card p-3">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
        <label class="text-muted small mb-0">状态:</label>
        <select id="filter-status" class="form-select form-select-sm" style="width:140px;">
            <option value="">全部</option>
            <option value="待审核">待审核</option>
            <option value="审核中">审核中</option>
            <option value="已通过">已通过</option>
            <option value="已拒绝">已拒绝</option>
            <option value="已关停">已关停</option>
            <option value="已关闭">已关闭</option>
        </select>
        <label class="text-muted small mb-0">每页:</label>
        <select id="filter-size" class="form-select form-select-sm" style="width:90px;">
            <option value="10">10</option>
            <option value="20" selected>20</option>
            <option value="50">50</option>
        </select>
        <button onclick="currentPage=1; loadList();" class="btn btn-sm btn-primary">筛选</button>
        <button onclick="currentPage=1; loadStats(); loadList();" class="btn btn-sm btn-outline-secondary">刷新</button>
    </div>
    <div id="loading" class="text-center text-muted py-3" style="display:none;">加载中...</div>
    <div style="overflow-x:auto;">
        <table class="table table-hover align-middle">
            <thead>
                <tr>
                    <th>案件ID</th>
                    <th>号卡</th>
                    <th>分类</th>
                    <th>评分</th>
                    <th>等级</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="data-body"></tbody>
        </table>
    </div>
    <div class="pagination-bottom">
        <ul class="pagination mb-0" id="pagination"></ul>
    </div>
</div>

<!-- 详情模态框 -->
<div id="detail-modal" class="modal-bg">
    <div class="modal-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="mb-0" id="detail-title">案件详情</h6>
            <button onclick="closeDetail()" class="btn-close" aria-label="关闭"></button>
        </div>
        <div id="detail-content"></div>
    </div>
</div>
{% endblock %}

{% block script %}
<script>
let currentPage = 1;
let currentPageSize = 20;
let currentCaseId = null;

const statusClsMap = {
    '待审核': 'bg-warning text-dark',
    '审核中': 'bg-info',
    '已通过': 'bg-success',
    '已拒绝': 'bg-danger',
    '已关停': 'bg-dark',
    '已关闭': 'bg-secondary',
};

async function loadStats() {
    const data = await apiRequest('/api/cases/statistics');
    const statCards = [
        {label: '总计', value: data.total, color: 'text-primary'},
        {label: '待审核', value: data.pending, color: 'text-warning'},
        {label: '审核中', value: data.reviewing, color: 'text-info'},
        {label: '已通过', value: data.approved, color: 'text-success'},
        {label: '已拒绝', value: data.rejected, color: 'text-danger'},
        {label: '已关停', value: data.halted, color: 'text-dark'},
    ];
    document.getElementById('stat-cards').innerHTML = statCards.map(c => `
        <div class="col-md-2">
            <div class="card stat-card p-3 text-center">
                <div class="text-muted small">${c.label}</div>
                <div class="stat-value ${c.color}">${c.value}</div>
            </div>
        </div>
    `).join('');
}

async function loadList() {
    const status = document.getElementById('filter-status').value;
    currentPageSize = parseInt(document.getElementById('filter-size').value) || 20;
    document.getElementById('loading').style.display = 'block';
    const body = document.getElementById('data-body');
    body.innerHTML = '';

    const url = `/api/cases?page=${currentPage}&page_size=${currentPageSize}${status ? '&status=' + encodeURIComponent(status) : ''}`;
    const data = await apiRequest(url);

    if (!data.items || data.items.length === 0) {
        body.innerHTML = `<tr><td colspan="8" class="text-center text-muted py-5">暂无数据</td></tr>`;
    } else {
        body.innerHTML = data.items.map(item => {
            const levelCls = getRiskBadgeClass(item.risk_level);
            const stCls = statusClsMap[item.case_status] || 'bg-secondary';
            const score = item.final_score != null ? item.final_score : '-';
            return `<tr style="cursor:pointer;" onclick="showDetail('${item.case_id}')">
                <td><code>${item.case_id}</code></td>
                <td>${item.msisdn}</td>
                <td>${item.case_category || '-'}</td>
                <td><b>${score}</b></td>
                <td>${item.risk_level ? `<span class="badge ${levelCls}">${item.risk_level}</span>` : '-'}</td>
                <td><span class="badge ${stCls}">${item.case_status}</span></td>
                <td>${item.create_time ? new Date(item.create_time).toLocaleString('zh-CN') : '-'}</td>
                <td>
                    <button onclick="event.stopPropagation(); showDetail('${item.case_id}');" class="btn btn-sm btn-outline-primary">查看</button>
                </td>
            </tr>`;
        }).join('');
    }
    document.getElementById('loading').style.display = 'none';
    const totalPages = Math.max(1, Math.ceil((data.total || 0) / currentPageSize));
    renderPaginationBar('pagination', currentPage, totalPages, data.total || 0, currentPageSize, 'loadList');
}

function goPage(p) {
    currentPage = p;
    loadList();
}

async function showDetail(caseId) {
    currentCaseId = caseId;
    const data = await apiRequest(`/api/cases/${caseId}`);
    const stCls = statusClsMap[data.case_status] || 'bg-secondary';
    const levelCls = getRiskBadgeClass(data.risk_level);

    const rulesHtml = (data.triggered_rules && data.triggered_rules.length > 0)
        ? data.triggered_rules.map(r => `
            <div class="p-2 border rounded mb-2 d-flex justify-content-between align-items-center">
                <span><b>${r.rule_id}</b> ${r.rule_name}</span>
                <span>
                    <span class="badge ${getRiskBadgeClass(r.risk_level)}">${r.risk_level}</span>
                    <small class="text-muted ms-2">${r.risk_score}分 · ${r.action}</small>
                </span>
            </div>`).join('')
        : '<p class="text-muted">无</p>';

    const canReview = data.case_status === '待审核' || data.case_status === '审核中';
    const reviewHtml = canReview ? `
        <div class="p-3 bg-light rounded mt-3">
            <h6 class="mb-2">审核表单</h6>
            <div class="mb-2">
                <label class="form-label">决策</label>
                <select id="review-decision" class="form-select">
                    <option value="已通过">已通过</option>
                    <option value="已拒绝">已拒绝</option>
                    <option value="已关停">已关停</option>
                </select>
            </div>
            <div class="mb-2">
                <label class="form-label">审核人</label>
                <input id="review-reviewer" class="form-control" placeholder="输入审核人姓名">
            </div>
            <div class="mb-2">
                <label class="form-label">审核意见</label>
                <textarea id="review-comment" class="form-control" rows="2" placeholder="审核意见"></textarea>
            </div>
            <button onclick="submitReview()" class="btn btn-primary">提交审核</button>
        </div>` : '';

    document.getElementById('detail-title').textContent = `案件详情 - ${data.case_id}`;
    document.getElementById('detail-content').innerHTML = `
        <div class="row mb-3">
            <div class="col-md-4"><div class="card stat-card p-3 text-center"><div class="text-muted small">评分</div><div class="stat-value text-primary">${data.final_score ?? '-'}</div></div></div>
            <div class="col-md-4"><div class="card stat-card p-3 text-center"><div class="text-muted small">等级</div><div class="stat-value"><span class="badge ${levelCls}">${data.risk_level || '-'}</span></div></div></div>
            <div class="col-md-4"><div class="card stat-card p-3 text-center"><div class="text-muted small">决策</div><div class="stat-value">${data.decision || '-'}</div></div></div>
        </div>
        <h6>基本信息</h6>
        <pre>案件ID: ${data.case_id}
号卡: ${data.msisdn}
分类: ${data.case_category || '-'}
状态: <span class="badge ${stCls}">${data.case_status}</span>
事件类型: ${data.event_type || '-'}
业务单号: ${data.source_id || '-'}
评估ID: ${data.assessment_id || '-'}
ML评分: ${data.ml_score != null ? Number(data.ml_score).toFixed(4) : 'N/A'}
ML决策: ${data.ml_decision || 'N/A'}
创建时间: ${data.create_time ? new Date(data.create_time).toLocaleString('zh-CN') : '-'}
${data.reviewer ? '审核人: ' + data.reviewer + '\n审核时间: ' + (data.review_time ? new Date(data.review_time).toLocaleString('zh-CN') : '-') + '\n审核意见: ' + (data.review_comment || '-') : ''}</pre>
        <h6 class="mt-3">命中规则</h6>
        ${rulesHtml}
        ${reviewHtml}
    `;
    document.getElementById('detail-modal').classList.add('show');
}

async function submitReview() {
    const reviewer = document.getElementById('review-reviewer').value.trim();
    if (!reviewer) { alert('请输入审核人'); return; }
    const body = {
        decision: document.getElementById('review-decision').value,
        reviewer: reviewer,
        review_comment: document.getElementById('review-comment').value.trim() || null,
    };
    const result = await apiRequest(`/api/cases/${currentCaseId}/review`, {
        method: 'POST',
        body: JSON.stringify(body),
    });
    alert('审核已提交：' + result.case_status);
    closeDetail();
    loadStats();
    loadList();
}

function closeDetail() {
    document.getElementById('detail-modal').classList.remove('show');
    currentCaseId = null;
}

loadStats();
loadList();
</script>
{% endblock %}
