<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}电信风控系统{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; }
        body { background: #f0f2f5; overflow: hidden; font-family: -apple-system, "Microsoft YaHei", sans-serif; color: #333; }
        .container-fluid, .row { padding: 0 !important; margin: 0 !important; }

        /* 固定左侧边栏 (深色) */
        .sidebar {
            position: fixed;
            top: 0; left: 0; bottom: 0;
            width: 16.66667%;
            min-width: 180px;
            background: #1e293b;
            overflow-y: auto;
            z-index: 1000;
        }
        .sidebar .nav-link { color: #94a3b8; padding: 12px 20px; border-radius: 8px; margin: 2px 8px; font-size: 14px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #334155; }
        .sidebar .nav-link i { margin-right: 10px; width: 20px; text-align: center; }
        .sidebar-brand {
            color: #fff; font-size: 18px; font-weight: 700; padding: 20px;
            border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 8px;
        }
        .sidebar-brand i { font-size: 22px; color: #3b82f6; }

        /* 主内容区 */
        .main-content {
            margin-left: 16.66667%;
            min-width: 0;
            height: 100vh;
            overflow-y: auto;
            padding: 24px;
        }

        /* 统计卡片 */
        .stat-card { border: none; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
        .stat-card .stat-value { font-size: 28px; font-weight: 700; }
        .section-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 20px; }
        .section-card h2, .section-card h4, .section-card h6 { color: #1e293b; }

        /* 徽章 (风险等级) */
        .badge-risk-low { background: #dcfce7; color: #166534; }
        .badge-risk-mid { background: #fef9c3; color: #854d0e; }
        .badge-risk-high { background: #fed7aa; color: #9a3412; }
        .badge-risk-critical { background: #fecaca; color: #991b1b; }

        /* 表格 (Bootstrap 风格) */
        .table thead tr { background: #1e293b; color: #fff; }
        .table thead th { border: none; font-weight: 500; padding: 10px 8px; font-size: 13px; }
        .table tbody td { padding: 10px 8px; font-size: 13px; vertical-align: middle; }
        .table tbody tr { border-bottom: 1px solid #e5e7eb; }
        .table tbody tr:hover { background: #f5f7fa; }

        /* 模态框 (Bootstrap 风格) */
        .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; justify-content: center; align-items: center; }
        .modal-bg.show { display: flex; }
        .modal-box { background: #fff; border-radius: 10px; padding: 24px; max-height: 90vh; overflow-y: auto; min-width: 480px; max-width: 800px; box-shadow: 0 4px 24px rgba(0,0,0,0.15); }

        /* 分页 (粘底) */
        .pagination-bottom {
            position: sticky;
            bottom: 0;
            background: #ffffff;
            padding: 6px 12px;
            margin: 12px 0 0 0;
            border-top: 1px solid #e5e7eb;
            box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.04);
            z-index: 100;
            min-height: 38px;
            border-radius: 0 0 12px 12px;
        }
        .pagination-bottom .pagination {
            margin: 0; display: flex; list-style: none; gap: 3px;
            justify-content: center; align-items: center;
        }
        .pagination-bottom .page-item .page-link {
            color: #0d6efd; background: #ffffff; border: 1px solid #dee2e6;
            padding: 4px 10px; font-size: 13px; line-height: 1.4;
            min-width: 32px; height: 28px; text-align: center; border-radius: 3px;
            display: inline-flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none;
        }
        .pagination-bottom .page-item.active .page-link {
            color: #ffffff; background: #0d6efd; border-color: #0d6efd; font-weight: 600;
        }
        .pagination-bottom .page-item.disabled .page-link { color: #adb5bd; background: #f8f9fa; cursor: not-allowed; }
        .pagination-bottom .page-item .page-link:hover:not(.disabled) { background: #e7f1ff; border-color: #0d6efd; }

        /* 表单覆盖 */
        .form-control, .form-select { border-radius: 6px; border: 1px solid #d1d5db; }
        .form-control:focus, .form-select:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .btn-primary { background: #1e293b; border: none; }
        .btn-primary:hover { background: #334155; }

        pre { background: #f3f4f6; padding: 12px; border-radius: 6px; overflow-x: auto; font-size: 12px; white-space: pre-wrap; }

        /* 聊天 */
        #chat-log { height: 400px; overflow-y: auto; border: 1px solid #e5e7eb; padding: 16px; border-radius: 8px; background: #fafafa; }
        .msg { margin-bottom: 12px; }
        .msg.user { text-align: right; }
        .msg.user span { background: #1e293b; color: #fff; }
        .msg.bot span { background: #e5e7eb; }
        .msg span { display: inline-block; padding: 8px 12px; border-radius: 8px; max-width: 70%; text-align: left; }

        /* 进度条 */
        .progress-thin { height: 6px; border-radius: 3px; background: #e5e7eb; overflow: hidden; }
        .progress-thin .bar { height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); border-radius: 3px; }

        /* 响应式 */
        @media (max-width: 767.98px) {
            body { overflow: auto; }
            .sidebar { position: relative; width: 100%; height: auto; overflow-y: visible; }
            .main-content { margin-left: 0; height: auto; overflow-y: visible; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- 左侧边栏 -->
        <div class="col-md-2 sidebar px-0">
            <div class="sidebar-brand">
                <i class="bi bi-shield-check"></i> 电信风控中心
            </div>
            <nav class="nav flex-column mt-3">
                <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                    <i class="bi bi-speedometer2"></i> 仪表盘
                </a>
                <a class="nav-link {% if request.url.path == '/risk-check' %}active{% endif %}" href="/risk-check">
                    <i class="bi bi-search"></i> 风控检查
                </a>
                <a class="nav-link {% if request.url.path == '/rules' %}active{% endif %}" href="/rules">
                    <i class="bi bi-list-check"></i> 规则管理
                </a>
                <a class="nav-link {% if request.url.path == '/cases' %}active{% endif %}" href="/cases">
                    <i class="bi bi-folder2-open"></i> 案件管理
                </a>
                <a class="nav-link {% if request.url.path == '/assessments' %}active{% endif %}" href="/assessments">
                    <i class="bi bi-clipboard-data"></i> 评估历史
                </a>
                <a class="nav-link {% if request.url.path == '/blacklist' %}active{% endif %}" href="/blacklist">
                    <i class="bi bi-shield-x"></i> 黑名单
                </a>
                <a class="nav-link {% if request.url.path == '/agent' %}active{% endif %}" href="/agent">
                    <i class="bi bi-robot"></i> AI Agent
                </a>
            </nav>
        </div>
        <!-- 主内容区 -->
        <div class="col-md-10 main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/static/app.js?v=20260812v1"></script>
{% block script %}{% endblock %}
{% block extra_js %}{% endblock %}
</body>
</html>
