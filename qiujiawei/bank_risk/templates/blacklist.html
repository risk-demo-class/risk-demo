{% extends "base.html" %}
{% block title %}黑名单管理 - 银行风控系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">黑名单管理</h4>
    <button class="btn btn-primary btn-sm" onclick="showAddModal()">
        <i class="bi bi-plus-circle"></i> 新增黑名单
    </button>
</div>

<!-- 统计卡片: 5 种类型各多少条 + 总数 -->
<div class="row mb-4" id="bl-stats">
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">用户</div><div class="fw-bold text-primary" id="bl-stat-user">-</div></div></div>
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">设备</div><div class="fw-bold text-info" id="bl-stat-device">-</div></div></div>
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">IP</div><div class="fw-bold text-warning" id="bl-stat-ip">-</div></div></div>
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">银行卡</div><div class="fw-bold text-danger" id="bl-stat-card">-</div></div></div>
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">身份证</div><div class="fw-bold text-secondary" id="bl-stat-idcard">-</div></div></div>
    <div class="col-md-2"><div class="card stat-card p-2 text-center"><div class="text-muted small">总数</div><div class="fw-bold text-dark" id="bl-stat-total">-</div></div></div>
</div>

<!-- 筛选 + 分页大小 -->
<div class="mb-3 d-flex gap-2 align-items-center">
    <select class="form-select form-select-sm w-auto" id="filterType" onchange="loadList(1)">
        <option value="">全部类型</option>
        <option value="用户">用户</option>
        <option value="设备">设备</option>
        <option value="IP">IP</option>
        <option value="银行卡">银行卡</option>
        <option value="身份证">身份证</option>
    </select>
    <span class="text-muted small">每页</span>
    <select class="form-select form-select-sm w-auto" id="pageSize" onchange="onPageSizeChange()">
        <option value="20">20 条</option>
        <option value="50">50 条</option>
        <option value="100">100 条</option>
    </select>
    <span class="text-muted small ms-2" id="listCount"></span>
</div>

<!-- 黑名单列表 -->
<div class="card stat-card">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr>
                    <th>ID</th>
                    <th>类型</th>
                    <th>值</th>
                    <th>原因</th>
                    <th>过期时间</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="bl-table"></tbody>
        </table>
    </div>
</div>

<nav class="pagination-bottom"><ul class="pagination justify-content-center mb-0" id="pagination"></ul></nav>

<!-- 新增黑名单 模态框 -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">新增黑名单</h5>
                <button type="button" class="btn-close-risk" data-bs-dismiss="modal" title="关闭" aria-label="Close">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">类型 <span class="text-danger">*</span></label>
                    <select class="form-select" id="addType">
                        <option value="用户">用户 (user_id)</option>
                        <option value="设备">设备 (device_id)</option>
                        <option value="IP">IP 地址</option>
                        <option value="银行卡">银行卡号</option>
                        <option value="身份证">身份证号</option>
                    </select>
                    <div class="form-text">用户 = user_id; 设备 = device_id; IP = IPv4/IPv6; 银行卡 = 卡号; 身份证 = 18 位身份证号</div>
                </div>
                <div class="mb-3">
                    <label class="form-label">值 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="addValue" placeholder="例如: 1001 / dev-aabbcc / 1.2.3.4 / 622200001">
                </div>
                <div class="mb-3">
                    <label class="form-label">原因</label>
                    <input type="text" class="form-control" id="addReason" placeholder="例如: 涉嫌欺诈 / 异常登录 / 关联黑产">
                </div>
                <div class="mb-3">
                    <label class="form-label">过期时间 (留空 = 永久)</label>
                    <input type="datetime-local" class="form-control" id="addExpire">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button class="btn btn-primary" onclick="submitAdd()">确认添加</button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
const PAGE_SIZE_KEY = 'bl_pageSize';

// 从 localStorage 恢复 pageSize, 默认 20
(function initPageSize() {
    const saved = localStorage.getItem(PAGE_SIZE_KEY) || '20';
    document.getElementById('pageSize').value = saved;
})();

function onPageSizeChange() {
    localStorage.setItem(PAGE_SIZE_KEY, document.getElementById('pageSize').value);
    loadList(1);
}

// 类型徽章颜色: 用户=蓝 / 设备=青 / IP=黄 / 银行卡=红 / 身份证=灰
function typeBadge(t) {
    const cls = {'用户':'bg-primary','设备':'bg-info text-dark','IP':'bg-warning text-dark','银行卡':'bg-danger','身份证':'bg-secondary'}[t] || 'bg-secondary';
    return `<span class="badge ${cls}">${t}</span>`;
}

// 加载统计 (拉 page_size=100 汇总)
async function loadStats() {
    const res = await fetch('/api/blacklist?page=1&page_size=100');
    const data = await res.json();
    const cnt = {用户: 0, 设备: 0, IP: 0, 银行卡: 0, 身份证: 0};
    data.items.forEach(it => { if (cnt[it.blacklist_type] !== undefined) cnt[it.blacklist_type]++; });
    document.getElementById('bl-stat-user').textContent = cnt.用户;
    document.getElementById('bl-stat-device').textContent = cnt.设备;
    document.getElementById('bl-stat-ip').textContent = cnt.IP;
    document.getElementById('bl-stat-card').textContent = cnt.银行卡;
    document.getElementById('bl-stat-idcard').textContent = cnt.身份证;
    document.getElementById('bl-stat-total').textContent = data.total;
}

// 加载列表 (前端过滤 type, 因为后端没 type 筛选参数)
async function loadList(page) {
    currentPage = page || 1;
    const filterType = document.getElementById('filterType').value;
    const pageSize = parseInt(document.getElementById('pageSize').value);
    const res = await fetch(`/api/blacklist?page=${currentPage}&page_size=${pageSize}`);
    const data = await res.json();
    let items = data.items;
    if (filterType) items = items.filter(it => it.blacklist_type === filterType);
    document.getElementById('listCount').textContent =
        filterType ? `当前 ${items.length} 条 (类型筛选为前端过滤)` : `共 ${data.total} 条, 当前 ${items.length} 条/页`;

    const tbody = document.getElementById('bl-table');
    if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">暂无黑名单</td></tr>';
    } else {
        tbody.innerHTML = items.map(it => `
            <tr>
                <td>${it.blacklist_id}</td>
                <td>${typeBadge(it.blacklist_type)}</td>
                <td><code>${it.blacklist_value}</code></td>
                <td>${it.reason || '<span class="text-muted small">-</span>'}</td>
                <td>${it.expire_time ? new Date(it.expire_time).toLocaleString('zh-CN') : '<span class="text-muted small">永久</span>'}</td>
                <td>${it.create_time ? new Date(it.create_time).toLocaleString('zh-CN') : '-'}</td>
                <td>
                    <button class="btn btn-outline-danger btn-sm" onclick="removeBl(${it.blacklist_id}, '${it.blacklist_value}')">
                        <i class="bi bi-trash"></i> 移除
                    </button>
                </td>
            </tr>
        `).join('');
    }
    const totalPages = Math.ceil(data.total / pageSize);
    document.getElementById('pagination').innerHTML =
        buildPaginationHtml(currentPage, totalPages, pageSize, 'loadList');
}

// 新增模态框
function showAddModal() {
    document.getElementById('addType').value = '用户';
    document.getElementById('addValue').value = '';
    document.getElementById('addReason').value = '';
    document.getElementById('addExpire').value = '';
    new bootstrap.Modal(document.getElementById('addModal')).show();
}

// 提交新增
async function submitAdd() {
    const type = document.getElementById('addType').value;
    const value = document.getElementById('addValue').value.trim();
    const reason = document.getElementById('addReason').value.trim();
    const expireRaw = document.getElementById('addExpire').value;
    if (!value) { alert('请填写值'); return; }

    // datetime-local 没有时区, 直接拼秒 + 用 ISO 格式
    const expire_time = expireRaw ? expireRaw + ':00' : null;

    const body = {
        blacklist_type: type,
        blacklist_value: value,
        reason: reason || null,
        expire_time: expire_time,
    };
    const res = await fetch('/api/blacklist', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body),
    });
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('addModal')).hide();
        loadList(currentPage);
        loadStats();
    } else {
        const err = await res.json().catch(() => ({detail: '请求失败'}));
        alert('添加失败: ' + (err.detail || res.status));
    }
}

// 移除黑名单
async function removeBl(blacklistId, value) {
    if (!confirm(`确定要移除黑名单 "${value}" 吗?`)) return;
    const res = await fetch(`/api/blacklist/${blacklistId}`, { method: 'DELETE' });
    if (res.ok) {
        loadList(currentPage);
        loadStats();
    } else {
        const err = await res.json().catch(() => ({detail: '请求失败'}));
        alert('移除失败: ' + (err.detail || res.status));
    }
}

loadStats();
loadList();
</script>
{% endblock %}
