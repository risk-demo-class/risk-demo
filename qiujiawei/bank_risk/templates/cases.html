{% extends "base.html" %}
{% block title %}案件工作台 - 银行风控系统{% endblock %}
{% block content %}
<h4 class="mb-4">案件工作台</h4>

<!-- 状态筛选 tab -->
<ul class="nav nav-pills mb-3" id="statusTabs">
    <li class="nav-item"><a class="nav-link active" href="#" data-status="" onclick="filterStatus('', this);return false;">全部</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-status="待审核" onclick="filterStatus('待审核', this);return false;">待审核</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-status="审核中" onclick="filterStatus('审核中', this);return false;">审核中</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-status="已通过" onclick="filterStatus('已通过', this);return false;">已通过</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-status="已拒绝" onclick="filterStatus('已拒绝', this);return false;">已拒绝</a></li>
    <li class="nav-item"><a class="nav-link" href="#" data-status="已关闭" onclick="filterStatus('已关闭', this);return false;">已关闭</a></li>
</ul>

<!-- 每页大小 -->
<div class="mb-3 d-flex gap-2 align-items-center">
    <span class="text-muted small">每页</span>
    <select class="form-select form-select-sm w-auto" id="pageSize" onchange="onPageSizeChange()">
        <option value="20">20 条</option>
        <option value="50">50 条</option>
        <option value="100">100 条</option>
    </select>
    <span class="text-muted small ms-2" id="casesCount"></span>
</div>

<!-- 案件列表 -->
<div class="card stat-card">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead class="table-light">
                <tr><th>案件ID</th><th>用户ID</th><th>事件</th><th>评分</th><th>等级</th><th>状态</th><th>创建时间</th><th>操作</th></tr>
            </thead>
            <tbody id="cases-table"></tbody>
        </table>
    </div>
</div>

<nav class="pagination-bottom"><ul class="pagination justify-content-center mb-0" id="pagination"></ul></nav>

<!-- 案件详情模态框 -->
<div class="modal fade" id="caseModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header"><h5 class="modal-title">案件详情</h5><button type="button" class="btn-close-risk" data-bs-dismiss="modal" title="关闭" aria-label="Close"><i class="bi bi-x-lg"></i></button></div>
            <div class="modal-body" id="caseDetailBody">加载中...</div>
            <div class="modal-footer" id="caseActions"></div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1;
let currentStatus = '';
const PAGE_SIZE_KEY = 'cases_pageSize';

// 从 localStorage 恢复 pageSize, 默认 20
(function initPageSize() {
    const saved = localStorage.getItem(PAGE_SIZE_KEY) || '20';
    document.getElementById('pageSize').value = saved;
})();

function onPageSizeChange() {
    localStorage.setItem(PAGE_SIZE_KEY, document.getElementById('pageSize').value);
    loadCases(1);
}

// 切换状态 tab
function filterStatus(status, el) {
    currentStatus = status;
    document.querySelectorAll('#statusTabs .nav-link').forEach(a => a.classList.remove('active'));
    if (el) el.classList.add('active');
    loadCases(1);
}

function riskBadge(level) {
    const cls = {'低':'badge-risk-low','中':'badge-risk-mid','高':'badge-risk-high','极高':'badge-risk-critical'}[level] || 'bg-secondary';
    return `<span class="badge ${cls}">${level}</span>`;
}

function statusBadge(status) {
    const cls = {'待审核':'bg-warning','审核中':'bg-info','已通过':'bg-success','已拒绝':'bg-danger','已关闭':'bg-secondary'}[status] || 'bg-secondary';
    return `<span class="badge ${cls}">${status}</span>`;
}

async function loadCases(page) {
    currentPage = page || 1;
    const pageSize = document.getElementById('pageSize').value;
    let url = `/api/cases?page=${currentPage}&page_size=${pageSize}`;
    if (currentStatus) url += `&status=${encodeURIComponent(currentStatus)}`;
    const res = await fetch(url);
    const data = await res.json();
    document.getElementById('casesCount').textContent =
        `共 ${data.total} 条, 当前 ${data.items.length} 条/页`;
    const tbody = document.getElementById('cases-table');
    if (data.items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">暂无案件</td></tr>';
    } else {
        tbody.innerHTML = data.items.map(c => `
            <tr>
                <td><code>${(c.case_id || '').substring(0, 16)}...</code></td>
                <td>${c.user_id}</td>
                <td>${c.event_type || '-'}</td>
                <td><strong>${c.final_score ?? '-'}</strong></td>
                <td>${riskBadge(c.risk_level || '低')}</td>
                <td>${statusBadge(c.case_status)}</td>
                <td>${c.create_time ? new Date(c.create_time).toLocaleString('zh-CN') : '-'}</td>
                <td>
                    <button class="btn btn-outline-primary btn-sm" onclick="viewCase('${c.case_id}')">详情</button>
                </td>
            </tr>
        `).join('');
    }
    const totalPages = Math.ceil(data.total / pageSize);
    document.getElementById('pagination').innerHTML =
        buildPaginationHtml(currentPage, totalPages, pageSize, 'loadCases');
}

async function viewCase(caseId) {
    const res = await fetch(`/api/cases/${caseId}`);
    const c = await res.json();
    const body = document.getElementById('caseDetailBody');
    body.innerHTML = `
        <div class="row">
            <div class="col-md-6">
                <h6>基本信息</h6>
                <table class="table table-sm">
                    <tr><td class="text-muted">案件ID</td><td>${c.case_id}</td></tr>
                    <tr><td class="text-muted">用户ID</td><td>${c.user_id}</td></tr>
                    <tr><td class="text-muted">事件类型</td><td>${c.event_type || '-'}</td></tr>
                    <tr><td class="text-muted">评分</td><td><strong>${c.final_score ?? '-'}</strong></td></tr>
                    <tr><td class="text-muted">等级</td><td>${riskBadge(c.risk_level || '低')}</td></tr>
                    <tr><td class="text-muted">决策</td><td>${c.decision || '-'}</td></tr>
                    <tr><td class="text-muted">状态</td><td>${statusBadge(c.case_status)}</td></tr>
                    <tr><td class="text-muted">创建时间</td><td>${c.create_time ? new Date(c.create_time).toLocaleString('zh-CN') : '-'}</td></tr>
                    ${c.reviewer ? `<tr><td class="text-muted">审核人</td><td>${c.reviewer}</td></tr>` : ''}
                    ${c.review_comment ? `<tr><td class="text-muted">审核意见</td><td>${c.review_comment}</td></tr>` : ''}
                </table>
                <h6 class="mt-3">ML 评分 <small class="text-muted">(XGBoost)</small></h6>
                <div class="ml-score-block p-2 bg-light rounded">
                    ${c.ml_score != null
                        ? renderMLScoreBlock(c.ml_score, c.ml_decision)
                        : '<span class="text-muted">未加载模型</span>'}
                </div>
            </div>
            <div class="col-md-6">
                <h6>命中规则</h6>
                ${c.triggered_rules && c.triggered_rules.length > 0 ? `<table class="table table-sm">
                    <thead><tr><th>规则</th><th>等级</th><th>分值</th></tr></thead>
                    <tbody>${c.triggered_rules.map(r => `<tr><td>${r.rule_name}</td><td>${riskBadge(r.risk_level)}</td><td>${r.risk_score}</td></tr>`).join('')}</tbody>
                </table>` : '<p class="text-muted">无命中规则</p>'}
            </div>
        </div>
        ${(c.case_status === '待审核' || c.case_status === '审核中') ? `
        <hr>
        <h6>审核操作</h6>
        <div class="row">
            <div class="col-md-4">
                <label class="form-label">审核人</label>
                <input type="text" class="form-control" id="reviewer" value="admin">
            </div>
            <div class="col-md-8">
                <label class="form-label">审核意见</label>
                <input type="text" class="form-control" id="reviewComment">
            </div>
        </div>` : ''}
    `;

    const actions = document.getElementById('caseActions');
    if (c.case_status === '待审核' || c.case_status === '审核中') {
        actions.innerHTML = `
            <button class="btn btn-info" onclick="transitionCase('${c.case_id}','审核中')">标记审核中</button>
            <button class="btn btn-success" onclick="transitionCase('${c.case_id}','已通过')">通过</button>
            <button class="btn btn-danger" onclick="transitionCase('${c.case_id}','已拒绝')">拒绝</button>
            <button class="btn btn-secondary" onclick="transitionCase('${c.case_id}','已关闭')">关闭</button>
        `;
    } else {
        actions.innerHTML = '<button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>';
    }
    new bootstrap.Modal(document.getElementById('caseModal')).show();
}

// 状态流转: PATCH /api/cases/{case_id}
async function transitionCase(caseId, newStatus) {
    const data = {
        case_status: newStatus,
        reviewer: document.getElementById('reviewer')?.value || 'admin',
        review_comment: document.getElementById('reviewComment')?.value || '',
    };
    const res = await fetch(`/api/cases/${caseId}`, {
        method: 'PATCH', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
    });
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('caseModal')).hide();
        loadCases(currentPage);
    } else {
        const err = await res.json().catch(() => ({detail: '审核失败'}));
        alert('状态流转失败: ' + (err.detail || res.status));
    }
}

loadCases();
</script>
{% endblock %}
