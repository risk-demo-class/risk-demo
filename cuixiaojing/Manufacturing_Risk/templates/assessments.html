{% extends "base.html" %}
{% block title %}评估历史 - 制造业风控系统{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-clipboard-data me-2"></i>评估历史</h4>

<div class="card stat-card">
    <div class="card-body">
        <span class="text-muted small" id="assTotal"></span>
        <table class="table table-hover align-middle mt-2">
            <thead class="table-light">
            <tr>
                <th>评估ID</th><th>用户</th><th>事件类型</th><th>评分</th><th>等级</th><th>决策</th><th>命中规则</th><th>时间</th><th></th>
            </tr>
            </thead>
            <tbody id="assTable">
            <tr><td colspan="9" class="text-center text-muted">加载中...</td></tr>
            </tbody>
        </table>
        <div class="pagination-bottom" id="pagination"></div>
    </div>
</div>

<!-- 评估详情 Modal -->
<div class="modal fade" id="assModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">评估详情 <span id="assModalId"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row mb-2">
                    <div class="col-md-3"><span class="text-muted">评分</span> <span id="aScore"></span></div>
                    <div class="col-md-3"><span class="text-muted">等级</span> <span id="aLevel"></span></div>
                    <div class="col-md-3"><span class="text-muted">决策</span> <span id="aDecision"></span></div>
                    <div class="col-md-3"><span class="text-muted">事件</span> <span id="aEvent"></span></div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-4"><span class="text-muted">业务ID</span> <span id="aSourceId"></span></div>
                    <div class="col-md-4"><span class="text-muted">用户</span> <span id="aUser"></span></div>
                    <div class="col-md-4"><span class="text-muted">ML 评分</span> <span id="aMl"></span></div>
                </div>
                <h6 class="mt-3">命中规则</h6>
                <table class="table table-sm table-hover">
                    <thead class="table-light"><tr><th>规则ID</th><th>规则名</th><th>分类</th><th>等级</th><th>分值</th><th>动作</th></tr></thead>
                    <tbody id="aRules"></tbody>
                </table>
                <div id="aEventData" class="alert alert-light border small mt-2" style="display:none"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let page = 1;

async function loadAssessments() {
    try {
        const data = await apiRequest(`/api/assessments?page=${page}&page_size=10`);
        document.getElementById('assTotal').textContent = `共 ${data.total} 条评估`;
        const tbody = document.getElementById('assTable');
        if (data.items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">暂无评估, 去"风险检查"页跑一条</td></tr>';
            return;
        }
        tbody.innerHTML = data.items.map(a => `
            <tr>
                <td class="small">${a.assessment_id}</td>
                <td>${a.user_id}</td>
                <td>${a.event_type || '-'}</td>
                <td><strong>${a.final_score}</strong></td>
                <td>${riskBadge(a.risk_level)}</td>
                <td>${decisionBadge(a.decision)}</td>
                <td>${a.rule_count}</td>
                <td class="small text-muted">${formatTime(a.create_time)}</td>
                <td><button class="btn btn-sm btn-outline-primary" onclick="openAss('${a.assessment_id}')">详情</button></td>
            </tr>`).join('');
        renderPagination(data.total, data.page, data.page_size);
    } catch (e) {
        document.getElementById('assTable').innerHTML = `<tr><td colspan="9" class="text-center text-danger">${e.message}</td></tr>`;
    }
}

function renderPagination(total, p, pageSize) {
    const pages = Math.max(1, Math.ceil(total / pageSize));
    let html = '<nav><ul class="pagination">';
    html += `<li class="page-item ${p <= 1 ? 'disabled' : ''}"><a class="page-link" onclick="goPage(${p - 1})">‹</a></li>`;
    for (let i = 1; i <= pages && i <= 10; i++) {
        html += `<li class="page-item ${i === p ? 'active' : ''}"><a class="page-link" onclick="goPage(${i})">${i}</a></li>`;
    }
    html += `<li class="page-item ${p >= pages ? 'disabled' : ''}"><a class="page-link" onclick="goPage(${p + 1})">›</a></li>`;
    html += '</ul></nav>';
    document.getElementById('pagination').innerHTML = html;
}

function goPage(p) {
    if (p < 1) return;
    page = p;
    loadAssessments();
}

async function openAss(assId) {
    try {
        const a = await apiRequest(`/api/assessments/${assId}`);
        document.getElementById('assModalId').textContent = assId;
        document.getElementById('aScore').textContent = a.final_score;
        document.getElementById('aLevel').innerHTML = riskBadge(a.risk_level);
        document.getElementById('aDecision').innerHTML = decisionBadge(a.decision);
        document.getElementById('aEvent').textContent = a.event_type || '-';
        document.getElementById('aSourceId').textContent = a.event_source_id || '-';
        document.getElementById('aUser').textContent = a.user_id;
        document.getElementById('aMl').textContent = a.ml_score != null ? a.ml_score : '未加载';

        const rulesTbody = document.getElementById('aRules');
        if (a.triggered_rules && a.triggered_rules.length) {
            rulesTbody.innerHTML = a.triggered_rules.map(r => `
                <tr><td>${r.rule_id}</td><td>${r.rule_name}</td><td>${r.rule_category}</td><td>${riskBadge(r.risk_level)}</td><td>${r.risk_score}</td><td>${decisionBadge(r.action)}</td></tr>`).join('');
        } else {
            rulesTbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">无命中</td></tr>';
        }

        const ed = document.getElementById('aEventData');
        if (a.event_data) {
            ed.style.display = 'block';
            ed.textContent = '事件数据: ' + a.event_data;
        } else {
            ed.style.display = 'none';
        }
        new bootstrap.Modal(document.getElementById('assModal')).show();
    } catch (e) {
        alert(e.message);
    }
}

loadAssessments();
</script>
{% endblock %}
