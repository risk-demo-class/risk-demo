{% extends "base.html" %}
{% block title %}案件管理 - 制造业风控系统{% endblock %}
{% block content %}
<h4 class="mb-4"><i class="bi bi-folder2-open me-2"></i>案件管理</h4>

<div class="card stat-card">
    <div class="card-body">
        <div class="d-flex justify-content-between mb-3">
            <div class="btn-group" id="statusFilter">
                <button class="btn btn-outline-secondary btn-sm active" data-status="">全部</button>
                <button class="btn btn-outline-secondary btn-sm" data-status="待审核">待审核</button>
                <button class="btn btn-outline-secondary btn-sm" data-status="审核中">审核中</button>
                <button class="btn btn-outline-secondary btn-sm" data-status="已通过">已通过</button>
                <button class="btn btn-outline-secondary btn-sm" data-status="已拒绝">已拒绝</button>
                <button class="btn btn-outline-secondary btn-sm" data-status="已关闭">已关闭</button>
            </div>
            <span class="text-muted small" id="caseTotal"></span>
        </div>
        <table class="table table-hover align-middle">
            <thead class="table-light">
            <tr>
                <th>案件ID</th><th>用户</th><th>事件类型</th><th>分类</th><th>状态</th><th>时间</th><th></th>
            </tr>
            </thead>
            <tbody id="caseTable">
            <tr><td colspan="7" class="text-center text-muted">加载中...</td></tr>
            </tbody>
        </table>
        <div class="pagination-bottom" id="pagination"></div>
    </div>
</div>

<!-- 案件详情 Modal -->
<div class="modal fade" id="caseModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">案件详情 <span id="modalCaseId"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalBody">
                <div class="row mb-2">
                    <div class="col-md-3"><span class="text-muted">状态</span> <span id="mStatus"></span></div>
                    <div class="col-md-3"><span class="text-muted">评分</span> <span id="mScore"></span></div>
                    <div class="col-md-3"><span class="text-muted">等级</span> <span id="mLevel"></span></div>
                    <div class="col-md-3"><span class="text-muted">决策</span> <span id="mDecision"></span></div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-4"><span class="text-muted">业务ID</span> <span id="mSourceId"></span></div>
                    <div class="col-md-4"><span class="text-muted">事件类型</span> <span id="mEventType"></span></div>
                    <div class="col-md-4"><span class="text-muted">审核人</span> <span id="mReviewer"></span></div>
                </div>
                <h6 class="mt-3">命中规则</h6>
                <table class="table table-sm table-hover">
                    <thead class="table-light"><tr><th>规则ID</th><th>规则名</th><th>等级</th><th>分值</th><th>动作</th></tr></thead>
                    <tbody id="mRules"></tbody>
                </table>
                <div id="mReviewComment" class="alert alert-light border small"></div>
                <h6 class="mt-3">审核操作</h6>
                <form id="reviewForm" class="row g-2">
                    <div class="col-md-3">
                        <select class="form-select form-select-sm" id="reviewDecision">
                            <option value="已通过">通过</option>
                            <option value="已拒绝">拒绝</option>
                            <option value="已关闭">关闭</option>
                        </select>
                    </div>
                    <div class="col-md-3"><input class="form-control form-control-sm" id="reviewer" placeholder="审核人"></div>
                    <div class="col-md-4"><input class="form-control form-control-sm" id="reviewComment" placeholder="审核意见"></div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-sm btn-primary w-100">提交审核</button>
                    </div>
                    <div class="col-md-12 mt-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="addBlacklist">
                            <label class="form-check-label small" for="addBlacklist">同时把该经销商加入黑名单</label>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentPage = 1, currentStatus = '';

async function loadCases() {
    try {
        const data = await apiRequest(`/api/cases?status=${currentStatus}&page=${currentPage}&page_size=10`);
        document.getElementById('caseTotal').textContent = `共 ${data.total} 件`;
        const tbody = document.getElementById('caseTable');
        if (data.items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">暂无案件</td></tr>';
        } else {
            tbody.innerHTML = data.items.map(c => `
                <tr>
                    <td class="small">${c.case_id}</td>
                    <td>${c.user_id}</td>
                    <td>${c.event_type || '-'}</td>
                    <td>${c.case_category || '-'}</td>
                    <td><span class="badge bg-secondary">${c.case_status}</span></td>
                    <td class="small text-muted">${formatTime(c.create_time)}</td>
                    <td><button class="btn btn-sm btn-outline-primary" onclick="openCase('${c.case_id}')">详情</button></td>
                </tr>`).join('');
        }
        renderPagination(data.total, data.page, data.page_size);
    } catch (e) {
        document.getElementById('caseTable').innerHTML = `<tr><td colspan="7" class="text-center text-danger">${e.message}</td></tr>`;
    }
}

function renderPagination(total, page, pageSize) {
    const pages = Math.max(1, Math.ceil(total / pageSize));
    let html = '<nav><ul class="pagination">';
    html += `<li class="page-item ${page <= 1 ? 'disabled' : ''}"><a class="page-link" onclick="goPage(${page - 1})">‹</a></li>`;
    for (let i = 1; i <= pages && i <= 10; i++) {
        html += `<li class="page-item ${i === page ? 'active' : ''}"><a class="page-link" onclick="goPage(${i})">${i}</a></li>`;
    }
    html += `<li class="page-item ${page >= pages ? 'disabled' : ''}"><a class="page-link" onclick="goPage(${page + 1})">›</a></li>`;
    html += '</ul></nav>';
    document.getElementById('pagination').innerHTML = html;
}

function goPage(p) {
    if (p < 1) return;
    currentPage = p;
    loadCases();
}

document.getElementById('statusFilter').addEventListener('click', (e) => {
    // 用属性存在性判断, 不能用 !dataset.status (空字符串=「全部」也是合法值)
    if (!('status' in e.target.dataset)) return;
    document.querySelectorAll('#statusFilter .btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentStatus = e.target.dataset.status;
    currentPage = 1;
    loadCases();
});

async function openCase(caseId) {
    try {
        const c = await apiRequest(`/api/cases/${caseId}`);
        document.getElementById('modalCaseId').textContent = caseId;
        document.getElementById('mStatus').innerHTML = `<span class="badge bg-secondary">${c.case_status}</span>`;
        document.getElementById('mScore').textContent = c.final_score ?? '-';
        document.getElementById('mLevel').innerHTML = c.risk_level ? riskBadge(c.risk_level) : '-';
        document.getElementById('mDecision').innerHTML = c.decision ? decisionBadge(c.decision) : '-';
        document.getElementById('mSourceId').textContent = c.source_id || '-';
        document.getElementById('mEventType').textContent = c.event_type || '-';
        document.getElementById('mReviewer').textContent = c.reviewer || '-';

        const rulesTbody = document.getElementById('mRules');
        if (c.triggered_rules && c.triggered_rules.length) {
            rulesTbody.innerHTML = c.triggered_rules.map(r => `
                <tr><td>${r.rule_id}</td><td>${r.rule_name}</td><td>${riskBadge(r.risk_level)}</td><td>${r.risk_score}</td><td>${decisionBadge(r.action)}</td></tr>`).join('');
        } else {
            rulesTbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">无</td></tr>';
        }

        const rc = document.getElementById('mReviewComment');
        if (c.review_comment) {
            rc.style.display = 'block';
            rc.textContent = `审核意见: ${c.review_comment} (${c.reviewer || '未知'})`;
        } else {
            rc.style.display = 'none';
        }
        document.getElementById('reviewer').value = '';
        document.getElementById('reviewComment').value = '';
        new bootstrap.Modal(document.getElementById('caseModal')).show();
    } catch (e) {
        alert(e.message);
    }
}

document.getElementById('reviewForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const caseId = document.getElementById('modalCaseId').textContent;
    const reviewer = document.getElementById('reviewer').value.trim();
    if (!reviewer) { alert('请填审核人'); return; }
    try {
        await apiRequest(`/api/cases/${caseId}/review`, {
            method: 'POST',
            body: {
                decision: document.getElementById('reviewDecision').value,
                reviewer,
                review_comment: document.getElementById('reviewComment').value.trim() || null,
                add_to_blacklist: document.getElementById('addBlacklist').checked,
            },
        });
        bootstrap.Modal.getInstance(document.getElementById('caseModal')).hide();
        loadCases();
    } catch (err) {
        alert('审核失败: ' + err.message);
    }
});

loadCases();
</script>
{% endblock %}
