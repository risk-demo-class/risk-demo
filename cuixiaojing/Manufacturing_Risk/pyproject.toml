[project]
name = "manufacturing-risk"
version = "1.0.0"
description = "制造业风控系统: 经销商订货/设备保修/售后维修/串货举报 风险控制 (仿 AI_Risk 电商风控架构)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2",
    "pymysql>=1.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jinja2>=3.1",
    "ulid-py>=1.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# ML 双轨融合 (可选): 训练/推理 XGBoost 模型时才需要
ml = [
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "pandas>=2.0",
]

# AI 助手 LLM 模式 (可选): 不装则走内置规则问答
agent = [
    "deepagents>=0.5.0,<0.6.0",
    "langchain>=1.2.0,<1.3.0",
    "langchain-core>=1.4.0,<1.5.0",
    "langchain-openai>=1.1.0,<1.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
