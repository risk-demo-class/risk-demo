{% extends "base.html" %}
{% block title %}风险检查 - 物流寄递风控系统{% endblock %}
{% block content %}
<h4 class="mb-3"><i class="bi bi-search"></i> 物流风险检查</h4>
<div class="card stat-card mb-4"><div class="card-body">
  <form id="riskCheckForm" class="row g-3">
    <div class="col-md-4"><label class="form-label">事件类型</label>
      <select class="form-select" id="ck_event_type" required>
        <option value="寄件下单">寄件下单</option><option value="安检申报">安检申报</option>
        <option value="跨境申报">跨境申报</option><option value="签收处理">签收处理</option>
        <option value="代收货款结算">代收货款结算</option>
      </select>
    </div>
    <div class="col-md-4"><label class="form-label">业务来源ID</label>
      <input class="form-control" id="ck_source_id" required placeholder="运单S... / 申报D... / 签收R...">
    </div>
    <div class="col-md-4"><label class="form-label">寄件人ID</label>
      <input class="form-control" id="ck_user_id" required placeholder="如 U0000">
    </div>
    <div class="col-12"><div class="alert alert-info py-2 mb-0" id="sourceHelp"></div></div>
    <div class="col-12"><label class="form-label">事件补充数据（JSON，可选）</label>
      <textarea class="form-control" id="ck_event_data" rows="3" placeholder='{"channel":"课堂演示"}'></textarea>
    </div>
    <div class="col-12"><button class="btn btn-primary" type="submit" id="submitBtn"><i class="bi bi-shield-check"></i> 执行风险检查</button></div>
  </form>
</div></div>
<div id="errorBox" class="alert alert-danger d-none"></div>
<div id="resultCard" class="card stat-card d-none"><div class="card-body" id="resultBody"></div></div>
{% endblock %}
{% block extra_js %}
<script>
const help = {
 '寄件下单':'source_id 填 shipment_id，例如 S000001', '安检申报':'source_id 填 shipment_id，例如 S000000',
 '跨境申报':'source_id 填 declaration_id，例如 D000000', '签收处理':'source_id 填 delivery_id，例如 R000000',
 '代收货款结算':'source_id 填货到付款运单的 shipment_id'
};
function updateHelp(){ sourceHelp.textContent=help[ck_event_type.value]; }
ck_event_type.addEventListener('change',updateHelp); updateHelp();
const prefill=sessionStorage.getItem('risk_check_prefill');
if(prefill){ try{const p=JSON.parse(prefill); ck_event_type.value=p.event_type||'寄件下单'; ck_source_id.value=p.source_id||''; ck_user_id.value=p.user_id||''; updateHelp();}finally{sessionStorage.removeItem('risk_check_prefill');}}
riskCheckForm.addEventListener('submit',async(e)=>{
 e.preventDefault(); errorBox.classList.add('d-none'); resultCard.classList.add('d-none'); submitBtn.disabled=true;
 let eventData={}; const raw=ck_event_data.value.trim();
 try{if(raw) eventData=JSON.parse(raw);}catch(_){errorBox.textContent='事件补充数据不是有效JSON';errorBox.classList.remove('d-none');submitBtn.disabled=false;return;}
 try{
  const res=await fetch('/api/risk/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_type:ck_event_type.value,source_id:ck_source_id.value.trim(),user_id:ck_user_id.value.trim(),event_data:eventData})});
  const result=await res.json(); if(!res.ok) throw new Error(result.detail ? (typeof result.detail==='string'?result.detail:JSON.stringify(result.detail)) : `HTTP ${res.status}`);
  const rules=(result.triggered_rules||[]).map(r=>`<tr><td>${r.rule_id}</td><td>${r.rule_name}</td><td>${r.risk_level}</td><td>${r.action}</td></tr>`).join('');
  const mlBlock=result.ml_score != null ? renderMLScoreBlock(result.ml_score,result.ml_decision) : '<span class="text-muted">模型未加载，当前为纯规则模式</span>';
  resultBody.innerHTML=`<h5>检查结果：<span class="badge ${result.decision==='拒绝'?'bg-danger':result.decision==='人工审核'?'bg-warning':'bg-success'}">${result.decision}</span></h5>
   <div class="row mt-3"><div class="col-md-4">最终评分：<strong>${result.final_score}</strong></div><div class="col-md-4">风险等级：${result.risk_level}</div><div class="col-md-4">规则命中：${result.rule_count}</div></div>
   <h6 class="mt-4">命中规则</h6>${rules?`<table class="table table-sm"><thead><tr><th>ID</th><th>名称</th><th>等级</th><th>动作</th></tr></thead><tbody>${rules}</tbody></table>`:'<p class="text-muted">无规则命中</p>'}
   <h6 class="mt-4">ML 评分 <small class="text-muted">(XGBoost P(拒绝)，风险分使用 sigmoid 校准)</small></h6>${mlBlock}
   <details class="mt-4"><summary>特征详情（25维物流特征）</summary><pre class="mt-2">${JSON.stringify(result.features||{},null,2)}</pre></details>`;
  resultCard.classList.remove('d-none');
 }catch(err){errorBox.textContent=`检查失败：${err.message}`;errorBox.classList.remove('d-none');}finally{submitBtn.disabled=false;}
});
</script>
{% endblock %}
