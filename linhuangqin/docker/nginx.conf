# ─────────────────────────────────────────────
# 物流风控系统 (Logistics Risk) - Nginx 配置
# ─────────────────────────────────────────────

upstream logistics_risk_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;
    charset utf-8;

    # 访问日志（可选：按天轮转）
    access_log /var/log/nginx/logistics_risk_access.log;
    error_log  /var/log/nginx/logistics_risk_error.log;

    # 静态文件（如果有自定义前端）
    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API 代理
    location / {
        proxy_pass http://logistics_risk_app;

        # SSE 支持（Agent 流式输出）
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        proxy_buffering off;
        proxy_cache off;

        # 标准头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }
}