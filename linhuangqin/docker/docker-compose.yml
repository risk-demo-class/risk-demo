version: "3.8"

# ─────────────────────────────────────────────
# 物流风控系统 (Logistics Risk) - Docker Compose
# ─────────────────────────────────────────────
# 3 个容器: mysql + app + nginx
# 使用: docker compose -f docker/docker-compose.yml up -d
# ─────────────────────────────────────────────

services:
  mysql:
    image: mysql:8.0
    container_name: logistics_risk_mysql
    restart: unless-stopped
    env_file: ./docker/.env
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: risk_logistics
    ports:
      - "3306:3306"
    volumes:
      - logistics_risk_mysql_data:/var/lib/mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    image: logistics_risk_app:latest
    container_name: logistics_risk_app
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file: ./docker/.env
    environment:
      DATABASE_URL: mysql+aiomysql://root:root@mysql:3306/risk_logistics?charset=utf8mb4
      PYTHONUNBUFFERED: "1"
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - logistics_risk_app_logs:/app/logs
      - ../app/engine/xgb_model.json:/app/app/engine/xgb_model.json
    command: >
      sh -c "python scripts/init_db.py &&
             python scripts/gen_logistics_data.py --count 200 &&
             python scripts/gen_risky_users.py --count 30 &&
             gunicorn scripts.main:app
               --bind 0.0.0.0:8000
               --worker-class uvicorn.workers.UvicornWorker
               --workers 2
               --timeout 120
               --access-logfile logs/access.log
               --error-logfile logs/error.log"

  nginx:
    image: nginx:1.25-alpine
    container_name: logistics_risk_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  logistics_risk_mysql_data:
  logistics_risk_app_logs: