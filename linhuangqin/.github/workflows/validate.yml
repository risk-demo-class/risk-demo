name: Logistics Risk - Quick Validate

on:
  workflow_dispatch:
    inputs:
      count:
        description: '业务数据生成数量'
        required: false
        default: '200'
      limit:
        description: '模型训练数据限制 (条)'
        required: false
        default: '500'

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: risk_logistics
        ports: [3306:3306]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: mysql+aiomysql://root:root@localhost:3306/risk_logistics?charset=utf8mb4

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Step 1 - Init DB
        run: python scripts/init_db.py
        id: db_init

      - name: Step 2 - Generate data
        run: |
          python scripts/gen_logistics_data.py --count ${{ github.event.inputs.count || '200' }}
          python scripts/gen_risky_users.py --count 30
        id: data_gen

      - name: Step 3 - Verify data
        run: |
          python -c "
          import asyncio
          from app.database import async_engine
          from sqlalchemy import text
          async def verify():
              async with async_engine.connect() as conn:
                  events = await conn.execute(text('SELECT COUNT(*) FROM logistics_event_log'))
                  waybills = await conn.execute(text('SELECT COUNT(*) FROM waybill_info'))
                  shippers = await conn.execute(text('SELECT COUNT(*) FROM shipper_info'))
                  cases = await conn.execute(text('SELECT COUNT(*) FROM risk_case'))
                  print(f'logistics_event_log: {events.scalar()}')
                  print(f'waybill_info: {waybills.scalar()}')
                  print(f'shipper_info: {shippers.scalar()}')
                  print(f'risk_case: {cases.scalar()}')
                  assert events.scalar() >= 100, f'Need >= 100 events, got {events.scalar()}'
          asyncio.run(verify())
          "
        id: verify_data

      - name: Step 4 - Train model
        run: python scripts/train_xgb_model.py --limit ${{ github.event.inputs.limit || '500' }}
        id: train_model

      - name: Step 5 - Summary
        run: |
          echo "========================================"
          echo "✓ 验证完成!"
          echo "  数据库: 21 张表已创建"
          echo "  业务数据: 已生成"
          echo "  模型: 训练完成"
          echo "========================================"
